# pnpm settings (pnpm >= 11 reads overrides/build-script approvals from this file,
# NOT from a "pnpm" key in package.json — that key is ignored with a warning).
# This is a single-package repo: no `packages:` list on purpose.

# Version pins previously enforced via npm's top-level package.json "overrides"
# (transitive security/compat pins). Keep this list in sync with any advisory-driven
# bumps; pnpm applies them to the whole graph exactly like npm overrides did.
#
# 🔴 IF THE PACKAGE IS ALSO ONE OF OUR OWN `dependencies`, SCOPE THE ENTRY TO THE PARENT THAT NEEDS
# IT (`"parent>child": ^x.y.z`) — NEVER WRITE IT BARE. "the whole graph" above includes this repo's
# OWN direct dependency, and the override OUTRANKS package.json. So a bare entry lets the manifest
# be bumped while the lockfile keeps resolving the old version, and NOTHING turns red: CI and the
# production Dockerfile both install `--frozen-lockfile`, i.e. from the lockfile, so the checks only
# ever prove the OLD version installs cleanly.
#
# That is not hypothetical. A bare `nodemailer: ^9.1.1` here (added 2026-09-09 for the addressparser
# advisory) silently swallowed Dependabot #4698's bump to ^10.0.2 — package.json said 10, the graph
# ran 9.1.1, CI was green, and any manifest-only PR would have repeated it. #4717 fixed it by
# scoping to the two parents that genuinely pin below the floor. The bump does not fail, it WAITS:
# the real version change then lands inside whatever unrelated PR next regenerates the lockfile.
#
# Pinned by tests/pnpm-override-scope.test.ts (required `checks` job). Its allowlist is now EMPTY,
# so EVERY bare override over a direct dependency fails. Do not "fix" a red run by adding to it.
overrides:
  "@babel/core": ^7.29.6
  "@opentelemetry/core": ^2.8.0
  "@opentelemetry/resources": ^2.8.0
  "@opentelemetry/sdk-trace-base": ^2.8.0
  # Bumped 2026-08-03 for GHSA-rgw5-rvv9-x895 (DoS via unbounded intermediate arrays, which
  # bypasses the earlier CVE-2026-14257 mitigation). The previous ^1.1.16 / ^2.1.2 ranges
  # ALLOWED the patched versions but the lockfile still resolved below them, so the audit
  # failed on every PR until the floors themselves moved. Reached only transitively, via
  # exceljs > archiver/unzipper > glob/minimatch.
  "brace-expansion@1": ^1.1.18
  "brace-expansion@2": ^2.1.4
  # The advisory covers `>=4.0.0 <5.0.9` and patches at `>=5.0.9`, i.e. the 4.x line's fix ships
  # inside 5.x. The selector must be `@5`, NOT `@4`: this graph had already resolved to 5.0.8, so
  # an `@4` selector matches nothing and silently leaves the vulnerable version in place — the
  # lockfile is the only way to tell, since the override is accepted either way.
  # Reached via shadcn > ts-morph > minimatch. `shadcn` moved to `devDependencies` on 2026-08-04
  # (it is a scaffolding CLI; its only consumer is the build-time `@import "shadcn/tailwind.css"`
  # in app/globals.css), so this override is now DEV-ONLY — `pnpm why brace-expansion --prod`
  # returns just the 1.1.18/2.1.4 exceljs paths above, never a 5.x. Kept because the dev
  # toolchain still resolves it and the floor costs nothing.
  "brace-expansion@5": ^5.0.9
  # Added 2026-08-17 for GHSA-ggr8-5vv4-36mx (high): stack exhaustion merging recursive object
  # graphs. Advisory covers `<8.0.0`; the graph had resolved 7.1.5. Reached via
  # mailparser > html-to-text, and mailparser is a direct `dependencies` entry, so this is the
  # production graph and `pnpm audit --prod` goes red on it — as it did on every PR opened after
  # the advisory published. `main` itself was green at 13:45 Cairo and the next run at 16:25 was
  # not, with no diff between them: the same registry-reads-live shape as the nanoid note below.
  #
  # NOT REALISTICALLY EXPLOITABLE HERE, but pinned rather than ignored because the fix is clean.
  # html-to-text calls deepmergeCustom in exactly two places, both merging its OWN configuration —
  # `deepMergeWithOptionsComposeRules(defaultOptions, userOptions)` and a selector-map merge.
  # Neither ever sees email content, so nothing an applicant sends reaches the vulnerable path.
  #
  # This is a MAJOR bump against html-to-text's declared `^7.1.5`, and html-to-text@10.0.0 is the
  # latest release — there is no upstream fix to wait for, so an override is the only route. It was
  # verified rather than assumed: the full convert() output (defaults, wordwrap, and the selectors
  # compose rule with its custom metaDataUpdater) plus simpleParser's derived `mail.text` are
  # BYTE-IDENTICAL on 7.1.5 and 8.0.1. That derived text is the live recruitment CV-intake path.
  #
  # Unlike the `hono` note below, the cooling-off window is NOT a problem here: 8.0.1 published
  # 2026-08-16 05:45 UTC and installs clean, writing no `minimumReleaseAgeExclude` entry.
  deepmerge-ts: ^8.0.1
  body-parser: ^2.3.0
  # Bumped 2026-08-03 for GHSA-7p8r-x3mc-p8w7 (host confusion via a backslash authority
  # introducer). The advisory covers `>=3.0.0 <3.1.5`, so the previous ^3.1.3 floor ALLOWED the
  # patched version but the lockfile had resolved below it — the same shape as the
  # brace-expansion note above, and the reason every PR and `main` itself went red from
  # 2026-08-03 20:08 UTC. Reached only transitively, four ways, via
  # shadcn > @dotenvx/dotenvx > conf > ajv and shadcn > @modelcontextprotocol/sdk > ajv.
  # DEV-ONLY since 2026-08-04: shadcn moved to `devDependencies`, and it was fast-uri's only
  # route into the graph — `pnpm why fast-uri --prod` now returns nothing, so this can no
  # longer turn the CI audit (`pnpm audit --audit-level=high --prod`) red either way.
  # Deliberately KEPT rather than removed: the single fast-uri instance still resolves in the
  # dev graph via shadcn > ajv, and shadcn is a CLI that fetches remote registry URLs — exactly
  # the host-confusion exposure this advisory describes. A floor that protects the local
  # toolchain and cannot affect the production bundle is worth more than the lockfile churn of
  # dropping it.
  #
  # RE-BUMPED 2026-09-02 to ^3.1.6 for FOUR more advisories, all high, all published within three
  # minutes of each other on 2026-09-02: GHSA-5jgf-p345-68v8 (host confusion via skipped IDN
  # canonicalization on scheme-relative references, `>=3.1.3 <3.1.6`), GHSA-f65p-4m7j-42xc (SSRF
  # via malformed IPv6 normalization, `>=3.0.0 <3.1.6`), GHSA-fph4-wmhf-6fwf (SSRF via repeated
  # hostname percent-decoding, `>=3.1.2 <3.1.6`), GHSA-jqff-g426-hqxp (host confusion via
  # percent-encoded scheme normalization, `>=3.0.0 <3.1.6`). All four patch at 3.1.6.
  #
  # THIS IS THE ALLOW-BUT-RESOLVE-BELOW TRAP AGAIN — on the very package whose note above already
  # describes it, and the fourth occurrence recorded in this file. `^3.1.5` ALLOWED 3.1.6 from the
  # day it published (2026-08-23); the lockfile had simply resolved 3.1.5 and nothing forced a
  # re-resolve. The floor moves to ^3.1.6 so the resolution sits ABOVE the advisory rather than
  # merely being permitted to. If this shape recurs a fifth time the answer is a scheduled
  # `pnpm update`, not another hand-edited floor.
  #
  # Still DEV-ONLY — `pnpm why fast-uri --prod` returns nothing. Worth being precise about why CI
  # stayed green on four HIGH advisories: it is the `--prod` filter in
  # `pnpm audit --audit-level=high --prod` that hides these, not the severity filter.
  #
  # RE-BUMPED 2026-09-29 to ^3.1.7 for TWO more advisories, both HIGH, both patched at 3.1.7:
  # GHSA-qw65-cvwx-89v3 / CVE-2026-84292 (authority injection via an unvalidated port in serialize,
  # `>=3.0.0 <3.1.7`) and GHSA-58mr-gqgx-xq4g / CVE-2026-84394 (host confusion via an unclosed
  # bracket in the URI authority, `=3.1.6`). Same allow-but-resolve-below shape as every bump above:
  # the graph had resolved 3.1.6, which the second advisory names exactly. The floor moves to ^3.1.7
  # so the resolution sits ABOVE both advisories. Written as a caret floor for consistency with the
  # rest of this file and because ajv@8.20.0 — the only route into the graph — declares `^3.1.6`,
  # i.e. the 3.x line; a caret keeps the resolution inside it. Still DEV-ONLY (via shadcn > ajv), so
  # `pnpm audit --prod` never saw either advisory; fast-uri is transitive and no repo code imports it.
  fast-uri: ^3.1.7
  # Added 2026-08-03 for GHSA-mwp4-54f8-5fhr: Address4 decodes leading-zero octets as decimal
  # while resolvers decode them as octal, so a host like 0177.0.0.1 can pass a check and then
  # resolve somewhere else — SSRF and trust-boundary bypass. Patched at 10.3.1. Reached via
  # imapflow > socks, i.e. the SOCKS proxy path of the mail ingestion client, which unlike
  # shadcn is genuinely a runtime dependency. DO NOT remove this one alongside the dev-only
  # floors above: `pnpm why ip-address --prod` still resolves, so dropping it would put a live
  # SSRF bypass back into the production graph.
  # Bumped 2026-09-29 for Dependabot #81 (NAT64 64:ff9b:1::/48 not classified) and #82 (fe80::/64
  # vs fe80::/10 link-local), both SSRF/trust-boundary, both patched 10.5.1; still the
  # imapflow > socks production path.
  ip-address: ^10.5.1
  "@hono/node-server": ^2.0.5
  # Bumped 2026-09-10 for three advisories that all patch at 4.13.5: GHSA-gqvv-2mrq-wpjv
  # (`toSSG()` still writes files outside the output directory — the incomplete fix for
  # CVE-2026-39408), GHSA-g6gw-c38x-mqfc (unbounded dot-notation nesting in `parseBody()`
  # exhausts memory) and GHSA-crvj-82cr-hjcx (the query parser reads parameters after the URL
  # fragment, so a cache key and a proxy can disagree). The graph had resolved 4.12.34, which
  # already cleared the CORS ReDoS the previous note tracked (GHSA-8j4g-w8fx-2239) — that one is
  # CLOSED and this floor supersedes it, so the 2026-08-04 ACTION line is discharged.
  # Still DEV-ONLY: reached via shadcn > @modelcontextprotocol/sdk > @hono/node-server, and
  # `pnpm why hono --prod` returns nothing. No hono server is ever started in this repo, so none
  # of the three paths is reachable here; pinned anyway because the floor costs nothing.
  # The cooling-off trap from 2026-08-04 does NOT bite. The floor names 4.13.5 (published
  # 2026-08-26) but the caret resolved 4.13.7 (2026-09-04), and pnpm wrote NO
  # `minimumReleaseAgeExclude` entry for it — checked in this repo's manifests after the install,
  # which is the only way to tell. That hole is what the 2026-08-04 note refused, and it is still
  # refused: if a future bump cannot install without one, hold the floor instead.
  hono: ^4.13.5
  # Bumped 2026-09-10 for GHSA-2883-xcg3-v3hh (high): `maxTotalMergeKeys` caps the number of merge
  # keys but not the CPU spent on empty merge sources, so a crafted document still stalls the
  # parser. Advisory covers `>=4.0.0 <4.3.2`; the graph had resolved 4.3.1. DEV-ONLY and reached
  # twice — eslint > @eslint/eslintrc, and cosmiconfig — both of which parse only this repo's own
  # config files, so no untrusted YAML reaches either. The floor stays on the 4.x line on purpose:
  # js-yaml 5.x is a different API and eslintrc has not moved to it.
  js-yaml: ^4.3.2
  # Added 2026-08-13 for GHSA-2v37-7h3g-55p8 (high): a custom generator loops indefinitely when
  # size is zero. Advisory covers `<3.3.18`; the graph had resolved 3.3.17, published 2026-08-03.
  # The advisory landed mid-afternoon Cairo on 2026-08-13 and `pnpm audit` reads the registry live,
  # so PRs that had gone green an hour earlier stayed green while every NEW run went red — the
  # failure looks like it belongs to whatever diff is in flight and does not. Reached only
  # transitively, under postcss, four ways: next and sanitize-html (both direct `dependencies`,
  # so this IS production exposure) plus @tailwindcss/postcss and shadcn on the dev side. postcss
  # requires nanoid in the major-3 line, and 3.3.18 is a patch inside it, so this is a drop-in;
  # no postcss release resolving >=3.3.18 on its own existed when this was added.
  # Remove once postcss ships one.
  nanoid: ^3.3.18
  # Added 2026-09-09 for the Nodemailer addressparser advisory (high): quadratic O(n^2) time in
  # `addressparser` lets a crafted address list stall the event loop — remote denial of service.
  # Advisory covers `<9.1.0` and patches at 9.1.0; the graph had resolved TWO instances below it,
  # 9.0.3 and 9.0.5.
  #
  # THIS IS PRODUCTION, by both routes. `imapflow` is the mail-ingestion client and `mailparser` is
  # a direct `dependencies` entry — the same pair the deepmerge-ts and ip-address notes above are
  # about — so `pnpm audit --prod` goes red and every open PR is blocked until the floor moves.
  # It reads addresses off inbound mail, which is attacker-supplied by definition: anyone who can
  # send to the monitored careers@ inbox chooses the header this parses.
  #
  # A floor inside the 9.x major, not a jump to 10.x. imapflow and mailparser both declare 9.x, and
  # 9.1.1 is the newest release in that line, so this is a drop-in rather than a major bump forced
  # through an override. Remove once both parents resolve >=9.1.0 unaided.
  #
  # Same registry-reads-live shape as the nanoid and deepmerge-ts notes: main was green at 22:30
  # Cairo and the next run at 22:44 was not, with no diff between them. The failure looks like it
  # belongs to whatever branch is in flight, and does not.
  # WHERE IT BITES IF IT IS WRONG: mailbox monitoring and the CV intake reader, both of which speak
  # IMAP through imapflow. A parse regression there is silent — mail simply stops being read.
  #
  # SCOPED 2026-09-29, from a bare `nodemailer: ^9.1.1` to the two parents that actually need the
  # floor. A bare override applies to the WHOLE graph, INCLUDING this repo's own direct
  # `dependencies` entry — so it silently capped our own nodemailer at 9.1.1 too. That is exactly
  # why Dependabot #4698 could set package.json to `^10.0.2` and still leave the lockfile resolving
  # 9.1.1: the override outranks the manifest, and CI/Docker install `--frozen-lockfile`, so the
  # upgrade was a no-op wearing the shape of a bump. The advisory floor is unchanged for the two
  # parents that still pin below it — imapflow@1.4.9 declares an EXACT `nodemailer: 9.0.3` and
  # mailparser@3.9.16 an EXACT `9.0.5`, both under the `<9.1.0` advisory — while the direct
  # dependency is now free to resolve 10.x. The graph therefore holds two nodemailer copies on
  # purpose: 9.1.1 under the two mail READERS, 10.x for the SMTP SEND path. Collapse this back to a
  # bare override only once both parents resolve >=9.1.0 unaided (mailparser already does from
  # 3.9.26, which moved to nodemailer 10.x; imapflow dropped the dependency entirely in 2.x).
  "imapflow>nodemailer": ^9.1.1
  "mailparser>nodemailer": ^9.1.1
  # Bumped 2026-08-04 for GHSA-fxqj-rqcc-2cmp (incomplete fix of GHSA-6g55-p6wh-862q: an
  # attacker-controlled sourceMappingURL reads arbitrary .map files when `from` is unset).
  # Advisory covers `<=8.5.22`, patched at 8.5.23; the previous ^8.5.18 floor ALLOWED the fix but
  # the lockfile had resolved 8.5.22 — the same allow-but-resolve-below shape as the
  # brace-expansion and fast-uri notes above, now the third time this trap has hidden a live
  # advisory. Unlike those two dev-only floors this one was REAL PRODUCTION EXPOSURE:
  # `pnpm why postcss --prod` resolves through BOTH next and sanitize-html, each a direct
  # `dependencies` entry. Moderate severity, so CI's `--audit-level=high` gate would never have
  # caught it — only Dependabot did.
  postcss: ^8.5.23
  # Bumped 2026-09-02 for GHSA-x5fp-wj9c-mxmx (array-limit bypass via bracket-key comma parsing,
  # `>=6.14.2 <=6.15.3`) and GHSA-4mjr-xmp4-gh2g (DoS via attacker-controlled isBuffer,
  # `>=2.2.5 <6.16.0`) — both medium, both patched at 6.16.0.
  #
  # THE PIN ITSELF WAS THE BLOCKER, which is new: every other note in this file describes a floor
  # that ALLOWED the fix while the lockfile resolved below it. This one forbade the fix outright.
  # The previous value was an EXACT `6.15.2`, added by 7045c1b81 (2026-05-25) as its own advisory
  # fix back when 6.15.2 was the patched version. body-parser@2.3.0 declares `^6.15.2`, so the
  # graph would have picked up 6.16.0 unaided the day it published — the exact pin is the only
  # reason it did not. Written as a FLOOR now, like everything else here, so the next qs patch
  # lands without a hand edit and cannot silently freeze the graph again.
  #
  # DEV-ONLY, verified rather than assumed: `pnpm why qs --prod` returns nothing. One chain
  # reaches it — shadcn > @modelcontextprotocol/sdk > express > body-parser — and shadcn is a
  # scaffolding CLI in devDependencies. No file under src/ or app/ imports qs or express, and the
  # Dockerfile's runner stage copies only the import-traced .next/standalone (never the builder's
  # node_modules), so qs cannot enter the production image at all.
  #
  # CI could not have caught this: `pnpm audit --audit-level=high --prod` filters out BOTH medium
  # severity and the dev graph, so main stayed green the whole time. Dependabot alone saw it.
  qs: ^6.16.0
  # sharp REMOVED 2026-09-29 — it was bare, and therefore capping our own direct dependency. It was
  # added by 65c6e30a2 as a `>=0.35.3` floor for the libvips CVEs (CVE-2026-33327/33328/35590/35591),
  # and it is now REDUNDANT on both sides of the graph: package.json declares `^0.35.4`, already above
  # the floor, and next@16.3.3 declares `sharp: ^0.35.3` itself as an optionalDependency. Nothing is
  # un-pinned by deleting it. It was NOT merely mis-scoped, so scoping it to `next>sharp` would have
  # preserved an entry that protects nothing.
  #
  # Measured, not assumed: the lockfile's importer specifier read `^0.35.3` while package.json said
  # `^0.35.4` — the override was already overriding the manifest, exactly as the bare nodemailer entry
  # did. Regenerating resolution with it gone changes THREE lines and keeps sharp at 0.35.4; none of
  # its 25 platform `@img/sharp-*` packages move.
  tar: ^7.5.21
  tmp: ^0.2.6
  uuid: 11.1.1
  ws: 8.21.0
  # Added 2026-09-02 for GHSA-6gmq-8vp8-gcm6 (medium): XML fragment injection via an invalid
  # EntityReference.nodeName during requireWellFormed serialization. Advisory covers
  # `>=0.7.0 <=0.8.14` and patches at 0.8.15; the graph had resolved 0.8.13.
  #
  # THIS ONE IS PRODUCTION, unlike every dev-only floor above. `pnpm why @xmldom/xmldom --prod`
  # resolves through mammoth@1.12.0, a direct `dependencies` entry, and mammoth runs on UNTRUSTED
  # INPUT: src/lib/recruitment/cv-extraction.ts calls mammoth.extractRawText() on .docx files
  # uploaded by candidates through recruitment intake.
  #
  # Exposure is nonetheless believed LOW rather than nil, and keeping that distinction straight
  # matters more than the bump does: the advisory is in the SERIALIZATION path (XMLSerializer with
  # requireWellFormed) and extractRawText only ever reads. That is a reason to treat this as
  # routine hygiene rather than an incident — NOT a reason to defer it, since the vulnerable code
  # ships either way and the patch is a drop-in inside mammoth's own declared `^0.8.6`.
  #
  # CI would not have caught it: `pnpm audit --audit-level=high --prod` DOES cover the production
  # graph but filters MEDIUM out, so main stays green. Dependabot alone flagged it — the same
  # blind spot already recorded in the qs and postcss notes above.
  "@xmldom/xmldom": ^0.8.15
  # Bumped for two HIGH advisories, both patched at 7.29.1 (Dependabot #90 and #94): a TLS
  # certificate-validation bypass via dropped connect options in BalancedPool (>=7.24.1 <7.29.1)
  # and a DoS via an unrequested WebSocket subprotocol (>=7.0.0 <7.29.1). undici is transitive
  # only — an optional/peer dependency of openai@7.17.0 and a couple of others, never a direct
  # `dependencies` entry — so this is a bare entry, not a scoped one, and the peer ranges
  # (`>=5 <9`, `>=7.24.1`) both accept 7.29.1.
  "undici": 7.29.1


# Unlike npm, pnpm blocks dependency lifecycle scripts unless approved here
# (pnpm 11 hard-fails the install on undecided ones: ERR_PNPM_IGNORED_BUILDS).
# All four are approved `true` for exact behavioral parity with the previous
# npm setup, which always ran them. Any NEW dependency with a build script will
# fail the install until a decision is added here — that is deliberate
# (supply-chain guard).
# - supabase: postinstall downloads the Supabase CLI binary into node_modules;
#   required by the db:*/phase* migration-gate scripts (`pnpm exec supabase ...`).
# - sharp: transitive (next@16 image optimization) + a direct RUNTIME dependency.
#   Moved out of devDependencies on 2026-08-22: three code paths import it, and two of them
#   serve production — src/lib/direct-orders/invoice-scan.ts (invoice extraction) and
#   src/lib/hiring-documents/document-scan.ts (hiring-document scanning); the third is the
#   build-time scripts/optimize-brand-assets.mjs. It only ever reached production because the
#   Dockerfile installs dev dependencies too, so the declaration was a lie that a `--prod`
#   install or a dependency tidy-up would have turned into a runtime crash.
#   Prebuilt binaries via optional deps, script is a fallback compile — same as under npm.
#   NOTE: this does NOT fix the standalone-trace gap that took the Hiring Documents page down
#   the same day — the missing libvips .so is invisible to a JS tracer regardless of which
#   section declares the package. That fix lives in the Dockerfile and must stay.
# - protobufjs (via @google-cloud/logging): trivial postinstall (version aliasing).
# - unrs-resolver (via eslint-config-next): napi-postinstall fallback for the
#   prebuilt native binding.
allowBuilds:
  protobufjs: true
  sharp: true
  supabase: true
  # false, and verified rather than assumed: free OCR was measured end to end against the six real
  # scanned CVs with this package's install script never run (pnpm reported "Ignored build scripts:
  # tesseract.js@7.0.0"), and it read them. Downloading language data is what that script is for,
  # and src/lib/recruitment/cv-ocr.ts deliberately does not want that — the data is vendored at
  # assets/tessdata so a production server never fetches it from a CDN.
  tesseract.js: false
  unrs-resolver: true

# GHSA-mh99-v99m-4gvg (brace-expansion DoS via unbounded glob-pattern expansion, patched
# at 5.0.8): three separate brace-expansion instances exist in the graph (1.1.16, 2.1.2,
# 5.0.8-via-minimatch@10.2.5) behind eslint's config-array, Sentry's/shadcn's bundler
# tooling, AND exceljs's zip handling (archiver/unzipper -> glob@7.2.3 -> minimatch@3.1.5).
# Forcing all instances to 5.x broke eslint outright (minimatch@3.1.5's braceExpand() calls
# an `expand` export removed in brace-expansion 5.x) — confirmed by reproducing locally.
# Ignoring rather than force-upgrading: the exploit requires an attacker-controlled glob
# pattern reaching brace-expansion's expand(); exceljs's use here is internal zip-archive
# path handling during XLSX read/write, never a user-supplied pattern string, so this
# app's exposure is not realistically exploitable. Revisit once eslint's config-array,
# Sentry's bundler-plugin-core, and archiver's own dependency chain bump their minimatch
# pins to a brace-expansion-5.x-compatible release.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

# Hoist the canvas addon to the root node_modules so Next's standalone build can actually LOAD it.
#
# pnpm's isolated layout puts a TRANSITIVE package under node_modules/.pnpm and links it only into
# the node_modules of packages that declare it. That works at runtime here, but it does not survive
# Next's production file-tracing: outputFileTracingIncludes copies real FILES (its glob runs with
# nodir:true), never pnpm's symlinks. So a package traced into .next/standalone arrives at its .pnpm
# path with NONE of the links that made it resolvable, and require('@napi-rs/canvas') throws
# MODULE_NOT_FOUND in production while working perfectly in dev.
#
# That cost a production deploy on 2026-08-22 (#2299): the trace globs were correct and the bytes
# shipped, but two separate links were missing — the one pdfjs-dist uses to see the canvas wrapper,
# and the one the wrapper uses to see its own per-platform Skia binary. Hoisting @napi-rs/* puts
# both packages where Node's ordinary walk-up finds them from any depth, which is what makes the
# trace entries in next.config.ts usable at all. pdf-parse -> pdfjs-dist reaches canvas by package
# NAME through a runtime createRequire, so a resolvable location is the entire requirement.
#
# Layout only: this changes where packages are linked, never which versions resolve, so
# pnpm-lock.yaml is unaffected.
publicHoistPattern:
  - "@napi-rs/*"
