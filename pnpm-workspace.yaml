# Unlike npm, pnpm blocks dependency lifecycle scripts unless approved here
# (pnpm 11 hard-fails the install on undecided ones: ERR_PNPM_IGNORED_BUILDS).
# All four are approved `true` for exact behavioral parity with the previous
# npm setup, which always ran them. Any NEW dependency with a build script will
# fail the install until a decision is added here — that is deliberate
# (supply-chain guard).
# - supabase: postinstall downloads the Supabase CLI binary into node_modules;
#   required by the db:*/phase* migration-gate scripts (`pnpm exec supabase ...`).
# - sharp: transitive (next@16 image optimization) + a direct RUNTIME dependency.
#   Moved out of devDependencies on 2026-08-22: three code paths import it, and two of them
#   serve production — src/lib/direct-orders/invoice-scan.ts (invoice extraction) and
#   src/lib/hiring-documents/document-scan.ts (hiring-document scanning); the third is the
#   build-time scripts/optimize-brand-assets.mjs. It only ever reached production because the
#   Dockerfile installs dev dependencies too, so the declaration was a lie that a `--prod`
#   install or a dependency tidy-up would have turned into a runtime crash.
#   Prebuilt binaries via optional deps, script is a fallback compile — same as under npm.
#   NOTE: this does NOT fix the standalone-trace gap that took the Hiring Documents page down
#   the same day — the missing libvips .so is invisible to a JS tracer regardless of which
#   section declares the package. That fix lives in the Dockerfile and must stay.
# - unrs-resolver (via eslint-config-next): napi-postinstall fallback for the
#   prebuilt native binding.
allowBuilds:
  sharp: true
  supabase: true
  # false, and verified rather than assumed: free OCR was measured end to end against the six real
  # scanned CVs with this package's install script never run (pnpm reported "Ignored build scripts:
  # tesseract.js@7.0.0"), and it read them. Downloading language data is what that script is for,
  # and src/lib/recruitment/cv-ocr.ts deliberately does not want that — the data is vendored at
  # assets/tessdata so a production server never fetches it from a CDN.
  tesseract.js: false
  unrs-resolver: true

# 🔴 THERE IS NO `auditConfig` HERE ANY MORE, AND THAT IS DELIBERATE — DO NOT ADD ONE BACK TO QUIET A
# RED AUDIT. This file suppressed exactly one advisory, GHSA-mh99-v99m-4gvg (brace-expansion DoS via
# unbounded glob-pattern expansion), and the suppression was RETIRED on 2026-09-30 because it had
# stopped masking anything.
#
# Its justification had gone quietly out of date, which is the interesting part. The note said
# GHSA-mh99's "only fix is the brace-expansion-5.x jump", that forcing every instance to 5.x breaks
# eslint (true — minimatch@3.1.5's braceExpand() calls an `expand` export 5.x removed, reproduced
# locally at the time), and therefore that the 1.x and 2.x lines "cannot take it". That last step is
# what was wrong: the advisory patches SEPARATELY IN EACH LINE, at 1.1.17, 2.1.3, 3.0.3 and 5.0.8 —
# so the 5.x jump was never the only fix, and the per-major floors raised for two *different*
# advisories (#4847: `@1: ^1.1.21`, `@2: ^2.1.7`, `@5: ^5.0.12`) had already cleared this one as a
# side effect. Every resolved instance now sits above its own line's patch floor.
#
# Verified before removal rather than argued: OSV reports no advisory against brace-expansion 1.1.21,
# 2.1.7 or 5.0.12, and `pnpm audit --audit-level=high --prod` — the exact command `validate` runs —
# answers "No known vulnerabilities found", exit 0, WITH the ignore and WITHOUT it, measured on the
# self-hosted box against f37bdea8f. So the entry was suppressing nothing and only hiding whether it
# still needed to.
#
# The reason to care about a dead suppression: `pnpm audit` is a required gate, and an `ignoreGhsas`
# entry is the one thing that can make it answer green about a package it has actually flagged. Left
# in place it ages into exactly the blind spot the gate exists to remove — and nothing re-tests
# whether it is still needed, because a suppression has no expiry. If a future advisory genuinely
# cannot be fixed, raise the override floor for its own major line first; that is what worked here.

# Hoist the canvas addon to the root node_modules so Next's standalone build can actually LOAD it.
#
# pnpm's isolated layout puts a TRANSITIVE package under node_modules/.pnpm and links it only into
# the node_modules of packages that declare it. That works at runtime here, but it does not survive
# Next's production file-tracing: outputFileTracingIncludes copies real FILES (its glob runs with
# nodir:true), never pnpm's symlinks. So a package traced into .next/standalone arrives at its .pnpm
# path with NONE of the links that made it resolvable, and require('@napi-rs/canvas') throws
# MODULE_NOT_FOUND in production while working perfectly in dev.
#
# That cost a production deploy on 2026-08-22 (#2299): the trace globs were correct and the bytes
# shipped, but two separate links were missing — the one pdfjs-dist uses to see the canvas wrapper,
# and the one the wrapper uses to see its own per-platform Skia binary. Hoisting @napi-rs/* puts
# both packages where Node's ordinary walk-up finds them from any depth, which is what makes the
# trace entries in next.config.ts usable at all. pdf-parse -> pdfjs-dist reaches canvas by package
# NAME through a runtime createRequire, so a resolvable location is the entire requirement.
#
# Layout only: this changes where packages are linked, never which versions resolve, so
# pnpm-lock.yaml is unaffected.
publicHoistPattern:
  - "@napi-rs/*"

# pnpm 11 QUARANTINES a freshly-published version: an install refuses to adopt a package younger
# than the minimum release age, which is the defence against a compromised publish being pulled into
# the graph within minutes of going up. `next` 16.3.8 was published 2026-09-30T16:13:46Z and adopted
# here the same evening at about two hours old, so pnpm wrote these ten entries itself — the `next`
# package, `@next/env`, and the nine per-platform `@next/swc-*` binaries — recording that the
# quarantine was waived for exactly these versions and nothing else. They are NOT optional: CI and
# the production Dockerfile both install from the lockfile, and without this block that install has
# to re-decide the quarantine.
#
# WHY IT IS WAIVED HERE. 16.3.8 is a security release — a HIGH server-side request forgery in Image
# Optimization, plus six further advisories including cache poisoning of SSG/ISR pages that names
# self-hosted deployments specifically, which is what this app is. Sitting out the quarantine keeps a
# known HIGH in a production dependency, and `validate`'s FIRST step is
# `pnpm audit --audit-level=high --prod` (scripts/ci-dependency-audit.mjs): the moment the advisory
# feed ingests it, every pull request AND `main` goes red, and a red check suite on a `main` commit
# makes Railway mark that production deploy SKIPPED (AGENTS.md §2.3). That is not hypothetical — it
# is exactly what 16.3.3's next/og RCE did earlier the same day (#4956). The risk of adopting a
# Vercel security patch early is smaller than the risk of holding a HIGH and freezing deploys.
#
# 🔴 THESE ENTRIES ARE VERSION-EXACT AND MUST NOT BE GENERALISED TO A BARE PACKAGE NAME. They stop
# applying the instant any of these ten resolves to something else, and that expiry is the whole
# reason the waiver is safe. pnpm appends to this block on any install that adopts a young version,
# so entries appearing here that you did not intend are a young package entering the graph — read
# them before committing rather than treating the block as generated noise.
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8

# ── TWO ADVISORIES vuln-scan.mjs REPORTS THAT ARE DELIBERATELY NOT OVERRIDDEN (2026-10-06) ────────
#
# `scripts/vuln-scan.mjs` prints "add an override for X in pnpm-workspace.yaml" beside every
# transitive finding, unconditionally. For these two that advice cannot be followed, and the next
# session to read a red-looking scan should not spend the evening rediscovering why.
#
#   braces@3.0.3 — GHSA-vfj7-8cjw-p6xm, HIGH. 3.0.3 IS the latest published version; there is no
#   fixed release to float to, so an override has nowhere to point. Reached only through the DEV
#   graph (eslint-config-next > @next/eslint-plugin-next > fast-glob > micromatch, and shadcn >
#   ts-morph), never `--prod`, which is why `pnpm audit --audit-level=high --prod` stays green on it
#   and the gate is not lying. Revisit when braces publishes a fix, not before.
#
#   sprintf-js@1.0.3 — GHSA-hp3w-g68c-fv3c, MODERATE (unbounded precision specifiers). 1.1.3 fixes
#   it, and the single path is PRODUCTION: mammoth > argparse@1.0.10, which pins `~1.0.2`. Left
#   alone on exposure rather than on difficulty — argparse formats its OWN usage and error strings,
#   so no input mammoth reads from a .docx ever reaches a format string, while mammoth is the DOCX
#   reader behind CV extraction and a forced minor across argparse's pin is a real change to a live
#   recruitment path for a DoS that cannot be triggered. `--audit-level=high` does not see a
#   moderate either way. Fix it by moving mammoth to a release that drops argparse 1.x, not by
#   forcing the floor under it.
