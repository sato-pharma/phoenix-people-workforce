  # recurred a fifth time the answer is a scheduled `pnpm update` rather than another hand floor:
  # that is now DUE. It is not done in this change because this one is fixing WITHHELD PRODUCTION
  # DEPLOYS (see the brace-expansion note above) and a blanket update is its own blast radius.
  # Still DEV-ONLY via shadcn > ajv, so `pnpm audit --prod` never sees it - but the failing Dependabot
  # job it causes withholds production deploys, which is why it is bumped now rather than at leisure.
  fast-uri: ^3.1.8
