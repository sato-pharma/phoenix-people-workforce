  # the graph had resolved 3.1.6, which the second advisory names exactly. The floor moves to ^3.1.7
  # so the resolution sits ABOVE both advisories. Written as a caret floor for consistency with the
  # rest of this file and because ajv@8.20.0 — the only route into the graph — declares `^3.1.6`,
  # i.e. the 3.x line; a caret keeps the resolution inside it. Still DEV-ONLY (via shadcn > ajv), so
  # `pnpm audit --prod` never saw either advisory; fast-uri is transitive and no repo code imports it.
  # RE-BUMPED 2026-09-30 to ^3.1.8: the advisory covers `>=3.0.0 <3.1.8` and patches at 3.1.8, and the
