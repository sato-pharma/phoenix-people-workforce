name: Deploy Drift Check

# WHY THIS EXISTS (added 2026-08-13). Production's Railway service was source-configured to
# auto-deploy from a git branch literally named `staging`, not `main`. That branch had gone
# stale, so five already-merged, already-CI-green PRs (#2093, #2095, #2094, #2098, #2097) sat
# unshipped in production for hours while `main` moved on — with no error, no failed check, and
# no signal anywhere. AGENTS.md's core claim ("a merge to main SHIPS TO PRODUCTION IMMEDIATELY")
# was silently false for that window. Found only by a manual `railway status` check.
#
# This closes that gap the same way migration-drift-check.yml closes the analogous one for the
# database: a merged PR and a green CI run are not proof of what's actually live — only checking
# live state is. A branch-source misconfiguration produces exactly this failure mode again with
# zero warning, since GitHub shows the merge as completely normal either way.
#
# WHAT IT CHECKS. On a schedule (not push/pull_request — this looks for drift that accumulates
# AFTER merge, the same reasoning migration-drift-check.yml uses), compares `main`'s current HEAD
# SHA (read live from the GitHub API, not the trigger's own `github.sha` — correct regardless of
# how the run was triggered, and needs no checkout) against the `revision` production's own
# /api/healthz reports it is running.
#
# WHY THE REFERENCE IS A SETTLED COMMIT, NOT main HEAD (rewritten 2026-09-28).
# 🔴 THIS CHECK USED TO CAUSE THE VERY DRIFT IT MEASURES, and that is worth understanding before
# touching the comparison. It compared production against main HEAD for equality, with a
# 3-minute grace. That grace was written 2026-08-13, when a merge deployed immediately. The
# deploy is now GATED on that commit's own CI (Railway "Wait for CI"), so it does not even
# START until CI concludes — 5m24s on the commit below. And a scheduled run's check suite
# attaches to whatever commit is main HEAD at the time, while Railway withholds a deploy when
# ANY suite on the commit fails. So this workflow's own false alarm withheld the deploy it was
# measuring. Measured on cd9e0be03 (#4579), all times UTC:
#     22:29:46  merge            22:29:49  ci.yml starts (deploy blocked until it ends)
#     22:32:24  this check fires — production is legitimately still the older revision
#     22:35:13  ci.yml GREEN     22:35:35  this check concludes FAILURE (grace expired 22s early)
#     22:35:40  Railway marks the deployment SKIPPED — five seconds later
# ci.yml was 100% green; the only red suite on that commit was THIS workflow. The false
# positive made itself true, and the next merge carried production forward, which is why it
# went unnoticed for as long as it did.
# THE FIX, two parts. (1) Compare against the newest commit already older than SETTLE_MINUTES —
# one that has genuinely had time to ship — never against a HEAD that merged seconds ago.
# (2) Test ANCESTRY, not equality: this repo merges every few minutes, so production is
# legitimately a commit or two behind HEAD almost always, and equality reads that as drift. The
# 3-minute grace stays as a cheap second chance. Real drift (a stale Railway source branch)
# persists for hours and is still caught on the very next run.
#
# COST. Deliberately no checkout, no Node, no pnpm install — this needs nothing but curl, so a
# normal (in-sync) run finishes in a few seconds. Actions cost in this repo has hit the spending
# cap before and frozen every merge, so this stays cheap: 30-minute cadence, ~48 runs/day, only
# the rare drifting run pays the 3-minute grace sleep.
#
# ALERTING. Reuses the same TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID secrets and Bot API call
# migration-drift-check.yml already uses — the owner's existing Telegram channel, not a new
# recipient. migration-drift-check.yml's own header documents why this step exists at all: "a
# failing scheduled workflow notifies no one — GitHub emails the run author, and a cron run has
# none." A schedule-triggered failure with no notification step is invisible by construction.
on:
  schedule:
    - cron: "9,39 * * * *" # every 30 min, offset from the shared :00/:15/:30/:45 firing minute
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram alert and stop (proves the alarm still works)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # read this workflow own past runs, to count the failure streak

# 🔴 cancel-in-progress IS FALSE, AND THAT IS THE SAME RULE AS THE `continue-on-error` BELOW.
# A CANCELLED check suite withholds a production deploy exactly as a red one does (AGENTS.md §2.3:
# "red, cancelled, or still queued = no deploy"). This workflow sleeps 180 seconds in a grace window
# where a newer scheduled run or a manual dispatch would supersede it, and the cancelled suite that
# leaves behind lands on whatever commit is `main` HEAD — so cancelling this alarm silently costs the
# very deploy it was measuring. Superseding was never worth much here anyway: the grace re-read
# settles the answer in three minutes, and two overlapping runs agree.
concurrency:
  group: deploy-drift-check
  cancel-in-progress: false

jobs:
  deploy-drift-check:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # 🔴 EVERY `continue-on-error` STEP BELOW CARRIES ITS OWN `timeout-minutes`, AND THIS CEILING
    # SITS ABOVE THEIR SUM (2026-10-13). A JOB that hits its ceiling concludes `cancelled`, which
    # withholds that `main` commit's production deploy exactly as a failure does — and a timeout is
    # not a step failure, so `continue-on-error` cannot absorb it. A STEP that hits its own ceiling
    # fails only that step, which `continue-on-error` turns into a reported finding with the job
    # still green. Account and the two runs it cost: migration-drift-check.yml, above its job.
    # Pinned by tests/github-workflow-validity.test.ts.
    timeout-minutes: 15
    steps:
      # 🔴 continue-on-error PLUS AN id, NOT A BARE `exit 1` — THIS ALARM'S OWN FAILURE USED TO
      # WITHHOLD THE DEPLOY IT MEASURES. A scheduled run attaches its check suite to whatever commit
      # is `main` HEAD when it fires, and Railway's production trigger has Wait-for-CI on
      # (`checkSuites: true`, read live off the deployment trigger 2026-09-30), so ANY failed suite on
      # that commit marks its deploy `inactive` — never `success`, permanently, seconds after the
      # suite concludes. A red drift alarm therefore DEEPENED the drift. That is not hypothetical:
      # this file's own header records it happening to cd9e0be03 on 2026-09-27, and the fix applied
      # then (a settled reference instead of HEAD) only made the alarm right more often — it left the
      # mechanism in place.
      #
      # So the finding is REPORTED, never thrown: the step keeps its `::error::` and its `exit 1`, the
      # runner records the step as failed, the Telegram alert still fires, and the JOB concludes
      # success so the suite stays green. Same shape as synthetic-journeys.yml and
      # staging-hr-drift-check.yml, whose header states the rule this now obeys: "NEITHER STEP MAY
      # FAIL ON A FINDING … Only a BROKEN check fails."
      - name: Compare production's deployed revision against a SETTLED commit
        id: production
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # How long a merge is given to reach the environment before its absence counts as
          # drift. It MUST exceed CI + build, because the deploy does not start until CI ends.
          SETTLE_MINUTES: "15"
        run: |
          set -euo pipefail

          api() { curl -fsS --max-time 10 -H "Authorization: Bearer ${GH_TOKEN}" "$@"; }

          fetch_live_revision() {
            curl -fsS --max-time 10 https://phoenix-hr.satopharma.com/api/healthz \
              | jq -r '.revision // empty'
          }

          HEAD_SHA=$(api "https://api.github.com/repos/${REPO}/commits/main" | jq -r '.sha')
          echo "main HEAD: $HEAD_SHA"

          # NOT HEAD — see this file's header, "WHY THE REFERENCE IS A SETTLED COMMIT". A commit
          # merged moments ago has not had time to ship: its deploy waits for its own CI first.
          UNTIL=$(date -u -d "-${SETTLE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          REF_SHA=$(api "https://api.github.com/repos/${REPO}/commits?sha=main&until=${UNTIL}&per_page=1" \
            | jq -r '.[0].sha // empty')
          if [ -z "$REF_SHA" ]; then
            echo "Nothing is older than ${SETTLE_MINUTES}m, so nothing has had time to ship. In sync by construction."
            exit 0
          fi
          echo "settled ref (${SETTLE_MINUTES}m): $REF_SHA"

          # In sync means the live revision CONTAINS the settled commit — ancestry, not equality,
          # and no checkout: one compare call. behind/diverged is the only real drift.
          contains_ref() {
            [ -n "${1:-}" ] || return 1
            local status
            status=$(api "https://api.github.com/repos/${REPO}/compare/${REF_SHA}...${1}" \
              | jq -r '.status // empty') || return 1
            echo "  compare ${REF_SHA:0:9}...${1:0:9} = ${status:-<unknown>}" >&2
            case "$status" in identical | ahead) return 0 ;; *) return 1 ;; esac
          }

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "production (check 1): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "In sync — production contains the settled commit."
            exit 0
          fi

          echo "Mismatch (or healthz unreachable) — waiting 3 minutes for an in-flight Railway build to land before treating this as real drift..."
          sleep 180

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "production (check 2): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "Caught up during the grace window. In sync."
            exit 0
          fi

          # ── NAME THE SUITE THAT REFUSED IT, rather than telling a human to go and look ──────────
          #
          # Until 2026-09-30 this step's own error text said "READ THE CHECK SUITES ON main HEAD FIRST
          # — gh api …/check-suites", plus which four apps to ignore. That instruction was correct and
          # it was still a manual step, at 4am, by someone who has to know that `queued` on `sentry`
          # means nothing and `failure` on a Dependabot `dynamic` run means everything. It cost a
          # two-hour diagnosis on 2026-09-30 for a withheld deploy whose cause was one line of JSON.
          #
          # The classification is the same one `.claude/skills/ship/verify-shipped.mjs` applies
          # (`classifyWithheld`): a BAD conclusion is failure / cancelled / timed_out /
          # action_required / startup_failure, and `sentry`, `claude`, `vercel` and `railway-app` are
          # excluded because they sit at `queued` FOREVER on every commit and do not hold the gate —
          # measured on two commits that deployed normally. Chasing those four is the single most
          # common wasted move during one of these.
          #
          # BOTH commits are asked about on purpose. The withheld deploy belongs to the settled ref,
          # but a later merge carries production forward, so if production is behind the settled ref
          # then HEAD did not ship either and a failure on either commit can be the reason.
          #
          # 🔴 BEST-EFFORT, AND IT MUST STAY THAT WAY. Every call is `|| true` and every branch still
          # produces a line, because an alarm must never fail because the thing describing it failed —
          # the same rule the streak line downstream is built on. `set -euo pipefail` is in force here,
          # so an unguarded curl would abort the step and lose the alert entirely.
          classify_suites() {
            local sha="$1" label="$2" json
            json=$(api "https://api.github.com/repos/${REPO}/commits/${sha}/check-suites?per_page=100" 2>/dev/null || true)
            if [ -z "$json" ]; then
              printf '%s %s: check suites unreadable' "$label" "${sha:0:9}"
              return 0
            fi
            printf '%s' "$json" | jq -r --arg label "$label" --arg sha "${sha:0:9}" '
              # 🔴 AN UNREADABLE ANSWER MUST NOT READ AS A CLEAN ONE. Without this first branch a 200
              # carrying an unexpected shape — `{}`, or `{"message":"Not Found"}` — falls through every
              # filter and prints "every gating suite GREEN", i.e. it actively tells the reader the gate
              # did not refuse the deploy when nothing was actually read. Verified by feeding it `{}`.
              if (.check_suites | type) != "array" or (.check_suites | length) == 0 then
                "\($label) \($sha): NO check suites reported — unreadable, do NOT read this as clean"
              else
              ( [ .check_suites[]
                  | select(((.app.slug // "") | IN("sentry","claude","vercel","railway-app")) | not) ] ) as $gating
              | ( [ $gating[] | select((.conclusion // "") | IN("failure","cancelled","timed_out","action_required","startup_failure")) ] ) as $bad
              | if ($bad | length) > 0 then
                  "\($label) \($sha): REFUSED BY " + ([ $bad[] | "\(.app.slug // "?")=\(.conclusion)" ] | join(", "))
                elif ([ $gating[] | select((.status // "") != "completed") ] | length) > 0 then
                  "\($label) \($sha): still running — " + ([ $gating[] | select((.status // "") != "completed") | "\(.app.slug // "?")=\(.status)" ] | join(", "))
                elif ($gating | length) == 0 then
                  "\($label) \($sha): only the never-gating apps reported — unreadable, do NOT read this as clean"
                else
                  "\($label) \($sha): every gating suite GREEN — the gate did not refuse this one"
                end
              end' 2>/dev/null || printf '%s %s: check suites unparseable' "$label" "${sha:0:9}"
          }

          SUITES_REF="$(classify_suites "$REF_SHA" "settled_ref" || true)"
          SUITES_HEAD=""
          [ "$HEAD_SHA" != "$REF_SHA" ] && SUITES_HEAD="$(classify_suites "$HEAD_SHA" "main HEAD" || true)"
          SUITE_VERDICT="$SUITES_REF"
          [ -n "$SUITES_HEAD" ] && SUITE_VERDICT=$(printf '%s | %s' "$SUITES_REF" "$SUITES_HEAD")
          echo "suite verdict: $SUITE_VERDICT"

          echo "DRIFT_SCOPE=PRODUCTION" >> "$GITHUB_ENV"
          # Multiline-safe delimiter form: a bare `K=V` breaks the file if the value ever gains a newline.
          {
            echo "DRIFT_SUITES<<DRIFT_SUITES_EOF"
            printf '%s\n' "$SUITE_VERDICT"
            echo "DRIFT_SUITES_EOF"
          } >> "$GITHUB_ENV"
          echo "::error::Production is NOT serving a main commit that is already ${SETTLE_MINUTES} minutes old. settled_ref=$REF_SHA main=$HEAD_SHA production=${LIVE_SHA:-<unreachable>}. WHY THE DEPLOY WAS WITHHELD, already read for you: ${SUITE_VERDICT}. A named REFUSED BY is the cause — fix that workflow, and note that re-running it green does NOT resurrect the skipped deploy; the next merge carries production forward. If every gating suite is GREEN, this is instead the failure mode fixed 2026-08-13 (Railway production tracking the wrong source branch): railway status --project dc218ad3-99b7-4aff-be38-953a57524a71 --environment production --json, then inspect .environments.edges[0].node.serviceInstances.edges[].node.latestDeployment.meta.branch — it must read \"main\". The raw data is gh api repos/${REPO}/commits/\$SHA/check-suites; sentry, claude, vercel and railway-app sit at queued forever and never hold the gate."
          exit 1

      # STAGING, once it has a branch of its own (added 2026-09-27, dormant until then).
      #
      # 🔴 GATED ON A VARIABLE ON PURPOSE. While staging still deploys from `main` this check would
      # be comparing the wrong two things and would alarm constantly, and an alarm that cries wolf is
      # worse than no alarm. Set `STAGING_TRACKS_BRANCH=staging` (a repository variable) in the SAME
      # change that repoints Railway's staging environment, and not before:
      #   gh variable set STAGING_TRACKS_BRANCH --body staging
      # Unset it again if staging is ever pointed back at `main`.
      #
      # 🔴 RETIRED 2026-10-14 (owner, cost cuts): staging-branch-sync.yml is DELETED and the Railway staging
      # app is stopped, so nothing writes a `staging` branch and this leg has no source. It stays dormant
      # on purpose; do NOT set STAGING_TRACKS_BRANCH. If staging is ever brought back with a branch of
      # its own, the sync workflow has to come back first (git history: staging-branch-sync.yml, #4552).
      # Original reason, kept for that day: a staging source branch nobody advances drifts silently,
      # the 2026-08-13 shape in this file's header, and production's check above cannot see it.
      # `continue-on-error` here for the same reason as the production step above, and it also
      # restores something the old `exit 1` took away: with production failing the job outright, this
      # step never ran when production drifted, so a simultaneous staging drift stayed invisible until
      # production was fixed. Now both always run and both are reported.
      - name: Compare staging's deployed revision against a SETTLED commit
        id: staging
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ !inputs.test_alert && vars.STAGING_TRACKS_BRANCH != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ vars.STAGING_TRACKS_BRANCH }}
          # How long a merge is given to reach the environment before its absence counts as
          # drift. It MUST exceed CI + build, because the deploy does not start until CI ends.
          SETTLE_MINUTES: "15"
        run: |
          set -euo pipefail

          api() { curl -fsS --max-time 10 -H "Authorization: Bearer ${GH_TOKEN}" "$@"; }

          fetch_live_revision() {
            curl -fsS --max-time 10 https://phoenix-people-workforce-staging.up.railway.app/api/healthz \
              | jq -r '.revision // empty'
          }

          HEAD_SHA=$(api "https://api.github.com/repos/${REPO}/commits/${BRANCH}" | jq -r '.sha')
          echo "${BRANCH} HEAD: $HEAD_SHA"

          # NOT HEAD — see this file's header, "WHY THE REFERENCE IS A SETTLED COMMIT". A commit
          # merged moments ago has not had time to ship: its deploy waits for its own CI first.
          UNTIL=$(date -u -d "-${SETTLE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          REF_SHA=$(api "https://api.github.com/repos/${REPO}/commits?sha=${BRANCH}&until=${UNTIL}&per_page=1" \
            | jq -r '.[0].sha // empty')
          if [ -z "$REF_SHA" ]; then
            echo "Nothing is older than ${SETTLE_MINUTES}m, so nothing has had time to ship. In sync by construction."
            exit 0
          fi
          echo "settled ref (${SETTLE_MINUTES}m): $REF_SHA"

          # In sync means the live revision CONTAINS the settled commit — ancestry, not equality,
          # and no checkout: one compare call. behind/diverged is the only real drift.
          contains_ref() {
            [ -n "${1:-}" ] || return 1
            local status
            status=$(api "https://api.github.com/repos/${REPO}/compare/${REF_SHA}...${1}" \
              | jq -r '.status // empty') || return 1
            echo "  compare ${REF_SHA:0:9}...${1:0:9} = ${status:-<unknown>}" >&2
            case "$status" in identical | ahead) return 0 ;; *) return 1 ;; esac
          }

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "staging (check 1): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "In sync — staging contains the settled commit."
            exit 0
          fi

          echo "Mismatch (or healthz unreachable) — waiting 3 minutes for an in-flight Railway build to land before treating this as real drift..."
          sleep 180

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "staging (check 2): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "Caught up during the grace window. In sync."
            exit 0
          fi

          echo "DRIFT_SCOPE=STAGING" >> "$GITHUB_ENV"
          echo "::error::Staging is NOT serving a ${BRANCH} commit that is already ${SETTLE_MINUTES} minutes old. settled_ref=$REF_SHA ${BRANCH}=$HEAD_SHA staging=${LIVE_SHA:-<unreachable>}. The staging-branch-sync workflow was retired 2026-10-14, so this leg should be dormant: check why STAGING_TRACKS_BRANCH is set, then git ls-remote origin refs/heads/${BRANCH}."
          exit 1

      # The durable record, written OUTSIDE the check suite — a job summary a human can read on the
      # run page, since the job's own conclusion is deliberately no longer the signal. It also owns
      # DRIFT_SCOPE now, and that is a correctness fix rather than tidying:
      #
      # 🔴 BOTH COMPARISON STEPS RUN NOW, SO NEITHER MAY BE TRUSTED TO SET THE SCOPE. Before this
      # change production's `exit 1` ended the job, so the staging step never ran when production
      # drifted and DRIFT_SCOPE stayed PRODUCTION by accident of ordering. With both steps reported,
      # a simultaneous staging drift would overwrite it and send PRODUCTION drift under STAGING
      # wording — which points the reader at the staging branch and away from the production gate, at
      # 4am. That is the exact defect the comment further down records being caught in review of
      # #4552, and making both steps run is what would have reintroduced it. So the scope is derived
      # from the two outcomes here, after both are known, and production wins when both drifted
      # because production is the one that pays salaries.
      #
      # The silver lining of both steps running: a staging drift is no longer invisible until
      # production is fixed.
      - name: Report drift without withholding the deploy
        if: ${{ always() && (steps.production.outcome == 'failure' || steps.staging.outcome == 'failure') }}
        env:
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          STAGING_OUTCOME: ${{ steps.staging.outcome }}
        run: |
          set -uo pipefail

          if [ "$PRODUCTION_OUTCOME" = "failure" ]; then
            SCOPE="PRODUCTION"
          else
            SCOPE="STAGING"
          fi
          echo "DRIFT_SCOPE=${SCOPE}" >> "$GITHUB_ENV"

          BOTH="no"
          if [ "$PRODUCTION_OUTCOME" = "failure" ] && [ "$STAGING_OUTCOME" = "failure" ]; then
            BOTH="yes"
            echo "DRIFT_BOTH=yes" >> "$GITHUB_ENV"
          fi

          {
            printf '## %s deploy drift detected\n\n' "$SCOPE"
            printf 'production check: `%s`\n\n' "$PRODUCTION_OUTCOME"
            printf 'staging check: `%s`\n\n' "$STAGING_OUTCOME"
            if [ "$BOTH" = "yes" ]; then
              printf 'Both environments drifted. The alert is scoped to PRODUCTION because that is the one that pays salaries; read the staging step above as well.\n\n'
            fi
            printf 'This job concludes **success on purpose**. A failed or cancelled check suite on `main` HEAD makes Railway withhold that commit'"'"'s production deploy permanently, so an alarm that went red would deepen the very drift it is reporting. The finding is in the step annotation above and in the Telegram alert.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::${SCOPE} deploy drift detected. This job still concludes success so the check suite cannot withhold a production deploy — read the failed comparison step above for the full diagnosis, and the Telegram alert for the same text."

      # SELF-TEST, same convention as migration-drift-check.yml: workflow_dispatch with
      # test_alert=true fires this on a run that never even checked production, so "does the
      # alarm still work?" is answerable in two minutes without waiting for real drift.
      #
      # 🔴 GATED ON THE STEP OUTCOMES, NOT ON `failure()`. The job now concludes success even when it
      # finds drift, so `failure()` is permanently false here and the old gate would have made this
      # alarm silent — turning a fix for a withheld deploy into a fix that loses the alert instead.
      - name: Notify Telegram on failure
        if: ${{ always() && (steps.production.outcome == 'failure' || steps.staging.outcome == 'failure' || inputs.test_alert) }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_TEST: ${{ inputs.test_alert }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          WF_FILE: deploy-drift-check.yml
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. Production deploy drift went UNDETECTED-BY-A-HUMAN, which is the condition this step exists to prevent."
            exit 0
          fi
          # ── How old is this failure? ──────────────────────────────────────────────────────
          # An alert that has fired identically for three weeks looks exactly like one firing for
          # the first time. Not hypothetical: this check was red on 21 CONSECUTIVE nightly runs
          # (2026-08-11 to 2026-08-31) and every one of them delivered, because delivery was never
          # the problem — visibility of AGE was. The same shape cost 3 days on six anon-readable
          # tables, 13 days on the outbox drain and 9 nights on the direct-order sweeps. Adding
          # more channels does not fix that; saying how long it has been does.
          #
          # Scoped to runs of the SAME event: a manual dispatch fired to inspect something must
          # not reset a nightly streak. Counting every event hid this one at "6" instead of 21.
          #
          # Best-effort by construction — it needs only `actions: read`, and any failure leaves the
          # line out rather than breaking the alert. An alarm must never fail because the thing
          # describing it failed. jq joins on a SPACE deliberately: a tab delimiter needs IFS=$'\t',
          # and that sequence is a special replacement pattern in several editors and scripts.
          #
          # 🔴 THE STREAK READS A STEP, NOT THE RUN'S CONCLUSION, AND IT HAD TO CHANGE WITH THE
          # `continue-on-error` ABOVE. This job now concludes success even when it finds drift, so
          # `.conclusion == "failure"` — what this counted until 2026-09-30 — is permanently false and
          # the streak would have silently pinned itself at 1 for ever. That is the precise signal
          # whose absence the comment above says cost 21 invisible nights, so losing it as a
          # side-effect of fixing the withheld deploy would have traded one blind spot for the other.
          #
          # "Did the report step RUN?" is the durable substitute: a gated step is either executed or
          # `skipped`, and `skipped` is reported unambiguously whatever the runner does with a
          # continue-on-error step's own conclusion — which is why this keys on skipped-ness rather
          # than on that conclusion. `absent` covers runs older than this change, and correctly ends
          # the streak rather than guessing about them.
          #
          # Cost: one extra API call per run walked, and it BREAKS on the first clean run — so the
          # normal case is a single call, and it only walks far during a real outage, which is exactly
          # when the number is worth paying for.
          STREAK_LINE=""
          REPORT_STEP="Report drift without withholding the deploy"
          RUNS=$(gh api "repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50&status=completed&event=${EVENT}" --jq '.workflow_runs[] | [(.id|tostring), .created_at] | join(" ")' 2>/dev/null || true)
          if [ -n "$RUNS" ]; then
            STREAK=1
            FIRST_SEEN=""
            while read -r rid rdate; do
              [ -z "$rid" ] && continue
              [ "$rid" = "$RUN_ID" ] && continue
              # 🔴 PIPED TO REAL `jq`, BECAUSE `gh api` HAS NO `--arg` FLAG. The first version of this
              # line used `gh api --jq --arg s "$REPORT_STEP"`, which fails at ARGUMENT PARSING
              # ("accepts 1 arg(s), received 4") before any network call — and `|| echo "absent"`
              # swallowed it, so the streak would have broken at 1 on every run, for ever, silently.
              # That is precisely the invisible-age defect this block exists to prevent, reintroduced
              # by its own fix and caught only because someone ran it. `jq` does have `--arg`.
              # `.jobs[]?.steps[]?` is deliberate too: a job with `steps: null` errors the unguarded query.
              rconc=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs" 2>/dev/null | jq -r --arg s "$REPORT_STEP" '[.jobs[]?.steps[]? | select(.name == $s)] | .[0].conclusion // "absent"' 2>/dev/null || true)
              [ -z "$rconc" ] && rconc="absent"
              if [ "$rconc" != "skipped" ] && [ "$rconc" != "absent" ] && [ -n "$rconc" ]; then
                STREAK=$((STREAK + 1))
                FIRST_SEEN="$rdate"
              else
                break
              fi
            done <<< "$RUNS"
            if [ "$STREAK" -gt 1 ]; then
              STREAK_LINE=$(printf 'Consecutive failure #%s' "$STREAK")
              if [ -n "$FIRST_SEEN" ]; then
                STREAK_LINE=$(printf '%s, first seen %s' "$STREAK_LINE" "${FIRST_SEEN%%T*}")
              fi
              STREAK_LINE=$(printf '%s. A climbing number means nobody is acting on this.' "$STREAK_LINE")
            fi
          fi
          if [ "$IS_TEST" = "true" ]; then
            TEXT=$(printf 'ALERT SELF-TEST (not an incident)\n\nSomeone ran the deploy drift check with the test flag to confirm this channel still works.\n\nIf you are reading this, a real production deploy-drift failure would also reach you.\n\n%s' "$RUN_URL")
          else
            HEADER="${DRIFT_SCOPE:-PRODUCTION} DEPLOY DRIFT DETECTED"
            [ -n "$STREAK_LINE" ] && HEADER=$(printf '%s\n%s' "$HEADER" "$STREAK_LINE")
            # Both environments drifting is newly VISIBLE rather than newly possible: until both
            # comparison steps started being reported, production's failure ended the job and the
            # staging check never ran. The body below stays production-scoped on purpose — this line
            # is what stops the reader assuming staging is fine.
            [ "${DRIFT_BOTH:-no}" = "yes" ] && HEADER=$(printf '%s\nSTAGING IS ALSO DRIFTING. This alert is scoped to production; read the staging step on the run page too.' "$HEADER")
            # The BODY has to follow the scope, not just the title. A STAGING-titled alert that
            # carries production wording points the reader at the production gate and at
            # `railway status --environment production`, neither of which is the cause - and it
            # arrives at 4am. Same class of defect as the "Nothing on production is affected" line
            # corrected in staging-migrate.yml; introduced here by making only the HEADER
            # scope-aware, caught in review of #4552.
            #
            # Note the production check runs FIRST and exits non-zero, so when production drifts
            # the staging step never runs and DRIFT_SCOPE stays PRODUCTION. That ordering is
            # deliberate: production is the one that pays salaries.
            if [ "${DRIFT_SCOPE:-PRODUCTION}" = "STAGING" ]; then
              TEXT=$(printf '%s\n\nStaging is not serving its source branch HEAD, 3 minutes after first noticing.\n\nCHECK THIS FIRST: staging deploys from the staging branch, whose publisher (staging-branch-sync.yml) was retired 2026-10-14, so this leg should be dormant. Read git ls-remote origin refs/heads/staging\n\nIf that branch IS current, then the Railway staging source was changed - check the staging service settings.\n\nPRODUCTION IS NOT IMPLICATED: this check compares staging against its OWN branch, and production has a separate check in the same workflow.\n\nAccount: docs/deployment.md, "The deploy gate".\n\n%s' "$HEADER" "$RUN_URL")
            else
              # 🔴 THE ANSWER LEADS, NOT THE COMMAND TO FIND IT. This body used to say "read every
              # suite, not the CI run: gh api …/check-suites" — correct, and still a manual step for
              # whoever is awake. The production step above now classifies the suites itself and
              # leaves the verdict in DRIFT_SUITES, so the alert names the workflow that refused the
              # deploy. The raw command stays at the bottom as the way to check the classification,
              # not as the way to do it by hand. The fallback keeps the alert intact if the
              # classification could not be read — an alarm must never be worth less than nothing.
              TEXT=$(printf '%s\n\nProduction is not serving main HEAD, 3 minutes after first noticing.\n\nWHY — ALREADY READ FOR YOU: %s\n\nA named "REFUSED BY" IS the cause. Production deploys are GATED on the commit (Railway Wait for CI): ANY failed or cancelled check suite withholds it, not just ci.yml, and Railway marks it SKIPPED within MINUTES of that conclusion with nothing turning red. Fix that workflow — but note re-running it green does NOT resurrect the skipped deploy, and NEVER railway redeploy or re-merge: the next merge carries production forward on its own.\n\nIf it reads "every gating suite GREEN" instead, the gate did not refuse this one, and it is the failure mode fixed 2026-08-13 (Railway production tracking the wrong source branch) — check railway status for the production service source branch.\n\nAND CHECK WHETHER THIS ALARM IS ITS OWN CAUSE: a scheduled run of this workflow attaches its OWN check suite to main HEAD, so a false alarm here withholds the very deploy it is measuring. That is what happened on cd9e0be03 (2026-09-27), and it is why the reference is now a settled commit rather than HEAD.\n\nTo check the classification above: gh api repos/%s/commits/SHA/check-suites — sentry, claude, vercel and railway-app sit at queued forever and never hold the gate.\n\nAccount: docs/deployment.md, "The deploy gate".\n\n%s' "$HEADER" "${DRIFT_SUITES:-could not be classified — read the suites by hand}" "$REPO" "$RUN_URL")
            fi
          fi
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). Production deploy drift reached nobody. Response: $(cat /tmp/tg-response.json 2>/dev/null | head -c 500)"
            exit 1
          fi
          echo "Telegram alert delivered."
