name: Deploy Drift Check

# WHY THIS EXISTS (added 2026-08-13). Production's Railway service was source-configured to
# auto-deploy from a git branch literally named `staging`, not `main`. That branch had gone
# stale, so five already-merged, already-CI-green PRs (#2093, #2095, #2094, #2098, #2097) sat
# unshipped in production for hours while `main` moved on — with no error, no failed check, and
# no signal anywhere. AGENTS.md's core claim ("a merge to main SHIPS TO PRODUCTION IMMEDIATELY")
# was silently false for that window. Found only by a manual `railway status` check.
#
# This closes that gap the same way migration-drift-check.yml closes the analogous one for the
# database: a merged PR and a green CI run are not proof of what's actually live — only checking
# live state is. A branch-source misconfiguration produces exactly this failure mode again with
# zero warning, since GitHub shows the merge as completely normal either way.
#
# WHAT IT CHECKS. On a schedule (not push/pull_request — this looks for drift that accumulates
# AFTER merge, the same reasoning migration-drift-check.yml uses), compares `main`'s current HEAD
# SHA (read live from the GitHub API, not the trigger's own `github.sha` — correct regardless of
# how the run was triggered, and needs no checkout) against the `revision` production's own
# /api/healthz reports it is running.
#
# WHY THE REFERENCE IS A SETTLED COMMIT, NOT main HEAD (rewritten 2026-09-28).
# 🔴 THIS CHECK USED TO CAUSE THE VERY DRIFT IT MEASURES, and that is worth understanding before
# touching the comparison. It compared production against main HEAD for equality, with a
# 3-minute grace. That grace was written 2026-08-13, when a merge deployed immediately. The
# deploy is now GATED on that commit's own CI (Railway "Wait for CI"), so it does not even
# START until CI concludes — 5m24s on the commit below. And a scheduled run's check suite
# attaches to whatever commit is main HEAD at the time, while Railway withholds a deploy when
# ANY suite on the commit fails. So this workflow's own false alarm withheld the deploy it was
# measuring. Measured on cd9e0be03 (#4579), all times UTC:
#     22:29:46  merge            22:29:49  ci.yml starts (deploy blocked until it ends)
#     22:32:24  this check fires — production is legitimately still the older revision
#     22:35:13  ci.yml GREEN     22:35:35  this check concludes FAILURE (grace expired 22s early)
#     22:35:40  Railway marks the deployment SKIPPED — five seconds later
# ci.yml was 100% green; the only red suite on that commit was THIS workflow. The false
# positive made itself true, and the next merge carried production forward, which is why it
# went unnoticed for as long as it did.
# THE FIX, two parts. (1) Compare against the newest commit already older than SETTLE_MINUTES —
# one that has genuinely had time to ship — never against a HEAD that merged seconds ago.
# (2) Test ANCESTRY, not equality: this repo merges every few minutes, so production is
# legitimately a commit or two behind HEAD almost always, and equality reads that as drift. The
# 3-minute grace stays as a cheap second chance. Real drift (a stale Railway source branch)
# persists for hours and is still caught on the very next run.
#
# COST. Deliberately no checkout, no Node, no pnpm install — this needs nothing but curl, so a
# normal (in-sync) run finishes in a few seconds. Actions cost in this repo has hit the spending
# cap before and frozen every merge, so this stays cheap: 30-minute cadence, ~48 runs/day, only
# the rare drifting run pays the 3-minute grace sleep.
#
# ALERTING. Reuses the same TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID secrets and Bot API call
# migration-drift-check.yml already uses — the owner's existing Telegram channel, not a new
# recipient. migration-drift-check.yml's own header documents why this step exists at all: "a
# failing scheduled workflow notifies no one — GitHub emails the run author, and a cron run has
# none." A schedule-triggered failure with no notification step is invisible by construction.
on:
  schedule:
    - cron: "9,39 * * * *" # every 30 min, offset from the shared :00/:15/:30/:45 firing minute
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram alert and stop (proves the alarm still works)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # read this workflow own past runs, to count the failure streak

# A new run's answer always supersedes an older one still mid-grace-period-sleep.
concurrency:
  group: deploy-drift-check
  cancel-in-progress: true

jobs:
  deploy-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Compare production's deployed revision against a SETTLED commit
        if: ${{ !inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # How long a merge is given to reach the environment before its absence counts as
          # drift. It MUST exceed CI + build, because the deploy does not start until CI ends.
          SETTLE_MINUTES: "15"
        run: |
          set -euo pipefail

          api() { curl -fsS --max-time 10 -H "Authorization: Bearer ${GH_TOKEN}" "$@"; }

          fetch_live_revision() {
            curl -fsS --max-time 10 https://phoenix-hr.satopharma.com/api/healthz \
              | jq -r '.revision // empty'
          }

          HEAD_SHA=$(api "https://api.github.com/repos/${REPO}/commits/main" | jq -r '.sha')
          echo "main HEAD: $HEAD_SHA"

          # NOT HEAD — see this file's header, "WHY THE REFERENCE IS A SETTLED COMMIT". A commit
          # merged moments ago has not had time to ship: its deploy waits for its own CI first.
          UNTIL=$(date -u -d "-${SETTLE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          REF_SHA=$(api "https://api.github.com/repos/${REPO}/commits?sha=main&until=${UNTIL}&per_page=1" \
            | jq -r '.[0].sha // empty')
          if [ -z "$REF_SHA" ]; then
            echo "Nothing is older than ${SETTLE_MINUTES}m, so nothing has had time to ship. In sync by construction."
            exit 0
          fi
          echo "settled ref (${SETTLE_MINUTES}m): $REF_SHA"

          # In sync means the live revision CONTAINS the settled commit — ancestry, not equality,
          # and no checkout: one compare call. behind/diverged is the only real drift.
          contains_ref() {
            [ -n "${1:-}" ] || return 1
            local status
            status=$(api "https://api.github.com/repos/${REPO}/compare/${REF_SHA}...${1}" \
              | jq -r '.status // empty') || return 1
            echo "  compare ${REF_SHA:0:9}...${1:0:9} = ${status:-<unknown>}" >&2
            case "$status" in identical | ahead) return 0 ;; *) return 1 ;; esac
          }

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "production (check 1): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "In sync — production contains the settled commit."
            exit 0
          fi

          echo "Mismatch (or healthz unreachable) — waiting 3 minutes for an in-flight Railway build to land before treating this as real drift..."
          sleep 180

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "production (check 2): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "Caught up during the grace window. In sync."
            exit 0
          fi

          echo "DRIFT_SCOPE=PRODUCTION" >> "$GITHUB_ENV"
          echo "::error::Production is NOT serving a main commit that is already ${SETTLE_MINUTES} minutes old. settled_ref=$REF_SHA main=$HEAD_SHA production=${LIVE_SHA:-<unreachable>}. READ THE CHECK SUITES ON main HEAD FIRST — gh api repos/${REPO}/commits/$HEAD_SHA/check-suites — because ANY failed or cancelled suite withholds the deploy, not just ci.yml, so a green ci.yml proves nothing on its own. Ignore sentry, claude, vercel and railway-app: they sit at queued forever on every commit and do not hold the gate. If every suite is green, this is the failure mode fixed 2026-08-13 (Railway production tracking the wrong source branch): railway status --project dc218ad3-99b7-4aff-be38-953a57524a71 --environment production --json, then inspect .environments.edges[0].node.serviceInstances.edges[].node.latestDeployment.meta.branch — it must read \"main\"."
          exit 1

      # STAGING, once it has a branch of its own (added 2026-09-27, dormant until then).
      #
      # 🔴 GATED ON A VARIABLE ON PURPOSE. While staging still deploys from `main` this check would
      # be comparing the wrong two things and would alarm constantly, and an alarm that cries wolf is
      # worse than no alarm. Set `STAGING_TRACKS_BRANCH=staging` (a repository variable) in the SAME
      # change that repoints Railway's staging environment, and not before:
      #   gh variable set STAGING_TRACKS_BRANCH --body staging
      # Unset it again if staging is ever pointed back at `main`.
      #
      # WHY IT MATTERS. Staging's source branch is written by staging-branch-sync.yml, so a broken or
      # never-triggered sync leaves staging serving an ever-older commit with nothing red anywhere —
      # exactly the 2026-08-13 shape described in this file's header, which is the incident that
      # created this workflow. Production's check above cannot see it, because staging drifts against
      # its own branch rather than against `main`.
      - name: Compare staging's deployed revision against a SETTLED commit
        if: ${{ !inputs.test_alert && vars.STAGING_TRACKS_BRANCH != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ vars.STAGING_TRACKS_BRANCH }}
          # How long a merge is given to reach the environment before its absence counts as
          # drift. It MUST exceed CI + build, because the deploy does not start until CI ends.
          SETTLE_MINUTES: "15"
        run: |
          set -euo pipefail

          api() { curl -fsS --max-time 10 -H "Authorization: Bearer ${GH_TOKEN}" "$@"; }

          fetch_live_revision() {
            curl -fsS --max-time 10 https://phoenix-people-workforce-staging.up.railway.app/api/healthz \
              | jq -r '.revision // empty'
          }

          HEAD_SHA=$(api "https://api.github.com/repos/${REPO}/commits/${BRANCH}" | jq -r '.sha')
          echo "${BRANCH} HEAD: $HEAD_SHA"

          # NOT HEAD — see this file's header, "WHY THE REFERENCE IS A SETTLED COMMIT". A commit
          # merged moments ago has not had time to ship: its deploy waits for its own CI first.
          UNTIL=$(date -u -d "-${SETTLE_MINUTES} minutes" +%Y-%m-%dT%H:%M:%SZ)
          REF_SHA=$(api "https://api.github.com/repos/${REPO}/commits?sha=${BRANCH}&until=${UNTIL}&per_page=1" \
            | jq -r '.[0].sha // empty')
          if [ -z "$REF_SHA" ]; then
            echo "Nothing is older than ${SETTLE_MINUTES}m, so nothing has had time to ship. In sync by construction."
            exit 0
          fi
          echo "settled ref (${SETTLE_MINUTES}m): $REF_SHA"

          # In sync means the live revision CONTAINS the settled commit — ancestry, not equality,
          # and no checkout: one compare call. behind/diverged is the only real drift.
          contains_ref() {
            [ -n "${1:-}" ] || return 1
            local status
            status=$(api "https://api.github.com/repos/${REPO}/compare/${REF_SHA}...${1}" \
              | jq -r '.status // empty') || return 1
            echo "  compare ${REF_SHA:0:9}...${1:0:9} = ${status:-<unknown>}" >&2
            case "$status" in identical | ahead) return 0 ;; *) return 1 ;; esac
          }

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "staging (check 1): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "In sync — staging contains the settled commit."
            exit 0
          fi

          echo "Mismatch (or healthz unreachable) — waiting 3 minutes for an in-flight Railway build to land before treating this as real drift..."
          sleep 180

          LIVE_SHA="$(fetch_live_revision || true)"
          echo "staging (check 2): ${LIVE_SHA:-<unreachable>}"
          if contains_ref "$LIVE_SHA"; then
            echo "Caught up during the grace window. In sync."
            exit 0
          fi

          echo "DRIFT_SCOPE=STAGING" >> "$GITHUB_ENV"
          echo "::error::Staging is NOT serving a ${BRANCH} commit that is already ${SETTLE_MINUTES} minutes old. settled_ref=$REF_SHA ${BRANCH}=$HEAD_SHA staging=${LIVE_SHA:-<unreachable>}. Most likely the staging-branch-sync workflow has stopped advancing the branch, or Railway staging source was changed. Read: gh run list --workflow=staging-branch-sync.yml --limit 5, and git ls-remote origin refs/heads/${BRANCH}."
          exit 1

      # SELF-TEST, same convention as migration-drift-check.yml: workflow_dispatch with
      # test_alert=true fires this on a run that never even checked production, so "does the
      # alarm still work?" is answerable in two minutes without waiting for real drift.
      - name: Notify Telegram on failure
        if: ${{ failure() || inputs.test_alert }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_TEST: ${{ inputs.test_alert }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          WF_FILE: deploy-drift-check.yml
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. Production deploy drift went UNDETECTED-BY-A-HUMAN, which is the condition this step exists to prevent."
            exit 0
          fi
          # ── How old is this failure? ──────────────────────────────────────────────────────
          # An alert that has fired identically for three weeks looks exactly like one firing for
          # the first time. Not hypothetical: this check was red on 21 CONSECUTIVE nightly runs
          # (2026-08-11 to 2026-08-31) and every one of them delivered, because delivery was never
          # the problem — visibility of AGE was. The same shape cost 3 days on six anon-readable
          # tables, 13 days on the outbox drain and 9 nights on the direct-order sweeps. Adding
          # more channels does not fix that; saying how long it has been does.
          #
          # Scoped to runs of the SAME event: a manual dispatch fired to inspect something must
          # not reset a nightly streak. Counting every event hid this one at "6" instead of 21.
          #
          # Best-effort by construction — it needs only `actions: read`, and any failure leaves the
          # line out rather than breaking the alert. An alarm must never fail because the thing
          # describing it failed. jq joins on a SPACE deliberately: a tab delimiter needs IFS=$'\t',
          # and that sequence is a special replacement pattern in several editors and scripts.
          STREAK_LINE=""
          RUNS=$(gh api "repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50&status=completed&event=${EVENT}" --jq '.workflow_runs[] | [(.id|tostring), .conclusion, .created_at] | join(" ")' 2>/dev/null || true)
          if [ -n "$RUNS" ]; then
            STREAK=1
            FIRST_SEEN=""
            while read -r rid rconc rdate; do
              [ -z "$rid" ] && continue
              [ "$rid" = "$RUN_ID" ] && continue
              if [ "$rconc" = "failure" ]; then
                STREAK=$((STREAK + 1))
                FIRST_SEEN="$rdate"
              else
                break
              fi
            done <<< "$RUNS"
            if [ "$STREAK" -gt 1 ]; then
              STREAK_LINE=$(printf 'Consecutive failure #%s' "$STREAK")
              if [ -n "$FIRST_SEEN" ]; then
                STREAK_LINE=$(printf '%s, first seen %s' "$STREAK_LINE" "${FIRST_SEEN%%T*}")
              fi
              STREAK_LINE=$(printf '%s. A climbing number means nobody is acting on this.' "$STREAK_LINE")
            fi
          fi
          if [ "$IS_TEST" = "true" ]; then
            TEXT=$(printf 'ALERT SELF-TEST (not an incident)\n\nSomeone ran the deploy drift check with the test flag to confirm this channel still works.\n\nIf you are reading this, a real production deploy-drift failure would also reach you.\n\n%s' "$RUN_URL")
          else
            HEADER="${DRIFT_SCOPE:-PRODUCTION} DEPLOY DRIFT DETECTED"
            [ -n "$STREAK_LINE" ] && HEADER=$(printf '%s\n%s' "$HEADER" "$STREAK_LINE")
            # The BODY has to follow the scope, not just the title. A STAGING-titled alert that
            # carries production wording points the reader at the production gate and at
            # `railway status --environment production`, neither of which is the cause - and it
            # arrives at 4am. Same class of defect as the "Nothing on production is affected" line
            # corrected in staging-migrate.yml; introduced here by making only the HEADER
            # scope-aware, caught in review of #4552.
            #
            # Note the production check runs FIRST and exits non-zero, so when production drifts
            # the staging step never runs and DRIFT_SCOPE stays PRODUCTION. That ordering is
            # deliberate: production is the one that pays salaries.
            if [ "${DRIFT_SCOPE:-PRODUCTION}" = "STAGING" ]; then
              TEXT=$(printf '%s\n\nStaging is not serving its source branch HEAD, 3 minutes after first noticing.\n\nCHECK THIS FIRST: staging deploys from the staging branch, which is published ONLY from CI-green main commits by staging-branch-sync.yml. A sync that stopped firing leaves staging serving an ever-older commit with nothing red anywhere. Read: gh run list --workflow=staging-branch-sync.yml --limit 5, then git ls-remote origin refs/heads/staging\n\nIf that branch IS current, then the Railway staging source was changed - check the staging service settings.\n\nPRODUCTION IS NOT IMPLICATED: this check compares staging against its OWN branch, and production has a separate check in the same workflow.\n\nAccount: docs/deployment.md, "The deploy gate".\n\n%s' "$HEADER" "$RUN_URL")
            else
              TEXT=$(printf '%s\n\nProduction is not serving main HEAD, 3 minutes after first noticing.\n\nCHECK THIS FIRST, it is now the most likely cause: production deploys are GATED on the commit (Railway Wait for CI). ANY failed or cancelled check suite on main HEAD withholds the deploy — not just ci.yml — and Railway then marks it SKIPPED within MINUTES of that conclusion, with nothing turning red. So read every suite, not the CI run: gh api repos/%s/commits/MAIN_HEAD/check-suites\n\nAND CHECK WHETHER THIS ALARM IS ITS OWN CAUSE: a scheduled run of this workflow attaches its OWN check suite to main HEAD, so a false alarm here withholds the very deploy it is measuring. That is what happened on cd9e0be03 (2026-09-27), and it is why the reference is now a settled commit rather than HEAD.\n\nIf every suite on that commit is green, then this is the failure mode fixed 2026-08-13 (Railway production tracking the wrong source branch) — check railway status for the production service source branch.\n\nAccount: docs/deployment.md, "The deploy gate".\n\n%s' "$HEADER" "$REPO" "$RUN_URL")
            fi
          fi
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). Production deploy drift reached nobody. Response: $(cat /tmp/tg-response.json 2>/dev/null | head -c 500)"
            exit 1
          fi
          echo "Telegram alert delivered."
