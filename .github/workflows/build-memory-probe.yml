# PROBE ONLY — lives on codex/ci-build-memory-probe and is never merged. Measures the runner's
# memory during `next build`, the current one-process build against the split compile/generate one.
name: Build memory probe
on:
  push:
    branches: [codex/ci-build-memory-probe]
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [single, split]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (${{ matrix.mode }}) with a live memory trace
        run: |
          nproc; free -m
          ( while sleep 3; do echo "MEM $(date -u +%T) $(free -m | awk 'NR==2{printf "used=%s avail=%s ",$3,$7} NR==3{printf "swap=%s",$3}') | $(ps -eo rss=,args= --sort=-rss | head -3 | awk '{a=$2" "$3" "$4; printf "%dMB[%s] ", $1/1024, substr(a,1,50)}')"; done ) &
          if [ "${{ matrix.mode }}" = single ]; then
            pnpm exec next build
          else
            pnpm exec next build --experimental-build-mode compile
            echo "MEM ---- compile finished, generate starts ----"
            pnpm exec next build --experimental-build-mode generate
          fi
          ls .next/standalone >/dev/null && echo "standalone output present"
