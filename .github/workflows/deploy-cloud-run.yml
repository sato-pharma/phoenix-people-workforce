name: Deploy to Google Cloud Run

# Deploy only AFTER the CI workflow succeeds for the same commit on main (never in
# parallel with a red build), or on a manual dispatch. The new revision is deployed
# with NO traffic + a SHA tag, smoke-tested in isolation, and only then promoted to
# 100% — a failing revision can never take production traffic.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Own concurrency group (staging uses cloud-run-deploy-staging). The two deploy
# workflows used to share one group ("cloud-run-source-deploy") because BOTH ran a
# Cloud Build in the same GCP project, and gcloud's build-status polling reliably
# 429'd against Cloud Build's "Get requests per minute" quota (59/project) whenever
# two builds polled concurrently (see PR #1029/#1032/#1097 and the 2026-07-17
# staging burst). Staging no longer builds anything on its normal path — it reuses
# the image THIS workflow pushes (build once, deploy twice) — so there is at most
# one Cloud Build at a time project-wide and the shared group would only make
# staging queue behind the next prod deploy for no reason. cancel-in-progress:false
# never kills an in-flight deploy; a newer run just queues (GitHub keeps only the
# latest pending, which is fine — main is cumulative, so the newest deploy ships all
# prior commits).
concurrency:
  group: cloud-run-deploy-prod
  cancel-in-progress: false

env:
  PROJECT_ID: phoenix-workforce-498619
  # europe-west3 (Frankfurt) since the 2026-07-17 region cutover: colocated with the
  # production Supabase project (AWS eu-central-1, same metro, ~1ms) and ~57ms from
  # Cairo users vs ~146ms from Iowa. REGION drives the Cloud Build submit region, the
  # Artifact Registry image path, and the Cloud Run deploy target together — the AR
  # repo cloud-run-source-deploy exists in both regions, and the first europe-west3
  # build simply seeds fresh :deps-cache/:latest-cache tags there.
  REGION: europe-west3
  SERVICE_NAME: phoenix-hr

jobs:
  deploy:
    # Gate: only proceed when the triggering CI run succeeded (or on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Deploy the exact commit CI validated (workflow_run), else the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Validate production env (pass/fail only, never prints values)
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/validate-env.mjs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Resolve image tag and check Artifact Registry for an existing build
        id: preflight
        run: |
          set -euo pipefail
          RAW_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHA_TAG="sha-$(echo "$RAW_SHA" | cut -c1-8)"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:$SHA_TAG"
          # sha-* image tags are immutable per commit, so if this commit's image is
          # already in Artifact Registry (workflow re-run, or a retry after a
          # post-build step failed) rebuilding would spend minutes producing the
          # identical artifact. Skip the build and deploy the existing image.
          if gcloud artifacts docker images describe "$IMAGE" --project ${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            echo "Image $IMAGE already exists — skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE not found — will build."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build image via Cloud Build (BuildKit cache; explicit --build-arg for NEXT_PUBLIC_*)
        if: ${{ steps.preflight.outputs.skip_build != 'true' }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.preflight.outputs.image }}"
          echo "Building $IMAGE"
          # gcloud run deploy --source's --set-build-env-vars only reaches the build when
          # Cloud Build picks the Buildpacks path. This repo has a Dockerfile, so that flag
          # was silently dropped and every NEXT_PUBLIC_* value got inlined into the client
          # bundle as an empty string on every prior deploy. cloudbuild.yaml builds with an
          # explicit --build-arg per value instead, which Docker actually honors.
          # _CACHE_REPO is where cloudbuild.yaml keeps its reusable BuildKit cache tags
          # (:deps-cache / :latest-cache) — same AR image path as the service image.
          # retry-transient.sh retries ONLY transient Cloud Build 429/5xx/network errors
          # (the 60/min get-requests quota); a real build failure is surfaced on attempt 1.
          bash scripts/retry-transient.sh gcloud builds submit . \
            --config cloudbuild.yaml \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --substitutions=_IMAGE="$IMAGE",_CACHE_REPO="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}",_NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }},_NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY }},_NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }},_NEXT_PUBLIC_SMI_USE_FACT_TABLES=${{ secrets.NEXT_PUBLIC_SMI_USE_FACT_TABLES }},_NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }},_NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

      - name: Deploy new revision (no traffic) with a commit-SHA tag
        id: deploy
        run: |
          set -euo pipefail
          SHA_TAG="${{ steps.preflight.outputs.sha_tag }}"
          echo "Deploying tag $SHA_TAG (no traffic)"
          # Scaling/concurrency/execution-environment were previously set once by hand via
          # gcloud and never captured here — a redeploy of this workflow alone (e.g. a fresh
          # service recreate) would have silently reverted to platform defaults. Pinning them
          # explicitly makes the live config match this file. --concurrency is lowered from
          # the prior undocumented 80: a burst of concurrent requests to one instance's single
          # vCPU is what turned the employee-directory photo-request bug into a real p95-
          # latency alert (see PR #1022) — 40 makes Cloud Run spread a similar burst across
          # the existing min/max-instances headroom instead of queuing on one instance.
          # --startup-probe and --min pin config first applied live by hand on 2026-07-17:
          # the fast healthz probe (every 5s, up to 60s) makes a new revision routable
          # seconds after Next.js starts instead of waiting out the default TCP probe, and
          # service-level min instances (--min; this SDK's spelling of the older
          # --service-min-instances) keeps ONE warm instance shared across all revisions —
          # unlike revision-level --min-instances, it does not reserve a vCPU per stale
          # sha-* tagged revision (the 2026-07-13/14 CPU-quota exhaustion). Revision-level
          # --min-instances stays 0 for exactly that reason.
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ steps.preflight.outputs.image }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 40 \
            --min-instances 0 \
            --min 1 \
            --max-instances 3 \
            --execution-environment gen2 \
            --cpu-boost \
            --startup-probe httpGet.path=/api/healthz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=5,failureThreshold=12,initialDelaySeconds=0 \
            --no-traffic \
            --tag "$SHA_TAG" \
            --update-env-vars "^@^PHOENIX_ALLOWED_ORIGINS=https://phoenix-hr-897559113412.europe-west3.run.app,https://phoenix-hr.satopharma.com"
          TAG_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format=json \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='$SHA_TAG'),''))")
          echo "Tag URL: $TAG_URL"
          test -n "$TAG_URL"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test (isolated new revision, before routing traffic)
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.tag_url }}"
          fail() { echo "SMOKE FAILED: $1"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/healthz"); echo "GET /api/healthz -> $code"; [ "$code" = "200" ] || fail "healthz not 200"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/login"); echo "GET /login -> $code"; [ "$code" = "200" ] || fail "login not 200"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/webhooks/resend" -H "content-type: application/json" -d '{}'); echo "POST /api/webhooks/resend -> $code"; [ "$code" = "401" ] || fail "webhook not 401"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/notifications/daily"); echo "GET /api/notifications/daily -> $code"; [ "$code" = "401" ] || fail "cron not 401"
          echo "Smoke passed."

      - name: Promote validated revision to 100% traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --to-latest

      - name: Clean up stale SHA-tagged revisions (keep newest 3, never touch live)
        # Each sha-* tag was deployed with --min-instances 1, which reserves 1 vCPU
        # permanently even at 0% traffic. Left unpruned, these accumulate across every
        # deploy and eventually exhaust the region's CPU quota, failing the *next*
        # deploy at the "Deploy new revision" step before it can even take traffic
        # (happened 2026-07-13 and 2026-07-14 — see docs/disaster-recovery-runbook.md
        # and gcloud-production-migration-audit.md for prior manual recoveries).
        # Runs only after a successful promotion, and is best-effort: a cleanup
        # failure here must never fail an already-live deploy.
        continue-on-error: true
        run: |
          python3 scripts/cleanup-stale-cloud-run-tags.py \
            --service ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --keep 3
