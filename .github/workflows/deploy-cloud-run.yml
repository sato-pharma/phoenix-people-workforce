name: Deploy to Google Cloud Run

# Deploy only a commit whose CI succeeded (never a red build). The new revision is
# deployed with NO traffic + a SHA tag, smoke-tested in isolation, and only then promoted
# to 100% — a failing revision can never take production traffic.
#
# CADENCE (changed 2026-07-26): this used to fire on `workflow_run: [CI]` for every push to
# main, i.e. ~15 production deploys/day at ~8.2 runner-min each (~3,700 Actions-min/month,
# the second-largest line on the bill after CI itself). It now runs on a 4-hourly schedule,
# so a batch of merges ships together instead of one deploy per merge.
#
# The CI-success gate is NOT lost — it moved from the `workflow_run` trigger into the
# `gate` job below, which asks the API for the CI conclusion of the exact commit it is about
# to ship and refuses to continue unless it succeeded. A red or un-CI'd commit therefore
# costs ~1 runner-min (gate only) instead of a full deploy.
#
# TO SHIP SOMETHING IMMEDIATELY: use the "Run workflow" button (workflow_dispatch). It still
# enforces the CI gate; tick `force` only to override it in an emergency.
on:
  schedule:
    # Every 2h: 00/02/04/.../22 UTC = 02/04/06/.../00 Cairo. Widened from the original
    # 4-hourly on 2026-07-26 — 4h meant a merge could sit unshipped for most of a working
    # day, which was too coarse in practice. Cost: roughly double the deploy runs, since the
    # number of builds tracks the number of scheduled windows that find a new commit, not the
    # number of commits. GitHub may delay cron under load; a late run is normal, not a fault.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Emergency override: deploy the ref even if its CI did not succeed. Leave unchecked
          for normal deploys.
        type: boolean
        required: false
        default: false

# Own concurrency group (staging uses cloud-run-deploy-staging). The two deploy
# workflows used to share one group ("cloud-run-source-deploy") because BOTH ran a
# Cloud Build in the same GCP project, and gcloud's build-status polling reliably
# 429'd against Cloud Build's "Get requests per minute" quota (59/project) whenever
# two builds polled concurrently (see PR #1029/#1032/#1097 and the 2026-07-17
# staging burst). Staging no longer builds anything on its normal path — it reuses
# the image THIS workflow pushes (build once, deploy twice) — so there is at most
# one Cloud Build at a time project-wide and the shared group would only make
# staging queue behind the next prod deploy for no reason. cancel-in-progress:false
# never kills an in-flight deploy; a newer run just queues (GitHub keeps only the
# latest pending, which is fine — main is cumulative, so the newest deploy ships all
# prior commits).
concurrency:
  group: cloud-run-deploy-prod
  cancel-in-progress: false

env:
  PROJECT_ID: phoenix-workforce-498619
  # europe-west3 (Frankfurt) since the 2026-07-17 region cutover: colocated with the
  # production Supabase project (AWS eu-central-1, same metro, ~1ms) and ~57ms from
  # Cairo users vs ~146ms from Iowa. REGION drives the Cloud Build submit region, the
  # Artifact Registry image path, and the Cloud Run deploy target together — the AR
  # repo cloud-run-source-deploy exists in both regions, and the first europe-west3
  # build simply seeds fresh :deps-cache/:latest-cache tags there.
  REGION: europe-west3
  SERVICE_NAME: phoenix-hr

jobs:
  # Cheap (~1 runner-min) guard in front of the ~8-min deploy job. This is what replaces the
  # old `workflow_run: [CI]` trigger: instead of being *woken by* a successful CI run, the
  # scheduled deploy *asks* whether the commit it is about to ship has one. Splitting it into
  # its own job is what makes a no-op scheduled run cheap — GitHub has no way to end a job
  # early, so guarding N steps inside one job would still pay for the whole job.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      actions: 'read' # to read other workflows' run conclusions via the API
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Decide whether there is anything to deploy
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $SHA"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "::warning::force=true — bypassing the CI-success check for $SHA."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1. CI must have SUCCEEDED for this exact commit. `--jq` picks the newest run for
          #    the SHA; a re-run that later went green therefore counts. No CI run at all
          #    (e.g. a docs-only commit that only matched ci-docs-fallback) is NOT success,
          #    so we refuse rather than guess.
          CI_CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "Latest CI conclusion for $SHA: $CI_CONCLUSION"
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "::notice::Skipping deploy — CI for $SHA is '$CI_CONCLUSION', not 'success'."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

          # DELIBERATELY NOT CHECKED HERE: "is this commit already live?". The obvious
          # implementation — compare $SHA to the head SHA of the last successful run of this
          # workflow — is WRONG, and silently so: a run where this gate said proceed=false
          # still concludes "success", so it would register its own SHA as shipped. A commit
          # whose CI was red at gate time and green on re-run would then be skipped forever
          # and never reach production. Getting it right needs either GCP auth in this job
          # (to read the serving revision's COMMIT_SHA) or a multi-call walk to find the last
          # run whose `deploy` job actually succeeded. Both add moving parts to the production
          # deploy path to save ~$2/month, because the deploy job's existing Artifact Registry
          # preflight already skips the expensive Cloud Build for an unchanged commit — a
          # redundant scheduled run costs ~3 min, not ~8. Not worth the hazard. If you re-add
          # this, base it on what is actually SERVING, never on run history.

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit the gate job validated CI against.
          ref: ${{ needs.gate.outputs.sha }}

      - name: Validate production env (pass/fail only, never prints values)
        env:
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/validate-env.mjs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Resolve image tag and check Artifact Registry for an existing build
        id: preflight
        run: |
          set -euo pipefail
          RAW_SHA="${{ needs.gate.outputs.sha }}"
          SHA_TAG="sha-$(echo "$RAW_SHA" | cut -c1-8)"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}:$SHA_TAG"
          # sha-* image tags are immutable per commit, so if this commit's image is
          # already in Artifact Registry (workflow re-run, or a retry after a
          # post-build step failed) rebuilding would spend minutes producing the
          # identical artifact. Skip the build and deploy the existing image.
          if gcloud artifacts docker images describe "$IMAGE" --project ${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            echo "Image $IMAGE already exists — skipping build."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image $IMAGE not found — will build."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Build image via Cloud Build (BuildKit cache; explicit --build-arg for NEXT_PUBLIC_*)
        if: ${{ steps.preflight.outputs.skip_build != 'true' }}
        run: |
          set -euo pipefail
          IMAGE="${{ steps.preflight.outputs.image }}"
          echo "Building $IMAGE"
          # gcloud run deploy --source's --set-build-env-vars only reaches the build when
          # Cloud Build picks the Buildpacks path. This repo has a Dockerfile, so that flag
          # was silently dropped and every NEXT_PUBLIC_* value got inlined into the client
          # bundle as an empty string on every prior deploy. cloudbuild.yaml builds with an
          # explicit --build-arg per value instead, which Docker actually honors.
          # _CACHE_REPO is where cloudbuild.yaml keeps its reusable BuildKit cache tags
          # (:deps-cache / :latest-cache) — same AR image path as the service image.
          # retry-transient.sh retries ONLY transient Cloud Build 429/5xx/network errors
          # (the 60/min get-requests quota); a real build failure is surfaced on attempt 1.
          bash scripts/retry-transient.sh gcloud builds submit . \
            --config cloudbuild.yaml \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --substitutions=_IMAGE="$IMAGE",_CACHE_REPO="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/cloud-run-source-deploy/${{ env.SERVICE_NAME }}",_NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }},_NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY }},_NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }},_NEXT_PUBLIC_SMI_USE_FACT_TABLES=${{ secrets.NEXT_PUBLIC_SMI_USE_FACT_TABLES }},_NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }},_NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},_NEXT_PUBLIC_ONESIGNAL_APP_ID=${{ secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }},_NEXT_PUBLIC_COMMIT_SHA=${{ steps.preflight.outputs.sha_tag }}

      - name: Deploy new revision (no traffic) with a commit-SHA tag
        id: deploy
        run: |
          set -euo pipefail
          SHA_TAG="${{ steps.preflight.outputs.sha_tag }}"
          echo "Deploying tag $SHA_TAG (no traffic)"
          # Scaling/concurrency/execution-environment were previously set once by hand via
          # gcloud and never captured here — a redeploy of this workflow alone (e.g. a fresh
          # service recreate) would have silently reverted to platform defaults. Pinning them
          # explicitly makes the live config match this file. --concurrency is lowered from
          # the prior undocumented 80: a burst of concurrent requests to one instance's single
          # vCPU is what turned the employee-directory photo-request bug into a real p95-
          # latency alert (see PR #1022) — 40 makes Cloud Run spread a similar burst across
          # the existing min/max-instances headroom instead of queuing on one instance.
          # --startup-probe and --min pin config first applied live by hand on 2026-07-17:
          # the fast healthz probe (every 5s, up to 60s) makes a new revision routable
          # seconds after Next.js starts instead of waiting out the default TCP probe, and
          # service-level min instances (--min; this SDK's spelling of the older
          # --service-min-instances) keeps ONE warm instance shared across all revisions —
          # unlike revision-level --min-instances, it does not reserve a vCPU per stale
          # sha-* tagged revision (the 2026-07-13/14 CPU-quota exhaustion). Revision-level
          # --min-instances stays 0 for exactly that reason.
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "${{ steps.preflight.outputs.image }}" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --concurrency 40 \
            --min-instances 0 \
            --min 1 \
            --max-instances 3 \
            --execution-environment gen2 \
            --cpu-boost \
            --startup-probe httpGet.path=/api/healthz,httpGet.port=8080,periodSeconds=5,timeoutSeconds=5,failureThreshold=12,initialDelaySeconds=0 \
            --no-traffic \
            --tag "$SHA_TAG" \
            --update-env-vars "^@^PHOENIX_ALLOWED_ORIGINS=https://phoenix-hr-897559113412.europe-west3.run.app,https://phoenix-hr.satopharma.com@COMMIT_SHA=$SHA_TAG"
          TAG_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format=json \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='$SHA_TAG'),''))")
          echo "Tag URL: $TAG_URL"
          test -n "$TAG_URL"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test (isolated new revision, before routing traffic)
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.tag_url }}"
          fail() { echo "SMOKE FAILED: $1"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/healthz"); echo "GET /api/healthz -> $code"; [ "$code" = "200" ] || fail "healthz not 200"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/login"); echo "GET /login -> $code"; [ "$code" = "200" ] || fail "login not 200"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/webhooks/resend" -H "content-type: application/json" -d '{}'); echo "POST /api/webhooks/resend -> $code"; [ "$code" = "401" ] || fail "webhook not 401"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/notifications/daily"); echo "GET /api/notifications/daily -> $code"; [ "$code" = "401" ] || fail "cron not 401"
          echo "Smoke passed."

      - name: Promote validated revision to 100% traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --to-latest

      - name: Mark Sentry release as deployed
        # Same $SHA_TAG used for the image tag / withSentryConfig release / Sentry.init
        # release option (see next.config.ts, instrumentation-client.ts). This only adds
        # the deploy-marker/suspect-commit UI in Sentry — release tagging itself already
        # works without this step. Best-effort: never fail an already-live deploy over it.
        continue-on-error: true
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: phoenix-workforce
          SENTRY_PROJECT: phx-b9
        with:
          environment: production
          # `release` (not the deprecated `version`) is this action's current input name.
          # ignore_missing: the action's default set_commits=auto asks sentry-cli to resolve the
          # commits between the PREVIOUS Sentry release and this one. After the 2026-07-26
          # repo-owner transfer that previous release's commit is no longer resolvable, so
          # sentry-cli failed the step with "Could not find the SHA of the previous release in
          # the git history". Harmless (the step is continue-on-error, and release tagging
          # itself works without it) but it put a red X on every otherwise-green deploy. With
          # this flag it creates the release using the default commit count instead of erroring.
          release: ${{ steps.preflight.outputs.sha_tag }}
          ignore_missing: true

      - name: Clean up stale SHA-tagged revisions (keep newest 3, never touch live)
        # Each sha-* tag was deployed with --min-instances 1, which reserves 1 vCPU
        # permanently even at 0% traffic. Left unpruned, these accumulate across every
        # deploy and eventually exhaust the region's CPU quota, failing the *next*
        # deploy at the "Deploy new revision" step before it can even take traffic
        # (happened 2026-07-13 and 2026-07-14 — see docs/disaster-recovery-runbook.md
        # and gcloud-production-migration-audit.md for prior manual recoveries).
        # Runs only after a successful promotion, and is best-effort: a cleanup
        # failure here must never fail an already-live deploy.
        continue-on-error: true
        run: |
          python3 scripts/cleanup-stale-cloud-run-tags.py \
            --service ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --keep 3
