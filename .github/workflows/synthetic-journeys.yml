name: Synthetic Journeys (production smoke)

# WHY THIS EXISTS. The GCP alerting layer died with the billing account on 2026-08-01 and was not
# replaced: errors still land in app_error_events, but nothing pages anyone (see
# docs/observability.md). The Healthchecks.io dead-man's-switch survived, but it answers exactly one
# question — "did a cron job run at all?" — and says nothing about whether a page renders.
#
# This suite is the cheapest route back to an automated "is production actually working?" signal,
# and it runs on GitHub's infrastructure rather than Railway's. That matters: a monitor hosted
# inside the thing it monitors cannot report that the thing is down. Same reasoning that kept the
# dead-man's-switch alive while everything inside GCP went with it.
#
# SAFETY. tests/synthetic/ is read-only by construction — it navigates and asserts, and never
# creates, edits, approves, rejects, deletes, uploads or sends. Its global-setup refuses to touch
# production at all unless SYNTHETIC_ALLOW_PRODUCTION=true, and any future mutating journey has to
# declare `mutates: true` and is gated behind SYNTHETIC_ALLOW_MUTATION, which this workflow never
# sets. See tests/synthetic/README.md.
#
# COST. Each run performs one real Super Admin login against production, so it writes one row to
# auth_login_attempts per run. A three-hourly cadence during Cairo working hours keeps that noise
# bounded at ~6 admin logins a day; a 15-minute cadence would put ~96 into production audit data
# for little extra signal.

on:
  schedule:
    # Every 3h at :17 past, 02:00-17:00 UTC = 05:00-20:00 Africa/Cairo (6 runs/day). Overnight is
    # deliberately skipped: nobody is using the app, and a failure at 03:00 Cairo is not actionable
    # until morning anyway. The :17 offset keeps it off the shared firing minute of the other jobs.
    #
    # CADENCE (2026-08-29). Was hourly, "17 2-18 * * *" = 17 runs/day. Measured that week: Actions
    # billed ~32,600 min/month on a private repo, and this workflow ran 217 times in 7 days. Going
    # three-hourly cuts it to ~6/day and cuts the production auth_login_attempts noise noted above
    # by the same factor. TRADE-OFF, stated plainly because it is not free: this suite is the only
    # automated "is production actually up?" signal since GCP alerting died, so worst-case
    # detection latency goes from ~1h to ~3h. If that proves too slow, the middle setting is
    # "17 2-18/2 * * *" (2-hourly, 9 runs/day) rather than a return to hourly.
    #
    # CORRECTION (2026-09-04). The paragraph above is a dated record and is left as written, but its
    # arithmetic covers the SCHEDULE leg only. cron-job.org's `phoenix-run-synthetic-journeys`
    # ("0 * * * *") dispatches this workflow through /api/cron/run-synthetic-journeys, and has done
    # so 24x/day continuously since at least 2026-08-24 — unchanged by the cut above. Counted over
    # 2026-09-01..09-04: ~24 dispatch runs/day against ~3 scheduled. The real rate is therefore
    # ~27/day, not ~6, and editing THIS cron line moves only the ~3. Cadence lives in
    # src/lib/observability/job-schedule.ts and at cron-job.org. See docs/agents-incident-history.md.
    - cron: "17 2-18/3 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Environment to smoke-test"
        required: false
        default: "https://phoenix-hr.satopharma.com"

permissions:
  contents: read

env:
  # Matches ci.yml — kept in step with it rather than pinned separately.
  CI_NODE_VERSION: "24"

# Never let two runs overlap — they share one Super Admin account, and a second login would
# invalidate the first run's session mid-journey and report a false failure.
concurrency:
  group: synthetic-journeys
  cancel-in-progress: false

jobs:
  synthetic:
    name: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `secrets` is NOT a valid context in a step-level `if:` — GitHub rejects it with
    # "Unrecognized named-value: 'secrets'" and the ENTIRE workflow fails to parse, so every run
    # goes red before any job starts. That is exactly what happened to migration-drift-check.yml
    # on 2026-07-30; its header carries the same warning. Surface the key as a job-level env var
    # instead — `env` CAN read secrets, and a step `if:` CAN read job-level `env`. The secret's
    # VALUE is still injected only into the step that uses it; this copy is a presence flag only.
    env:
      HAS_PRODUCTION_SUPABASE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fail LOUDLY on a missing secret rather than skipping. docs/observability.md records the
      # exact trap: a skipped step and a passing step look identical at a glance, which is the
      # silent-green failure this workflow exists to prevent. The suite's own global-setup also
      # aborts before opening a browser, but failing here gives a one-line reason in the run
      # summary instead of a Playwright stack trace.
      - name: Verify required secrets are present
        env:
          HR_ID: ${{ secrets.SYNTHETIC_ADMIN_HR_ID }}
          PASSWORD: ${{ secrets.SYNTHETIC_ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -z "$HR_ID" ] && missing="$missing SYNTHETIC_ADMIN_HR_ID"
          [ -z "$PASSWORD" ] && missing="$missing SYNTHETIC_ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — create a dedicated read-only Super Admin account and add them under Settings → Secrets and variables → Actions. See tests/synthetic/README.md."
            exit 1
          fi
          echo "Both synthetic credentials are present."

      # corepack must be enabled BEFORE setup-node runs: with `cache: pnpm`, setup-node resolves
      # the pnpm binary while configuring the cache. Same ordering as ci.yml.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 🔴 THIS STEP MUST NEVER FAIL THE JOB, AND THAT IS NOT LAZINESS ABOUT RED TICKS.
      #
      # A production deploy is GATED on that commit's check suites (Railway "Wait for CI"), and
      # Railway withholds the deploy when ANY suite on the commit fails — a withheld deploy is
      # marked SKIPPED and never resurrects. A `schedule` run always runs on the default branch, so
      # this workflow attaches a suite to whatever `main` HEAD is when it fires; that cannot be
      # avoided by moving the trigger, because a side branch would run STALE journeys.
      #
      # So if this step failed the job, the sequence would be:
      #   production breaks -> these journeys legitimately go red -> that red suite lands on main
      #   HEAD -> the deploy carrying the FIX is withheld -> production stays broken.
      # The outage would suppress its own repair, once every hour, with nothing obviously wrong in
      # ci.yml. This is a TRUE alarm made harmful by where it lands, which is why the remedy here
      # differs from deploy-drift-check.yml's: that one was a FALSE alarm and was fixed by
      # comparing against a settled ref (tests/deploy-drift-settled-ref.test.ts).
      #
      # Twice this month this class of bug withheld a production deploy: deploy-drift-check's own
      # cron on 2026-09-27 (cd9e0be03), and staging-hr-drift-check.yml failing to parse on
      # 2026-09-29, which froze production for nearly two hours (#4778). A monitor must not be able
      # to gate the deploy it is monitoring.
      #
      # 🔴 THE SIGNAL IS NOT LOST, which is the only reason this is safe. Every run — pass or fail —
      # is written to public.synthetic_journey_runs by the `always()` step below and read by the
      # admin Synthetic Journeys page, and a failure still prints an ::error:: annotation into the
      # run summary from the step after it. What changes is ONLY the job's conclusion, and the job's
      # conclusion is the single thing Railway reads. Do not "tidy" this back into a hard failure.
      - name: Run synthetic journeys
        id: journeys
        continue-on-error: true
        env:
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}
          SYNTHETIC_ADMIN_HR_ID: ${{ secrets.SYNTHETIC_ADMIN_HR_ID }}
          SYNTHETIC_ADMIN_PASSWORD: ${{ secrets.SYNTHETIC_ADMIN_PASSWORD }}
          # Required for the suite to accept a production base URL at all. Journeys stay read-only
          # regardless; SYNTHETIC_ALLOW_MUTATION is deliberately never set here.
          SYNTHETIC_ALLOW_PRODUCTION: "true"
        run: pnpm run synthetic:test

      # The loud half of the step above. `::error::` renders red in the run summary and in the
      # Actions list's annotations, so a human scanning the workflow still sees the failure — while
      # the job's own conclusion stays green so it cannot withhold a deploy. Exits 0 deliberately.
      - name: Report a failed journey without failing the job
        if: ${{ always() && steps.journeys.outcome == 'failure' }}
        run: |
          echo "::error::PRODUCTION SMOKE TEST FAILED — the synthetic journeys did not pass against ${SYNTHETIC_BASE_URL:-https://phoenix-hr.satopharma.com}. This job is deliberately green so it cannot withhold a production deploy (see the comment above this step); the failure is real. Open the admin Synthetic Journeys page, and the Playwright report attached to this run."
        env:
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}

      # SAVE THE RESULT. Without this step the suite ran, passed, and told nobody: the admin
      # Synthetic Journeys page reads public.synthetic_journey_runs, and between 2026-07-03 and
      # 2026-09-09 that table held exactly ONE row while the workflow ran and passed roughly 27
      # times a day. The checks were never blind; their DISPLAY was, which is the harder failure
      # to notice because the workflow's own green tick keeps saying everything is fine.
      #
      # `always()` so a FAILED run is saved too. A run that fails is the one worth looking at on
      # the dashboard, and saving only the passes would rebuild the same silent-green hole from
      # the other side.
      #
      # Reuses PRODUCTION_SUPABASE_SERVICE_ROLE_KEY rather than introducing a token of its own.
      # The alternative was the bearer-token HTTP route (/api/admin/synthetic-journeys/ingest,
      # SYNTHETIC_INGEST_TOKEN) — declined because that variable is set in NEITHER GitHub nor
      # Railway, so wiring it would mean minting a new production credential to fix a reporting
      # gap. Same secret and same pattern as migration-drift-check.yml's production legs.
      - name: Save the run to the dashboard
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run synthetic:save-report
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}

      # Same reasoning as the step above and as migration-drift-check.yml: a skipped save and a
      # successful one are indistinguishable in the run list, and that is precisely how the
      # dashboard sat two months stale without anyone noticing.
      - name: Warn when the run could not be saved
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY != 'true' }}
        run: |
          echo "::warning::PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is not set — the journeys ran but the result was NOT saved, so the admin Synthetic Journeys page still shows the previous run. Add the secret (production project ref ozucdzovmcqvepbozvqf) to enable the dashboard."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: synthetic-report
          path: |
            tests/synthetic/report/html
            output/playwright-synthetic
          retention-days: 14
          if-no-files-found: ignore
