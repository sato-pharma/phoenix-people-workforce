name: Synthetic Journeys (production smoke)

# WHY THIS EXISTS. The GCP alerting layer died with the billing account on 2026-08-01 and was not
# replaced: errors still land in app_error_events, but nothing pages anyone (see
# docs/observability.md). The Healthchecks.io dead-man's-switch survived, but it answers exactly one
# question — "did a cron job run at all?" — and says nothing about whether a page renders.
#
# This suite is the cheapest route back to an automated "is production actually working?" signal,
# and it runs on GitHub's infrastructure rather than Railway's. That matters: a monitor hosted
# inside the thing it monitors cannot report that the thing is down. Same reasoning that kept the
# dead-man's-switch alive while everything inside GCP went with it.
#
# SAFETY. tests/synthetic/ is read-only by construction — it navigates and asserts, and never
# creates, edits, approves, rejects, deletes, uploads or sends. Its global-setup refuses to touch
# production at all unless SYNTHETIC_ALLOW_PRODUCTION=true, and any future mutating journey has to
# declare `mutates: true` and is gated behind SYNTHETIC_ALLOW_MUTATION, which this workflow never
# sets. See tests/synthetic/README.md.
#
# COST. Each run performs one real Super Admin login against production, so it writes one row to
# auth_login_attempts per run. A three-hourly cadence during Cairo working hours keeps that noise
# bounded at ~6 admin logins a day; a 15-minute cadence would put ~96 into production audit data
# for little extra signal.

on:
  # ONE CLOCK, AND IT IS NOT THIS FILE (owner, 2026-10-14, cost cuts). cron-job.org's
  # `phoenix-run-synthetic-journeys` calls /api/cron/run-synthetic-journeys, which dispatches this
  # workflow every 3 hours at :17 past, 05:00-20:00 Africa/Cairo (6 runs/day). Cadence lives in
  # src/lib/observability/job-schedule.ts and at cron-job.org, never in a `schedule:` block here.
  #
  # 🔴 DO NOT ADD A `schedule:` BLOCK BACK. Until 2026-10-14 this file carried one too, so the suite ran
  # ~26 times a day (24 hourly dispatches + ~3 scheduled) while every comment said 6. Measured 13 Oct:
  # 79 billable minutes a day for a smoke test, plus a Super Admin login per run written to production
  # auth_login_attempts. tests/scheduled-alarms-never-withhold.test.ts (DISPATCH_ONLY) fails a
  # schedule: block here. TRADE-OFF, stated plainly: this is the only automated "is production actually
  # up?" signal, and worst-case detection of an outage is now ~3h instead of ~1h. The middle setting
  # is every 2 hours (9 runs/day), changed at cron-job.org and in job-schedule.ts together.
  workflow_dispatch:
    inputs:
      base_url:
        description: "Environment to smoke-test"
        required: false
        default: "https://phoenix-hr.satopharma.com"
      # The same switch every other Telegram alarm here has. It runs only the `test-alert` job below:
      # no login, no journeys, no dashboard row — one message headed TEST to the owner's alert chat.
      test_alert:
        description: "Send a test Telegram alert and stop (proves the alarm still works)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Matches ci.yml — kept in step with it rather than pinned separately.
  CI_NODE_VERSION: "24"

# Never let two runs overlap — they share one Super Admin account, and a second login would
# invalidate the first run's session mid-journey and report a false failure. A test alert logs in to
# nothing, so it takes its own group and never queues behind, or displaces, a real run.
concurrency:
  group: synthetic-journeys${{ inputs.test_alert && '-test-alert' || '' }}
  cancel-in-progress: false

jobs:
  # TEST THE ALARM WITHOUT BREAKING PRODUCTION (owner, 2026-10-31). Dispatched with test_alert=true,
  # it sends the owner one message headed TEST through the same bot, chat and script a real failure
  # uses, and stops. Pinned by tests/synthetic-telegram-alert.test.ts.
  test-alert:
    name: test alert
    if: ${{ inputs.test_alert }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Send the owner a TEST smoke-test alert on Telegram
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SYNTHETIC_ALERT_TEST: "true"
        run: node scripts/synthetic-telegram-alert.mjs

  synthetic:
    name: synthetic
    # A test-alert dispatch runs only the job above. cron-job.org's dispatch sends no inputs, so
    # test_alert takes its default, false, and every real run lands here.
    if: ${{ !inputs.test_alert }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}

    # 🔴 45, NOT 20, AND THE ARITHMETIC IS THE WHOLE REASON. A JOB timeout ignores step-level
    # `continue-on-error` entirely: the runner cancels the job, the suite concludes `cancelled`, and
    # AGENTS.md §2.3 is explicit that "red, cancelled, or still queued = no deploy". So a job timeout
    # is a hole straight through the finish-green guarantee the step comments below spend fifty lines
    # establishing — the one failure mode those comments do not cover.
    #
    # The suite's worst case, from playwright.synthetic.config.ts and tests/synthetic/journeys/:
    #   14 journeys (11 spec files; employee-360-outstation-expenses.spec.ts holds 4)
    #     x 60s per-test `timeout`
    #     x 2 attempts (`retries: 1`)
    #   = 28 minutes, plus the `setup` project's login (one more test, so ~2 min)
    #   plus checkout + pnpm install + Chromium ~3-4 min on a cold cache
    #   ~= 34 minutes before anything is wrong.
    # 20 minutes was BELOW that, so a merely slow production — not a broken one — cancelled the suite.
    #
    # The alternative was a Playwright `globalTimeout` comfortably below the job timeout. Not taken
    # here: the config is shared with local and preview runs, where a hard global cap would truncate a
    # deliberate investigation. The job timeout is the leg that is specific to CI, so it is the leg
    # that moves. 45 leaves ~11 minutes of headroom over the 34-minute worst case, which is enough for
    # a slow runner without letting a genuinely hung run burn an hour of billable minutes.
    # 🔴 EVERY `continue-on-error` STEP BELOW CARRIES ITS OWN `timeout-minutes`, AND THIS CEILING
    # SITS ABOVE THEIR SUM (2026-10-13). A JOB that hits its ceiling concludes `cancelled`, which
    # withholds that `main` commit's production deploy exactly as a failure does — and a timeout is
    # not a step failure, so `continue-on-error` cannot absorb it. A STEP that hits its own ceiling
    # fails only that step, which `continue-on-error` turns into a reported finding with the job
    # still green. Account and the two runs it cost: migration-drift-check.yml, above its job.
    # Pinned by tests/github-workflow-validity.test.ts.
    timeout-minutes: 45

    # `secrets` is NOT a valid context in a step-level `if:` — GitHub rejects it with
    # "Unrecognized named-value: 'secrets'" and the ENTIRE workflow fails to parse, so every run
    # goes red before any job starts. That is exactly what happened to migration-drift-check.yml
    # on 2026-07-30; its header carries the same warning. Surface the key as a job-level env var
    # instead — `env` CAN read secrets, and a step `if:` CAN read job-level `env`. The secret's
    # VALUE is still injected only into the step that uses it; this copy is a presence flag only.
    env:
      HAS_PRODUCTION_SUPABASE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Fail LOUDLY on a missing secret rather than skipping. docs/observability.md records the
      # exact trap: a skipped step and a passing step look identical at a glance, which is the
      # silent-green failure this workflow exists to prevent. The suite's own global-setup also
      # aborts before opening a browser, but failing here gives a one-line reason in the run
      # summary instead of a Playwright stack trace.
      - name: Verify required secrets are present
        env:
          HR_ID: ${{ secrets.SYNTHETIC_ADMIN_HR_ID }}
          PASSWORD: ${{ secrets.SYNTHETIC_ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -z "$HR_ID" ] && missing="$missing SYNTHETIC_ADMIN_HR_ID"
          [ -z "$PASSWORD" ] && missing="$missing SYNTHETIC_ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — create a dedicated read-only Super Admin account and add them under Settings → Secrets and variables → Actions. See tests/synthetic/README.md."
            exit 1
          fi
          echo "Both synthetic credentials are present."

      # corepack must be enabled BEFORE setup-node runs: with `cache: pnpm`, setup-node resolves
      # the pnpm binary while configuring the cache. Same ordering as ci.yml.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CACHE THE BROWSER. Copied from ci.yml's "Cache Playwright browsers" step, same action SHA pin,
      # so the two stay one pattern. Until 2026-10-06 this workflow ran a bare
      # `playwright install --with-deps chromium` on EVERY run — and its header records the real rate
      # as ~27 runs/day (~24 cron-job.org dispatches + ~3 scheduled), not the ~6 the cadence comment
      # alone implies. That is ~27 Chromium downloads and ~27 apt dependency installs a day on a job
      # whose actual work is a handful of page loads.
      #
      # 🔴 `env.ImageOS` IS IN THE KEY ON PURPOSE AND MUST STAY. An exact cache hit SKIPS the
      # `install-deps` step below, so the cached browser is only usable against the system libraries
      # of the image it was installed on. `ubuntu-latest` migrates to Ubuntu 26 on 2026-10-19; without
      # the image in the key, the first run after that migration would restore a browser built for the
      # old image, skip install-deps because the hit was exact, and fail to launch Chromium — which on
      # this workflow reads as "production is down", because that is what a failed journey means here.
      # A partial hit through `restore-keys` leaves `cache-hit` != 'true', so install-deps still runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.ImageOS }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ env.ImageOS }}-${{ runner.arch }}-

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium

      # 🔴 THIS STEP MUST NEVER FAIL THE JOB, AND THAT IS NOT LAZINESS ABOUT RED TICKS.
      #
      # A production deploy is GATED on that commit's check suites (Railway "Wait for CI"), and
      # Railway withholds the deploy when ANY suite on the commit fails — a withheld deploy is
      # marked SKIPPED and never resurrects. A `schedule` run always runs on the default branch, so
      # this workflow attaches a suite to whatever `main` HEAD is when it fires; that cannot be
      # avoided by moving the trigger, because a side branch would run STALE journeys.
      #
      # So if this step failed the job, the sequence would be:
      #   production breaks -> these journeys legitimately go red -> that red suite lands on main
      #   HEAD -> the deploy carrying the FIX is withheld -> production stays broken.
      # The outage would suppress its own repair, once every hour, with nothing obviously wrong in
      # ci.yml. This is a TRUE alarm made harmful by where it lands, which is why the remedy here
      # differs from deploy-drift-check.yml's: that one was a FALSE alarm and was fixed by
      # comparing against a settled ref (tests/deploy-drift-settled-ref.test.ts).
      #
      # Twice this month this class of bug withheld a production deploy: deploy-drift-check's own
      # cron on 2026-09-27 (cd9e0be03), and staging-hr-drift-check.yml failing to parse on
      # 2026-09-29, which froze production for nearly two hours (#4778). A monitor must not be able
      # to gate the deploy it is monitoring.
      #
      # 🔴 THE SIGNAL IS NOT LOST, which is the only reason this is safe. Every run — pass or fail —
      # is written to public.synthetic_journey_runs by the `always()` step below and read by the
      # admin Synthetic Journeys page, a failure still prints an ::error:: annotation into the run
      # summary from the step after it, and on `main` against production it pages the owner's
      # Telegram from the step after that. What changes is ONLY the job's conclusion, and the job's
      # conclusion is the single thing Railway reads. Do not "tidy" this back into a hard failure.
      - name: Run synthetic journeys
        id: journeys
        continue-on-error: true
        timeout-minutes: 20
        env:
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}
          SYNTHETIC_ADMIN_HR_ID: ${{ secrets.SYNTHETIC_ADMIN_HR_ID }}
          SYNTHETIC_ADMIN_PASSWORD: ${{ secrets.SYNTHETIC_ADMIN_PASSWORD }}
          # Required for the suite to accept a production base URL at all. Journeys stay read-only
          # regardless; SYNTHETIC_ALLOW_MUTATION is deliberately never set here.
          SYNTHETIC_ALLOW_PRODUCTION: "true"
        run: pnpm run synthetic:test

      # The loud half of the step above. `::error::` renders red in the run summary and in the
      # Actions list's annotations, so a human scanning the workflow still sees the failure — while
      # the job's own conclusion stays green so it cannot withhold a deploy. Exits 0 deliberately.
      - name: Report a failed journey without failing the job
        if: ${{ always() && steps.journeys.outcome == 'failure' }}
        run: |
          echo "::error::PRODUCTION SMOKE TEST FAILED — the synthetic journeys did not pass against ${SYNTHETIC_BASE_URL:-https://phoenix-hr.satopharma.com}. This job is deliberately green so it cannot withhold a production deploy (see the comment above this step); the failure is real. Open the admin Synthetic Journeys page, and the Playwright report attached to this run."
        env:
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}

      # 🔴 THE OWNER'S TELEGRAM — THE ONLY HALF OF THE ALARM THAT REACHES A PERSON (owner, 2026-10-31:
      # "alert my Telegram when the production smoke test fails"). The annotation above and the
      # dashboard row are read only by someone who goes looking: every run failed from 28 Oct 05:18 to
      # 31 Oct 2026, 23 in a row, and nobody knew for three and a half days.
      #
      # Fires on a failed journey AND on a run that died before the journeys (`failure()` — a missing
      # credential or a failed install leaves production unchecked, which must not be silent either).
      # main only, so a branch dispatch testing a journey change never pages him; production only, so a
      # manual run against another environment never reads as production down. At most once per run,
      # so at most six a day while production stays broken (05:00-20:00 Cairo).
      #
      # Placed BEFORE the save so the alert never waits on, or depends on, the production database —
      # which is down exactly when production is. continue-on-error + its own timeout for the same
      # reason as every leg here: a Telegram outage must not turn this job red and withhold a deploy.
      # The script is Node built-ins only, because on a run that died in setup there is no
      # node_modules and possibly no setup-node. Pinned by tests/synthetic-telegram-alert.test.ts.
      - name: Tell the owner on Telegram that the production smoke test failed
        id: telegram
        if: ${{ always() && github.ref == 'refs/heads/main' && (inputs.base_url || 'https://phoenix-hr.satopharma.com') == 'https://phoenix-hr.satopharma.com' && (steps.journeys.outcome == 'failure' || failure()) }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/synthetic-telegram-alert.mjs

      # SAVE THE RESULT. Without this step the suite ran, passed, and told nobody: the admin
      # Synthetic Journeys page reads public.synthetic_journey_runs, and between 2026-07-03 and
      # 2026-09-09 that table held exactly ONE row while the workflow ran and passed roughly 27
      # times a day. The checks were never blind; their DISPLAY was, which is the harder failure
      # to notice because the workflow's own green tick keeps saying everything is fine.
      #
      # `always()` so a FAILED run is saved too. A run that fails is the one worth looking at on
      # the dashboard, and saving only the passes would rebuild the same silent-green hole from
      # the other side.
      #
      # Reuses PRODUCTION_SUPABASE_SERVICE_ROLE_KEY rather than introducing a token of its own.
      # The alternative was the bearer-token HTTP route (/api/admin/synthetic-journeys/ingest,
      # SYNTHETIC_INGEST_TOKEN) — declined because that variable is set in NEITHER GitHub nor
      # Railway, so wiring it would mean minting a new production credential to fix a reporting
      # gap. Same secret and same pattern as migration-drift-check.yml's production legs.
      #
      # 🔴 continue-on-error PLUS AN id, FOR THE SAME REASON THE JOURNEY STEP HAS THEM. This step
      # writes to PRODUCTION Supabase, and scripts/synthetic-save-report.ts exits 1 on a missing or
      # empty report — so a Supabase hiccup, a network blip or a run whose reporter wrote nothing
      # turned this job RED, and a red suite on `main` HEAD withholds that commit's production deploy
      # permanently. That is the precise failure the step above is written to avoid, arriving one step
      # later through the DASHBOARD WRITE rather than through the journeys themselves. A failed save
      # is a REPORTING gap, never evidence about production, so it must not be able to gate a deploy.
      #
      # The loudness is not given up: the step below turns a failed save into a ::warning:: and a job
      # summary line, which is the same treatment the missing-secret case already had. What must never
      # happen is this step losing its guard AND its reporter together — a silent save failure rebuilds
      # the two-month stale dashboard described above from a third direction.
      - name: Save the run to the dashboard
        id: save
        continue-on-error: true
        timeout-minutes: 4
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run synthetic:save-report
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SYNTHETIC_BASE_URL: ${{ inputs.base_url || 'https://phoenix-hr.satopharma.com' }}

      # Same reasoning as the step above and as migration-drift-check.yml: a skipped save and a
      # successful one are indistinguishable in the run list, and that is precisely how the
      # dashboard sat two months stale without anyone noticing.
      - name: Warn when the run could not be saved
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY != 'true' }}
        run: |
          echo "::warning::PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is not set — the journeys ran but the result was NOT saved, so the admin Synthetic Journeys page still shows the previous run. Add the secret (production project ref ozucdzovmcqvepbozvqf) to enable the dashboard."

      # The other half of the save step's guard, and the reason that guard is safe to add. The secret
      # being ABSENT already had a warning; the save RUNNING AND FAILING had none, because until
      # 2026-10-06 it simply failed the job. Making the step unable to fail without this step would
      # convert a withheld deploy into a silently stale dashboard — which is the very hole the save
      # step was added to close, so it would be a straight trade rather than a fix.
      #
      # A ::warning:: rather than an ::error:: deliberately: a failed save says nothing about whether
      # production is healthy, and an ::error:: here would read like one of the journeys going red.
      # The journeys keep the ::error:: to themselves.
      - name: Warn when the save itself failed
        if: ${{ always() && steps.save.outcome == 'failure' }}
        run: |
          {
            printf '## Synthetic run was NOT saved to the dashboard\n\n'
            printf 'The journeys ran, but `pnpm run synthetic:save-report` failed, so **public.synthetic_journey_runs has no row for this run** and the admin Synthetic Journeys page still shows the previous one.\n\n'
            printf 'This step does NOT fail the job on purpose: the save writes to production Supabase, and a red suite here would withhold the production deploy of whatever commit was `main` HEAD when the schedule fired (AGENTS.md §2.3). Read the failed step above for the reason — usually a Supabase hiccup, or a report the Playwright reporter never wrote.\n\n'
            printf 'The journey verdict itself is NOT lost: it is in this run log, and a failed journey still prints its own `::error::` annotation.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::The synthetic run was NOT saved to the dashboard — synthetic:save-report failed, so the admin Synthetic Journeys page is now showing a stale run. The job stays green on purpose so it cannot withhold a production deploy; read the failed step above."

      # `continue-on-error` for the same reason as the save step, and it is not a formality: this step
      # runs under `always()`, so it runs after a FAILED journey — exactly when production is broken
      # and the deploy carrying the fix must not be withheld. An artifact upload fails for reasons that
      # have nothing to do with this repository (a storage blip, a quota, a 503 from the artifact
      # service), and none of them are worth a cancelled production deploy. Losing the HTML report is
      # an inconvenience; the verdict is already in the log, the annotation and the dashboard row.
      - name: Upload Playwright report
        continue-on-error: true
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-report
          path: |
            tests/synthetic/report/html
            output/playwright-synthetic
          retention-days: 14
          if-no-files-found: ignore
