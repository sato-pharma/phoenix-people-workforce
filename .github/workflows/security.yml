name: Security

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # Weekly scan on Monday at 08:00 UTC to catch new CVEs even without code changes.
    - cron: "0 8 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high + critical)
        run: npm audit --audit-level=high --json | tee audit-report.json || true

      - name: Fail on high/critical vulnerabilities
        run: |
          HIGH=$(node -e "const r=require('./audit-report.json'); const v=r.metadata?.vulnerabilities || {}; console.log((v.high||0)+(v.critical||0))")
          echo "High+critical vulnerabilities: $HIGH"
          if [ "$HIGH" -gt "0" ]; then
            echo "::error::$HIGH high or critical npm vulnerabilities found. Run 'npm audit' locally and fix before merging."
            exit 1
          fi

  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
