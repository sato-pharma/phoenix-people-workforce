name: CI

# CI SPEED-UP (2026-07-30). Originally landed alongside a temporary fast-deploy window in
# the Cloud Run deploy workflow. That window expired, its dead config was removed (2026-07-31),
# and the workflow itself was deleted (2026-09-08) — but these CI changes are KEPT PERMANENTLY
# and deliberately were not reverted with it: they remove wasted work rather than trade away
# verification, so there is nothing to revert to. No gate is relaxed and no step is skipped; the same checks run, with
# one fewer artifact round-trip and one more parallel runner.
#
# MEASURED baseline (run 30507413475, commit 87f26e05) = 308s wall-clock:
#   validate        237s  (setup 33s, test 13s, BUILD 143s, upload artifact 40s)
#   lint-typecheck  216s  (lint 114s + typecheck 67s, serial in one job)
#   preview-smoke    68s  (starts only after validate; re-does setup 26s, downloads 11s)
# Three inefficiencies, each fixed below:
#   1. The build artifact existed ONLY to hand .next to preview-smoke. Uploading (40s) +
#      downloading (11s) + a second job's setup (26s) = ~77s of pure overhead to move a
#      directory to a machine that then rebuilt nothing. Playwright's webServer runs
#      `pnpm run start` against .next in CI, so the smoke test now runs in-place in the
#      job that produced the build. No artifact, no round-trip.
#   2. lint (114s) and typecheck (67s) were serial in one job for no reason — they share
#      nothing but node_modules. Now two parallel jobs.
# A third fix was tried and REVERTED after measurement: switching the dead .next cache to
# the documented `.next/cache` + restore-keys pattern. It restored fine and changed nothing
# (37KB cache, build 148s warm vs 143s cold) — see the note on the cache step below, which
# records the evidence so nobody re-attempts it.
#
# MEASURED RESULT: 308s -> 235s (-24%). My pre-change estimate of ~166s was WRONG; it
# assumed the cache fix would cut the 143s build, and it did not. The build is now the
# dominant remaining term. Extra cost is one more parallel runner; no gate is relaxed.
#
# SAME IDEA AGAIN, 2026-09-17: inefficiency 2 was still there, one level down, inside
# `validate`. `pnpm run test` shared nothing but node_modules with the build it ran in front
# of, and was 96s and 98s of a 364s and 371s job on runs 35258637196 and 35257651146. It is
# the `test` job now, which lands under `typecheck` and therefore off the critical path;
# `validate` drops to ~268s and the wall clock with it. Full reasoning on that job — including
# why `test` had to be added to branch protection's required checks, which happened on
# 2026-09-18, a day after the split had left the tests gating nothing at all.
#
# 🔴 GITHUB-HOSTED ONLY, AND NOTHING WAITS FOR ANYTHING IT DOES NOT NEED (owner, 2026-10-19: "retire
# the hetzner box and do not use it ever again, it is the source of slowness", and "make all ci
# actions to be on github … checks on one or ten or even 100 at the same time … as fast as you can
# safely without skipping any check"). Every job below runs on `ubuntu-latest`, written as a literal:
# no label, variable or kill switch can send one to a machine of ours, and
# tests/ci-runner-switch.test.ts fails a workflow that tries. The graph, four jobs side by side:
#
#   validate  the production Build and the Playwright login smoke against it (a PR builds only when
#             scripts/ci-build-risk.mjs says its diff can change a build)
#   static    the check:* contracts, the dependency audit, ESLint, the type gate, the tree-reuse dry run
#   unit      the unit suite as 2 parallel jobs of 2 shards, every test in exactly one shard
#   checks    the gate for static + unit: green only when both are literally `success` AND the parts'
#             coverage records add up to every test the runner declares (scripts/ci-unit-coverage.mjs)
#
# `validate` and `checks` are still the two required check names. NOTHING IS SKIPPED: every step that
# ran before still runs, on the same events, in exactly one of those jobs — they just no longer queue
# behind each other. Before (2026-10-19, run 39267143638 on `main` and 39267504616 on a PR) the slowest
# required job read 417 s on `main` (`checks`: lint, the type gate and the 302 s suite in series) and
# 616 s on a PR (`validate`: the 247 s suite in front of a 306 s build).

# 🔴 THERE IS NO DOCS-ONLY FAST PATH ANY MORE, AND RE-ADDING ONE IS THE 2026-10-02 INCIDENT.
# Removed 2026-10-06. Every job runs every step on every PR; the only conditional work left is the
# build and the Playwright smoke, which are gated on the EVENT (`github.event_name`), never on what
# the diff touched to SKIP anything.
#
# The one diff-driven step since 2026-10-08 runs the other way: `Build risk` in `validate` can only
# ADD the Build to a pull request (which otherwise never builds), never remove a step. `main` builds
# every commit whatever it says. Narrowed the same day (owner): a PR builds only when it touches a
# route or build-config file, ~19% of PRs; it still answers `build=true` on any error or unreadable
# diff, and a rename is read as both of its paths. Script: scripts/ci-build-risk.mjs; pinned by
# tests/ci-build-risk.test.ts and tests/ci-gate-parity.test.ts.
#
# It existed in two forms and both failed the same way. First as `paths-ignore` here plus a
# ci-docs-fallback.yml stub, which double-reported `validate`/`lint`/`typecheck` on any PR touching
# both code and docs (#2041: real 4m23s/3m12s/1m50s beside stub 3s/5s/4s, under identical names) —
# a required check satisfiable by a job that never looks at the code. Then as a shell classifier
# inside each job, skipping the expensive steps for a diff of `*.md` and `docs/` paths.
#
# THE CLASSIFIER WAS WRONG ABOUT WHAT A DOC IS, AND IT COST THREE PRODUCTION DEPLOYS. Plenty of
# "documentation" here is asserted on by the suite: `.claude/rules/*.md` and
# `.claude/cloud-context/**` (tests/module-memory.test.ts, tests/agents-long-hooks-cite-docs.test.ts),
# `.claude/skills/ship/SKILL.md` (tests/required-check-names.test.ts), `docs/*-live-sheet.gs` (eight
# test files, one of which EXECUTES the script apps-script-push.yml pushes into the live sheet on
# merge), and everything under `docs/` (tests/docs-share-token-guard.test.ts, which exists because
# share tokens were committed under `docs/` twice and gitleaks cannot see that shape). PR #5182 was
# seven `.claude/cloud-context/*.md` files: both required checks passed in ~10 seconds, and the
# merge then failed `validate` on `main` — on 8b2921549 and on the two commits after it, with
# Railway withholding all three deploys (§2.3). The classifier also could not see a RENAME: `git
# diff --name-only` detects them by default, so moving `scripts/x.mjs` to `docs/archive/x.mjs`
# listed the new path only and read as docs.
#
# WHAT IT WAS WORTH: `docs_only` answered true on 1 of 44 runs when it was measured (2.3%, the
# figure the folded-in classifier was justified with). At that rate the whole fast path buys about
# four short runs a day — against a gate that cannot be trusted to be a gate. Patching the file list
# instead was considered and declined: the list is the thing that was wrong, twice, and the next
# test to assert on a path nobody thought of fails exactly the same way, silently.
on:
  pull_request:
  # 🔴 THE `push` TRIGGER IS THE PRODUCTION DEPLOY GATE. DO NOT REMOVE IT TO SAVE MONEY.
  #
  # Railway's "Wait for CI" is enabled on the production service, and it waits on the Actions check
  # SUITES attached to the pushed commit. Delete `main` from this list and there is no suite to wait
  # for, so Railway stops waiting and every merge ships unverified again — silently, with no red
  # check and nothing in this file to show what broke. Un-gating production would look like a
  # tidy-up diff.
  #
  # It is a tempting deletion, which is why this comment exists. Measured 2026-09-27: `push` is
  # 32.7% of ci.yml's billable minutes (~$98 of a $300.88 month) and the jobs it runs are a repeat
  # of the ones the PR already ran, so it reads like pure waste — a session proposed removing it
  # that day and the owner's answer was "no i want 2 stop bad deploy". It is not waste; it is the
  # only verification the MERGED tree ever gets, because branch protection runs `strict: false`
  # (PRs need not be up to date), and it is the only detector of a red `main` at all, because
  # next.config.ts sets `typescript: { ignoreBuildErrors: true }` — a red main builds, deploys and
  # serves perfectly. Account: docs/deployment.md, "The deploy gate".
  #
  # 🔴 STILL TRUE AFTER THE RELEASE GATE (2026-10-19): once Railway's Wait for CI is switched off, the gate is
  # this run's `release-gate` job rather than the suite, but it is a job of THIS push run all the same, so the
  # same deletion would leave production with no row ever written and nothing able to go live. The two
  # mechanisms overlap on purpose until the owner switches Wait for CI off. docs/deployment.md, "The release gate".
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full Playwright E2E regression suite
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# PR branches: group by ref and cancel the superseded run — pushing a fixup should not pay for
# CI on the commit it just replaced.
#
# Pushes to main: group by COMMIT and never cancel. KEEP IT THAT WAY — and as of 2026-09-27 the
# ORIGINAL reason is back, on top of the one that replaced it.
#
# The original hazard was the Cloud Run deploy gate, which shipped a commit only if THAT exact
# SHA's CI concluded `success`, so a merge landing mid-run cancelled it and left that commit
# permanently un-deployable. That workflow was deleted 2026-09-08, and for three weeks Railway
# deployed on push without consulting CI, so nothing was un-deployable — the setting was kept
# only because grouping by ref would cancel a main run and leave `main`'s own head with NO CI
# verdict, which is how a red `main` ships unnoticed (§2.1: a red main still builds, ships and
# serves perfectly).
#
# 🔴 RAILWAY "WAIT FOR CI" RESTORES THE CLOUD RUN HAZARD EXACTLY. Railway now holds the deployment
# until the commit's check suites finish, and it treats a CANCELLED run as blocking unless another
# workflow on the same commit succeeded. So a cancelled main run can once again leave a merged
# commit undeployed — and this time Railway's own two-hour timeout then SKIPS the deployment
# outright, with no red check anywhere. Both reasons now point the same way: never cancel a main
# run, and never group main by ref.
#
# The cancellation itself is real and measured. Observed 2026-07-30: #1484, #1486 and #1487
# merged ~1 minute apart and all three ended `cancelled`; only the last commit of the train ever
# went green. Under Cloud Run that meant a commit the 2-hourly deploy cron would never ship,
# announced only in a `::notice::` nobody reads. Under ungated Railway the consequence INVERTED and
# got quieter rather than louder: the commit shipped regardless, immediately, and the cancelled run
# meant nobody ever found out whether it was sound. With Wait for CI it has inverted BACK — a
# cancelled run now withholds the deploy — so the train of three would today leave the first two
# commits unshipped rather than unverified. Same setting, third distinct reason to keep it.
#
# Grouping by SHA rather than simply setting cancel-in-progress:false keeps the runs PARALLEL.
# A shared main group with cancellation disabled would serialize the train instead (~4 min per
# commit, queued), which would push merge->live latency back up — the exact thing #1480/#1483
# were cutting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_NODE_VERSION: "24"
  # corepack downloads the pinned pnpm on first use; suppress its interactive
  # confirmation prompt so it can never hang a runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # WHERE THEY RUN, AND WHAT CAPS HOW MANY RUN AT ONCE. GitHub's own `ubuntu-latest`, a literal, on
  # purpose. It used to be a computed expression that could send a pull request to a self-hosted box (the
  # Hetzner box, `CI_SELF_HOSTED` / `CI_RUNNER_LABEL`); the owner retired that box on 2026-10-19 as the
  # source of the slowness and ruled it is never used again, so there is no switch left to flip. `main`
  # was always hosted, because its CI is the production deploy gate (AGENTS.md §2).
  #
  # Capacity is GitHub's: the account's plan caps how many jobs run at once (GitHub Pro 40; more is a
  # request to GitHub Support), and a job past the cap QUEUES — it does not fail. A superseded pull
  # request run is cancelled by the `concurrency` block above, which hands its slots to the newest push.
  #
  # THE JOBS ARE SHORT ON PURPOSE: GitHub bills and caps by job, so the unit suite is two jobs (not
  # twelve) — every job re-pays ~70 s of setup and rounds up to a whole billed minute.

  # validate — the production Build and the Playwright login smoke against that very artifact.
  #
  # THE JOB ALWAYS RUNS AND ALWAYS REPORTS, and is never `if`-ed out: a skipped job reports no status, and
  # a required check with no status blocks a PR forever — the exact breakage ci-docs-fallback.yml was
  # invented to paper over. The only conditional steps are the ones gated on the EVENT (and, on a pull
  # request, `Build risk`, which can only ADD the Build). It no longer carries the check:* contracts, the
  # audits or the unit suite: those are `static` and `unit` since 2026-10-19, so `main`'s slowest job is
  # the build alone and not the build behind forty seconds of checks.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # depth 2, not 1 — and 🔴 NOT for the reason this comment gave until 2026-10-06, which
          # was wrong in a way worth recording because it told its reader a gate runs that does not.
          # It claimed depth 2 keeps `scripts/check-migrations.mjs`'s cross-branch timestamp-collision
          # check alive. It does not, at any depth: on a `pull_request`, actions/checkout fetches the
          # merge ref alone, so there is no `refs/remotes/origin/main` to compare against, and that
          # script FAILS OPEN by design (check-migrations.mjs:101) — it says so itself, naming
          # `fetch-depth: 2` as the case it degrades on. That check is therefore SKIPPED on every PR
          # today, which is a real gap (it is the step behind 10 of 14 recent `validate` failures,
          # and the collision it finds is one the branch cannot see), but closing it means fetching
          # `origin/main` explicitly, not changing this number.
          #
          # What depth 2 is actually worth now: nothing in THIS job reads a second commit since the
          # per-job docs-only classifier was removed on 2026-10-06, so it is kept only because the
          # `mobile` job genuinely needs it (HEAD^1..HEAD, line ~793), one spelling across the file is
          # cheaper to reason about than three, and the extra commit costs no measurable time.
          fetch-depth: 2

      # corepack must be enabled BEFORE setup-node runs: setup-node looks for the package manager named
      # in package.json's `packageManager` field even with its cache off, and the pnpm shim only exists
      # once corepack is enabled. corepack then reads the exact pnpm version from that field.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # No `cache:` and the automatic one OFF: setup-node's cache saves from PR runs too. The pnpm
          # store (NOT node_modules — pnpm's symlink+hardlink layout does not round-trip through a tar
          # archive) is restored by the two steps below and saved only by `static` on a push to main.
          package-manager-cache: false

      # 🔴 THE PNPM STORE IS RESTORED EVERYWHERE AND SAVED BY A PUSH TO MAIN ONLY (owner, 2026-10-26).
      # setup-node's own `cache: pnpm` saved from every PR run too, into a scope only that PR can read
      # (refs/pull/N/merge): ~350 MB an entry that nothing else reuses, crowding main's entries out of the
      # 10 GB repository cache. The key names everything that makes a store valid — OS, architecture, Node
      # major, the exact pnpm version, a format version and the lockfile — and has NO restore prefix, so a
      # run restores an exact match or nothing, and a store never accumulates old packages. Anything this
      # step cannot read keys the cache to this run alone (a miss), never to a guess.
      # Pinned by tests/ci-cache-main-only.test.ts.
      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store="$(pnpm store path 2>/dev/null | tail -n 1 || true)"
          pnpm_version="$(pnpm --version 2>/dev/null || true)"
          node_major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || true)"
          if [[ "${store}" == /* && "${pnpm_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${node_major}" =~ ^[0-9]+$ ]]; then
            echo "path=${store}" >> "$GITHUB_OUTPUT"
            echo "prefix=pnpm-store-v1-${RUNNER_OS}-${RUNNER_ARCH}-node${node_major}-pnpm${pnpm_version}" >> "$GITHUB_OUTPUT"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read the pnpm store (store '${store}', pnpm '${pnpm_version}', node '${node_major}'); the pnpm cache is keyed to this run alone"
            echo "path=${RUNNER_TEMP}/pnpm-store-unverified" >> "$GITHUB_OUTPUT"
            echo "prefix=pnpm-store-v1-unverified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.prefix }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # THE .next BUILD CACHE WAS DELETED HERE ON 2026-08-29. Do not re-add it.
      #
      # It restored fine, it hit more often than the note that used to sit here claimed, and it
      # saved nothing. Measured from both directions. The `.next/cache` variant was tried on run
      # 30508669485 and restored `~0 MB (37626 B)` — Next 16 does not populate that directory the
      # way the classic webpack pattern assumes — against a build of 148s warm vs 143s cold. The
      # whole-`.next` variant that lived here got a genuine 221 MB cache HIT on run 33247025928
      # and the build still took 190s, of which 167s is compilation that no output cache reaches.
      #
      # It was not free. It cost 10-15s of every validate run, and — the reason it had to go — its
      # 221 MB entries had reached 15.92 GB across 74 keys: 97% of a 16.47 GB repository cache
      # budget, which GitHub evicts least-recently-used. A cache proven to save nothing had all but
      # taken the budget over, crowding out the pnpm (289 MB) and Playwright browser (269 MB)
      # caches, which do save time. Count the entries by PAGINATING /actions/caches — the first
      # reading here said 41 keys / 8.85 GB because it read only the first page of 165, and
      # /actions/cache/usage is no help: it still reported the pre-purge 16.47 GB long after the
      # deletions landed. The 74 were purged 2026-08-29, taking the repo from 16.47 GB to 0.56 GB.
      # Removing it is also strictly safer: a stale restore was the failure mode the old comment
      # here warned about, and a build that always starts clean cannot have one.
      #
      # AND THERE IS NO BUNDLER LEVER LEFT EITHER — `next build --turbopack` IS A NO-OP HERE.
      # It was listed in this comment for a long time as the way to attack the compile time. Next
      # 16.2.11 already builds with Turbopack BY DEFAULT. Measured on run 33248502283, which ran
      # both forms back to back on one runner: plain `next build` and `next build --turbopack`
      # each printed `▲ Next.js 16.2.11 (Turbopack)`, took 175s and 174s, and produced
      # byte-identical standalone trees — 19,237 files, 413,308,053 bytes, 0 files differing, and
      # the real verify-standalone-canvas.mjs gate passed on both. The identical byte count is the
      # tell that they were one bundler run twice: two different bundlers cannot produce that.
      #
      # So validate's ~186s of compilation is already Turbopack's own time. The objection that used
      # to stand here — that the flag was avoided because it "would make CI's build differ from the
      # production Docker build" — was wrong twice over: the Dockerfile runs `pnpm run build`, the
      # same script CI runs, so changing that script would have moved both together anyway.
      # DO NOT RE-RUN THIS EXPERIMENT. It costs ~10 CI minutes to re-derive a settled answer.
      #
      # It also could not have been trialled on staging first, which is the obvious next thought: a
      # branch cannot be staged on Railway without shipping it, because
      # `railway service source connect` is service-level rather than environment-scoped. See
      # AGENTS.md §2.3. CI was the only safe place to ask, and it has now answered.
      #
      # ONE LEVER DID APPEAR LATER, AND IT WAS A COST RATHER THAN A SPEED-UP. Next 16.3 (bumped
      # 2026-09-09, #3559) writes a Turbopack filesystem cache at the end of every `next build` by
      # default, and the build waits for it: "Finished writing to filesystem cache" logged 49s to
      # 4.4 min. Nothing restores it (see the deleted cache above), so next.config.ts sets
      # `turbopackFileSystemCacheForBuild: false`. The measurement is on that line. If that log line
      # ever reappears in this step, the flag has been lost.
      #
      # THIS STEP'S WALL TIME IS RUNNER NOISE, NOT A REGRESSION — DO NOT GO LOOKING FOR THE COMMIT
      # THAT "SLOWED THE BUILD". Measured 2026-09-25 across 39 successful `main` runs from the two
      # days prior: the Build step ranged 148s..245s, mean ~193s, with NO step-change tied to any
      # commit. Commits minutes apart swung 177->194->245->162s (6f0209f, 04991c8, 37c75ae,
      # 6ddd16e) purely on which shared 2-core GitHub runner drew the job, and the low samples land
      # AFTER the high ones in time — a real regression shifts the FLOOR, and this floor does not
      # move. So any single-sample comparison ("it used to be 175s, now it's 213s") is comparing two
      # draws from one ~±25% distribution and will always find a phantom. The build is Turbopack's
      # own compile time on a noisy 2-vCPU runner; the ONLY lever that moves both the mean and the
      # spread is a larger/dedicated runner (a billing decision), not a code change. Do not re-run
      # the trend — it costs ~40 API calls to re-derive this same answer.

      # 🔴 THE BUILD AND THE LOGIN SMOKE RUN ON `main`, A DISPATCH AND A SCHEDULE — NOT ON A
      # PULL REQUEST. Owner's decision, 2026-09-29, to cut cost WITHOUT slowing the work down.
      #
      # MEASURED that day, on run 36610968349: `validate` 295s of which the Build alone was
      # 200s (68%), its only consumer a 37s Playwright login smoke. Billing rounds every JOB up
      # to a whole minute, so validate cost 5 billable minutes per run against `checks`'s 6.
      # There were 185 pull_request runs that day. Dropping the build from the PR takes validate
      # to ~90s (2 minutes), saving ~3 minutes x 185 = ~555 billable minutes/day, about a fifth
      # of the whole bill — and every PR finishes ~3.5 minutes EARLIER, which is the half that
      # made it acceptable. The alternative levers all cost speed: a merge cooldown (he cut it),
      # merging validate into checks (they run in parallel, so it doubles the wait).
      #
      # 🔴 THE TRADE-OFF, STATED PLAINLY BECAUSE IT IS NOT FREE: a build break or a broken
      # login now surfaces on `main` rather than on the PR. PRODUCTION IS STILL PROTECTED — a red
      # `main` fails the check suite, and Railway's Wait for CI then withholds the deploy, so
      # nothing ships unverified. What is delayed is the DISCOVERY, and the cost of that is a
      # fix-forward on main instead of a red PR. If that ever proves too expensive, the middle
      # setting is to keep the build on PRs that touch `app/`, `src/` or `next.config.ts` and
      # skip it elsewhere — not a return to building on every PR.
      #
      # 🔴 THAT MIDDLE SETTING IS NOW LIVE (2026-10-08, the performance-recovery PR), DEFINED BY
      # EXCLUSION SO IT CAN ONLY ERR TOWARDS BUILDING. A PR builds unless EVERY changed path is one
      # a Next build never reads (docs, markdown, tests, .claude, other workflows, mobile,
      # migrations, xlsx, scripts nothing imports). Deleted and renamed paths count (--no-renames
      # lists both halves), and an unreadable diff or any classifier error answers build=true.
      # Only the Build is added: the canvas check, the standalone assembly and the login smoke stay
      # `main`-only. `main` itself is unchanged — the left half of the Build's `if:` is the event,
      # which cannot be empty, so a mis-emitted output never gates the main build off.
      - name: Build risk
        id: buildrisk
        if: github.event_name == 'pull_request'
        run: |
          files="$(git diff --name-only --no-renames HEAD^1 HEAD 2>/dev/null)" || files=""
          printf '%s\n' "$files" | node scripts/ci-build-risk.mjs >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"

      # Do NOT re-add a `.next` cache to soften this: tried 2026-08-29, measured from both
      # directions, 37KB cache and 148s warm against 143s cold. The note on the deleted cache
      # step above records the evidence.
      # 🔴 THE BUILD RAN THE RUNNER OUT OF MEMORY, AND THE ONLY SIGN WAS "The operation was canceled".
      # Measured 23 Oct 2026: this runner is 2 CPUs, 7.9 GB RAM and 3 GB swap, and a one-process
      # `next build` held 6.1 GB through "Collecting page data" while that stage's worker added 1.0 GB
      # more — available memory fell to 60 MB with swap 100% full, the stage swapped for 5 minutes, and
      # on four runs that day the kernel killed it (exit 137, "Killed", "The runner has received a
      # shutdown signal"). A re-run usually passed, so it read as a flake on whatever PR it hit.
      #
      # THE FIX IS TWO PROCESSES. `--experimental-build-mode compile` compiles and exits, handing its
      # ~6.5 GB back; `generate` then collects page data and renders in a FRESH process that peaked
      # at 2.6 GB with 5.3 GB still available (same runner type, side by side, run 39886149636). It
      # also cut the build from 8.2 to 3.6 minutes. The compile itself still peaks near 6.9 GB with
      # ~2.5 GB swapped, so the step first adds 6 GB of swap as the safety net for that half.
      # Railway's Dockerfile keeps the one-process `pnpm run build` — its builder is not this runner,
      # and the standalone assembly and login smoke below prove the split output serves.
      - name: Build
        if: github.event_name != 'pull_request' || steps.buildrisk.outputs.build == 'true'
        run: |
          sudo fallocate -l 6G /mnt/phx-build-swap && sudo chmod 600 /mnt/phx-build-swap \
            && sudo mkswap /mnt/phx-build-swap >/dev/null && sudo swapon /mnt/phx-build-swap \
            || echo "::warning::extra swap could not be added; building with the runner's own 3 GB"
          pnpm exec next build --experimental-build-mode compile
          pnpm exec next build --experimental-build-mode generate

      # The ONE thing a PR could not previously answer. #2299 shipped a canvas fix that was correct
      # by inspection — right globs, matching files, green CI — and did nothing, because tracing
      # copies files and not pnpm's symlinks, so the bytes landed where nothing could require them.
      # That was only observable in a Railway boot log, i.e. after it reached production. This asks
      # the built artifact the production question directly, so the answer arrives on the PR.
      - name: Verify @napi-rs/canvas is reachable inside .next/standalone
        if: github.event_name != 'pull_request'
        run: node scripts/verify-standalone-canvas.mjs

      # 🔴 The two copies `output: "standalone"` REQUIRES, mirroring the Dockerfile exactly —
      # Dockerfile:113 `COPY /app/public ./public` and Dockerfile:122
      # `COPY /app/.next/static ./.next/static`. Next emits neither into `.next/standalone`, so the
      # server starts and then serves a page with no CSS and no client bundle. playwright.config.ts's
      # webServer runs `node server.js` from that folder in CI, which is the Dockerfile's own
      # `CMD ["node", "server.js"]` — so this step is what makes the smoke test exercise the artifact
      # production actually ships, instead of `next start`, a mode Next warns about and production has
      # never used.
      - name: Assemble the standalone runtime (mirrors the Dockerfile)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js || { echo "::error::.next/standalone/server.js is missing — the build did not emit the standalone output"; exit 1; }
          mkdir -p .next/standalone/.next
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          echo "standalone runtime assembled:"
          ls -1 .next/standalone | sed 's/^/  /'

      # 🔴 THE KEY CARRIES THE RUNNER IMAGE, and that is not cosmetic: an EXACT hit skips the
      # `install-deps` step below, so a cache saved on one Ubuntu and restored on another hands the
      # browser a system it was never given the libraries for. `ubuntu-latest` migrates to Ubuntu 26
      # from 2026-10-19 — every run since early October carries GitHub's notice saying so — and the
      # old key could not tell the two images apart. A cache whose key omits what makes it valid
      # reports a hit and poisons the step it was meant to save.
      - name: Cache Playwright browsers
        if: github.event_name != 'pull_request'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ env.ImageOS }}-

      - name: Install Playwright browsers
        if: github.event_name != 'pull_request'
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        if: github.event_name != 'pull_request' && (steps.playwright-cache.outputs.cache-hit != 'true')
        run: pnpm exec playwright install-deps chromium

      # Runs against the .next produced by the Build step above. playwright.config.ts's
      # webServer uses `pnpm run start` when CI is set, i.e. it serves that same prebuilt
      # production bundle — exactly what the old preview-smoke job did after downloading
      # it, minus the transfer.
      - name: Run Playwright login smoke test
        if: github.event_name != 'pull_request'
        run: pnpm run test:e2e:smoke
        env:
          NODE_ENV: test
          # 🔴 The TEST'S OWN navigation, matched to the readiness poll in playwright.config.ts.
          # `tests/e2e/auth.setup.ts` already reads this and falls back to `localhost`, so without it
          # the poll would succeed on 127.0.0.1 and the very next request would go back to resolving
          # `localhost` — `::1` first inside a container — and fail for the same reason one line later.
          # Identical to `localhost` on GitHub's runners, where it resolves to 127.0.0.1 anyway.
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          # This test logs in as the hardcoded CI_SMOKE_LOGIN_ID account ("a-12", see
          # src/lib/auth/ci-smoke-login.ts). PHOENIX_CI_SMOKE_LOGIN mode deliberately skips
          # creating an app_sessions row, but SessionSecurityGuard still mounts for real on
          # the landed page and heartbeats that orphaned session — which correctly logs a
          # "Session rejected: app session not found" audit row wherever these Supabase
          # credentials point. Pointed at the isolated STAGING project (not production) so
          # this expected CI noise never lands in the live production audit trail (it used to
          # — see memory/ci-smoke-login-prod-audit-noise.md). URL and anon key are
          # public/non-secret (RLS-protected), mirroring the value already committed in
          # the deleted deploy-cloud-run-staging.yml; only the service-role key is a real secret.
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpZndtbmR1bm1seGpoeWp1Z3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzQxMzEsImV4cCI6MjA5OTM1MDEzMX0.2bWjOI1gH67H8Fj1wr2XheQjlDhM5pOQ6xPD8YLd5lc" # gitleaks:allow (public anon key, RLS-protected -- see comment above)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PHOENIX_AUTH_SECRET: ${{ secrets.PHOENIX_AUTH_SECRET || 'ci-only-phoenix-auth-secret-for-playwright-session-signing' }}
          PHOENIX_SKIP_SUPABASE_AUTH_BRIDGE: "true"
          # 🔴 BOTH lines switch the smoke login on, and neither works alone: isCiSmokeLoginEnabled()
          # (src/lib/auth/ci-smoke-login.ts) needs APP_ENV to be exactly "ci" AND the flag. No real
          # deployment carries APP_ENV=ci, so a stray PHOENIX_CI_SMOKE_LOGIN can never open the
          # published a-12 password there. Side effect, intended: isProductionRuntime() is false for
          # this run, so the production-only heartbeats, drift checks and Sentry stay off.
          APP_ENV: ci
          PHOENIX_CI_SMOKE_LOGIN: "true"

      # Best-effort: feed the /admin/synthetic-journeys dashboard from CI. This runs
      # `pnpm run synthetic:save-report` (scripts/synthetic-save-report.ts →
      # ingestSyntheticJourneyReport), which writes a run row directly to Supabase using
      # the service-role key already provided to this job. It is a deliberate NO-OP unless
      # a report exists at tests/synthetic/report/latest.json — the login smoke test above
      # does NOT produce one; only a full synthetic run (`pnpm run synthetic:test` against a
      # deployed target) does. TO ACTIVATE real ingestion: (1) add a repo secret
      # SYNTHETIC_BASE_URL pointing at the environment to probe, and (2) add a step/job that
      # runs `pnpm run synthetic:test` to generate the report BEFORE this step. Kept
      # continue-on-error + guarded so a missing report or missing creds can never fail CI.
      - name: Ingest synthetic-journey report (best-effort, never fails CI)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional/not-yet-created secret; empty is fine (script defaults baseUrl to "unknown").
          SYNTHETIC_BASE_URL: ${{ secrets.SYNTHETIC_BASE_URL }}
        run: |
          if [ ! -f tests/synthetic/report/latest.json ]; then
            echo "No synthetic report at tests/synthetic/report/latest.json — nothing to ingest, skipping."
            exit 0
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "Supabase service credentials not configured — skipping synthetic ingest."
            exit 0
          fi
          echo "Ingesting synthetic-journey report into Supabase..."
          pnpm run synthetic:save-report

      - name: Upload Playwright report on failure
        if: github.event_name != 'pull_request' && (failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: output/playwright-report
          retention-days: 5

      # Since 2026-11-04 this job no longer holds the production deploy (`release-gate` needs `checks`
      # only, owner's choice "Tests only"), so a red build or login smoke test on main would otherwise be a
      # red circle nobody is waiting on while the commit serves. This is the step that makes it reach him.
      # Main pushes only; a pull request's red is read on the PR. It never fails the job any further.
      - name: Tell the owner main's build or login test is red
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent - TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. Main's build or login test is red and reached nobody."
            exit 0
          fi
          TEXT=$(printf 'MAIN BUILD OR LOGIN TEST RED\nCommit %s\n\nThe build check or the sign-in test failed on main. Since 4 Nov 2026 this no longer holds the deploy, so if Railway built the commit it is probably serving now. Open the run to see which step failed.\n\n%s' "${SHA:0:9}" "$RUN_URL")
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). Main's red build reached nobody. Response: $(head -c 500 /tmp/tg-response.json 2>/dev/null)"
          fi

  # static — everything that needs a checkout and an install but no build: the check:* contracts, the
  # dependency audit, ESLint and the type gate. These used to be split between `validate` and `checks`,
  # each behind work it did not depend on. One job now means one setup, and it runs BESIDE the build and
  # the suite instead of in front of them. Nothing here is conditional on the diff: every step runs on
  # every event, which is the 2026-10-06 rule (see the header).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # READ-ONLY additions for the tree-reuse SHADOW (owner, 2026-10-14; shadow mode 2026-10-26):
    # `actions: read` lets the push run read a PR run's jobs and step names, `pull-requests: read` lets
    # it find the PR. Nothing here can write. Account: scripts/ci-tree-reuse.mjs, docs/ci-self-hosted-runner.md.
    permissions:
      contents: read
      actions: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # depth 2, for the reasons recorded on `validate`'s checkout (one spelling across the file).
          fetch-depth: 2

      # TREE-REUSE SHADOW, half one (owner, 2026-10-14, cost cuts). A PR run writes down the tree it is
      # about to test, in the NAME of the next step: a step name is readable from the jobs API with
      # `actions: read` alone. Nothing reads it for any decision; see scripts/ci-tree-reuse.mjs.
      - name: Compute the tree this run tests
        id: tree
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Tested tree ${{ steps.tree.outputs.sha }}
        if: github.event_name == 'pull_request' && steps.tree.outputs.sha != ''
        continue-on-error: true
        run: echo "recorded"

      # corepack must be enabled BEFORE setup-node runs — see the note in `validate`.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # The pnpm store is restored below and saved only by `static` on a push to main (see `validate`).
          package-manager-cache: false

      # 🔴 THE PNPM STORE IS RESTORED EVERYWHERE AND SAVED BY A PUSH TO MAIN ONLY (owner, 2026-10-26). This job is the one saver.
      # setup-node's own `cache: pnpm` saved from every PR run too, into a scope only that PR can read
      # (refs/pull/N/merge): ~350 MB an entry that nothing else reuses, crowding main's entries out of the
      # 10 GB repository cache. The key names everything that makes a store valid — OS, architecture, Node
      # major, the exact pnpm version, a format version and the lockfile — and has NO restore prefix, so a
      # run restores an exact match or nothing, and a store never accumulates old packages. Anything this
      # step cannot read keys the cache to this run alone (a miss), never to a guess.
      # Pinned by tests/ci-cache-main-only.test.ts.
      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store="$(pnpm store path 2>/dev/null | tail -n 1 || true)"
          pnpm_version="$(pnpm --version 2>/dev/null || true)"
          node_major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || true)"
          if [[ "${store}" == /* && "${pnpm_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${node_major}" =~ ^[0-9]+$ ]]; then
            echo "path=${store}" >> "$GITHUB_OUTPUT"
            echo "prefix=pnpm-store-v1-${RUNNER_OS}-${RUNNER_ARCH}-node${node_major}-pnpm${pnpm_version}" >> "$GITHUB_OUTPUT"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read the pnpm store (store '${store}', pnpm '${pnpm_version}', node '${node_major}'); the pnpm cache is keyed to this run alone"
            echo "path=${RUNNER_TEMP}/pnpm-store-unverified" >> "$GITHUB_OUTPUT"
            echo "prefix=pnpm-store-v1-unverified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.prefix }}-${{ hashFiles('pnpm-lock.yaml') }}

      # 🔴 THE ESLINT CACHE IS ONLY VALID UNDER THE EXACT NODE RUNTIME THAT WROTE IT (2026-10-23). ESLint
      # stamps every cache entry with a fingerprint of its own version, `process.version` and the config
      # (eslint/lib/cli-engine/lint-result-cache.js, hashOfConfigFor), so an entry written under Node
      # v24.22.0 is discarded whole under v24.21.0. `CI_NODE_VERSION: "24"` floats to whichever 24.x the
      # runner image carries, and GitHub serves two images at once during a rollout: measured 22 Oct, every
      # one of 31 runs that restored a cache written under another patch re-linted all ~6,600 files
      # (184-372 s) and every one of 59 same-patch, same-lockfile restores stayed warm (3-13 s). So the
      # key and its restore prefix below carry THIS exact runtime. It is read from `process.version`, the
      # very value ESLint hashes, not from setup-node's `node-version` output, which is an empty string
      # whenever its own `node --version` call fails. An unreadable or malformed version keys the cache to
      # this run alone: lint runs cold and correct, and it can never restore across runtimes or fail CI.
      # Pinned by tests/ci-eslint-cache-node-runtime.test.ts.
      - name: Read the exact Node runtime for the ESLint cache key
        id: node-runtime
        run: |
          version="$(node -p 'process.version' 2>/dev/null || true)"
          if [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Node runtime for the ESLint cache key: ${version}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read an exact Node version (got '${version}'); the ESLint cache is keyed to this run alone and lint runs cold"
            echo "version=unverified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The ONE pnpm store save (owner, 2026-10-26): a push to main, a verified key, and no exact hit. Only
      # `static` saves, so three jobs never race to write one key, and `static` is off the critical path.
      - name: Save the pnpm store
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.verified == 'true' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}

      - name: Check routes
        run: pnpm run check:routes

      - name: Check migrations
        run: pnpm run check:migrations

      - name: Check no snapshot tables land in the anon-readable public schema
        run: pnpm run check:sql-backups

      # Runs as its own process, NOT inside `pnpm run test`. The aggregated runner
      # shares one process across 500+ files and getSupabaseAdmin() memoizes its
      # client, so a suite that successfully constructs one poisons every later
      # test (PR #1596 took `validate` from ~3m30s to 20m17s, twice). Here the
      # client dies with the process and cannot leak.
      - name: Check the deductions write contract (what reaches the wire)
        run: pnpm run check:deductions-write-contract

      - name: Check no stale Vercel domains/deps in shipped source
        run: pnpm run check:no-stale-domains

      # 🔴 THE ONLY CI COVERAGE A DOCKERFILE GETS, AND IT IS DELIBERATELY IN `static` (WHICH NEVER SKIPS)
      # RATHER THAN BEHIND THE BUILD. `validate`'s Build is gated off most pull requests on purpose (see
      # tests/ci-pr-skips-build-and-smoke.test.ts), and the container image is built only by Railway
      # AFTER the merge — so before this step a Dockerfile typo or an undeclared $VAR reached
      # production on a commit whose required checks were green, surfacing as a failed deploy, which
      # AGENTS.md §2.3 calls the hardest failure here to notice.
      #
      # Milliseconds, no docker daemon, no build context. It does NOT replace the build; it catches
      # the four things that break one. Added 2026-10-01 after #4981 removed a dead build ARG and
      # proving that safe took a hand-rolled audit nothing in the repo could do.
      - name: Check both Dockerfiles parse and declare every variable they use
        run: pnpm run check:dockerfile

      # 🔴 THE MCP READER'S OWN SECURITY ASSERTION, ON EVERY PR AND EVERY PUSH — BECAUSE ITS OWN
      # WORKFLOW IS NOT. `.github/workflows/phoenix-mcp.yml` triggers on nine paths, and the reader's
      # real import graph is most of `src/lib/`, so a change anywhere outside those nine breaks the
      # bundle silently: on 23 Oct 2026 `origin/main` itself was red there, broken by #6297 on a path
      # that workflow never watches, and `mcp-security` is not one of `main`'s required checks, so
      # nothing blocked for days. `build.mjs`'s assertion ("Administrative Phoenix IO survived
      # bundling") is what keeps the service-role key and the PostgREST URL out of a bundle that is
      # supposed to reach the database through a read-only role and nothing else — it belongs in a
      # check that cannot be skipped and that `checks` stands for.
      #
      # ~15 seconds, and deliberately NOT the whole `npm test`: the cold typecheck, the isolated
      # PostgreSQL fixture and the dependency audit stay on phoenix-mcp.yml, where their cost is paid
      # only when the MCP itself changes. This step is the bundle's tree-shaking contract alone.
      # Its own lockfile and node_modules, so it cannot disturb the pnpm install above.
      - name: Check no administrative Phoenix IO survives the MCP bundle
        working-directory: infra/phoenix-mcp
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node build.mjs

      - name: Dependency audit (fail on high+ vulnerabilities)
        # GHSA-mh99-v99m-4gvg is ignored via pnpm-workspace.yaml's auditConfig — see the
        # comment there for why (forcing a fix broke eslint; the app's real exposure isn't
        # exploitable).
        #
        # Runs the SAME `pnpm audit --audit-level=high --prod`; the wrapper only tells an npm
        # outage apart from a real advisory. A bare audit exits non-zero for both, and an outage
        # takes the whole required check red — twice on 2026-09-04, once on `main` itself. A genuine
        # high or critical finding still fails the build. See scripts/ci-dependency-audit.mjs.
        run: node scripts/ci-dependency-audit.mjs

      # 🔴 THE GATE ABOVE IS BLIND THREE WAYS, AND THIS STEP IS THE SECOND OPINION. `pnpm audit`
      # reads npm's feed, which LAGS: on 2026-09-30 it reported
      # `{"info":0,"low":0,"moderate":0,"high":0,"critical":0}` at the same moment OSV reported a HIGH
      # against `@grpc/grpc-js@1.14.4` (GHSA-m9gg-hp2v-232j, `getAuthContext` returning unauthorized
      # certificates as authorized). `--prod` also hides the dev graph and `--audit-level=high` hides
      # everything below high — pnpm-workspace.yaml records three advisories that slipped through for
      # exactly that reason, each noting "Dependabot alone saw it".
      #
      # DELIBERATELY NON-BLOCKING, for now. Two advisory feeds will sometimes disagree, and `main` is
      # production's own branch: a false positive here would freeze deploys, which is the very outage
      # this step exists to shorten. So it reports and `pnpm audit` gates. Promote it to blocking only
      # after watching the two agree. `continue-on-error` also absorbs an OSV outage, on the same
      # reasoning as the audit wrapper's bounded fail-open.
      #
      # 🔴 AND IT NEEDS ITS OWN TIMEOUT, WHICH `continue-on-error` DOES NOT GIVE IT. The script
      # fetches advisory detail one package at a time with a 30s ceiling EACH and no cap on how many
      # it will ask for, so a slow or half-down advisory API does not fail this step — it hangs it,
      # and `continue-on-error` cannot absorb a step that never ends. What ends instead is the JOB,
      # on `timeout-minutes: 20`, which is a FAILED required check on `main` and therefore a withheld
      # production deploy (§2.3) caused by a step that is explicitly not a gate. Three minutes is
      # ~6x its measured runtime (2026-10-06, run 37522986755: 2.2s for 1,099 packages).
      - name: Vulnerability scan, whole graph, all severities (reports, does not gate)
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/vuln-scan.mjs

      # STRATEGY MATTERS MORE THAN THE KEY HERE, and it is not obvious from the logs.
      # eslint's --cache defaults to --cache-strategy metadata, which decides a file is unchanged
      # by comparing size + MTIME. actions/checkout writes every file fresh on every run, so every
      # mtime is the checkout time and eslint invalidates the whole restored cache — measured
      # 2026-08-29: this step logged "Cache restored successfully" (139,373 bytes, primary-key hit)
      # and the lint itself still took 112s, exactly as if no cache existed. package.json therefore
      # passes --cache-strategy content, which hashes contents instead. Do not drop that flag; the
      # cache is inert without it and nothing in CI reports the difference.
      # The key carries the strategy name for the same reason: a metadata-format .eslintcache is
      # unreadable to a content-strategy run, so without the discriminator the first runs after this
      # change would download and extract a cache they must then throw away, and still log
      # "Cache restored successfully". Renaming the key retires the old entries by letting them expire.
      # 🔴 .eslintcache is a JSON object keyed by ABSOLUTE file path, so a cache is only valid in the
      # workspace that wrote it. Every run is on a GitHub-hosted runner now (/home/runner/work/<repo>),
      # which is one lineage; the key carried the runner name too until 2026-10-19, to keep a self-hosted
      # box's cache apart from the hosted one (a cache restored across the two matched not one path and
      # re-linted all 6,597 files while logging a hit). A hosted run's key string is unchanged by
      # dropping that, so the existing entries keep hitting.
      # The exact Node runtime sits in BOTH the key and the restore prefix (2026-10-23), so a run only
      # ever restores a cache written under its own runtime — see `Read the exact Node runtime` above.
      # Restored everywhere, saved by a push to main only (owner, 2026-10-26) — `Save ESLint cache` below.
      - name: Restore ESLint cache
        id: eslint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslintcache-hosted-content-${{ steps.node-runtime.outputs.version }}-${{ hashFiles('app/**', 'src/**', 'tests/**', 'scripts/**', 'eslint.config.mjs', 'pnpm-lock.yaml') }}
          restore-keys: eslintcache-hosted-content-${{ steps.node-runtime.outputs.version }}-

      - name: Lint
        run: pnpm run lint

      - name: Save ESLint cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.eslint-cache.outputs.cache-hit != 'true' && !startsWith(steps.node-runtime.outputs.version, 'unverified-')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: ${{ steps.eslint-cache.outputs.cache-primary-key }}

      # TYPECHECK — folded in from the former standalone `typecheck` job (2026-09-27). It shared a
      # byte-identical preamble with `lint` and `test` (checkout, detect, corepack, setup-node,
      # install) and nothing else, so standing alone it paid ~29s of setup twice over for no gate.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      # 🔴 THIS IS TYPESCRIPT 7, THE NATIVE COMPILER, SINCE 2026-10-06 — AND NOTHING HERE SAYS SO BY
      # NAME. `pnpm run typecheck` runs `node_modules/.bin/tsc`, which pnpm links to the HIGHER of the
      # two installed versions: `typescript@5` (still loaded by typescript-eslint, by Next and by the
      # editor) and `typescript-native`, the `npm:typescript@7` alias in package.json that IS the
      # gate. So the version is decided by a dependency, not by this step, and losing the alias would
      # silently restore the ~180s compiler with every command and every doc still reading correctly.
      # The one mechanical tell is `--checkers`, which TypeScript 5 refuses outright — that is why the
      # script passes it, and tests/typecheck-native-compiler.test.ts asserts both callers still do.
      #
      # MEASURED on this tree, same tsconfig, both cold: tsc 5.9.3 276s / 5.8 GB peak against the
      # native compiler at 28s on 4 vCPU and 45s on 2. `--checkers 1` trades ~20s for a 5.06 GB peak,
      # BELOW what TypeScript 5 already needed (it was sized for a 7.7 GB box that is now retired, and
      # fits a 2-vCPU / 7 GB hosted runner with room). It was adopted on evidence rather than on the
      # speed: every one of the 19 typecheck errors that failed CI across the 14 most recent red PRs
      # is reported by 7 on the same commit (docs/ci-self-hosted-runner.md).
      #
      # NO `NODE_OPTIONS` ANY MORE, DELIBERATELY. `--max-old-space-size=6144` was here because tsc 5
      # is a node program that could OOM below node's default ceiling before reporting any diagnostic.
      # The native compiler is a Go binary; a node heap flag does not reach it, and leaving one here
      # would read as a memory guarantee that nothing honours.
      #
      # (The self-hosted box's typecheck lock was here until 2026-10-19; the box is retired.)
      - name: Typecheck
        run: pnpm run typecheck

      # TREE-REUSE SHADOW, half two (owner: dry run 2026-10-14, shadow mode 2026-10-26). On a push, decide
      # whether the PR's own run already covered this exact tree, in one of five classes (only
      # ELIGIBLE_FOR_REUSE says yes, and only when every check passed; anything uncertain says no), and
      # say the class in the NEXT step's name so `node scripts/ci-tree-reuse.mjs --report` can count it.
      # The full record goes to the log and the job summary. 🔴 OBSERVATIONAL ONLY: it never skips,
      # shortens or gates anything, it cannot fail the job, and no `if:` in this file may read its
      # output. Turning it into a skip is a separate decision that is the owner's alone.
      - name: Tree reuse shadow (log only)
        id: reuse
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-tree-reuse.mjs --dry-run

      - name: Tree reuse shadow ${{ steps.reuse.outputs.verdict }} ~${{ steps.reuse.outputs.minutes }} min
        if: github.event_name == 'push' && steps.reuse.outputs.verdict != ''
        continue-on-error: true
        run: echo "recorded"

  # unit — the unit suite, as TWO jobs of TWO shards each (three from 2026-10-19, two since 2026-10-23).
  # One runner has two CPUs, so the old single-job run (`test:sharded`, two shards) cost 170-320 s on
  # every event. Three jobs billed ~9.8 minutes a run, because each re-pays ~70 s of setup and rounds up
  # to a whole minute; two bill ~7.4 and, with the slow tests dealt by estimated time
  # (tests/shard-deal.ts) instead of round-robin, the slower job finishes sooner than three did (~190 s
  # against ~220 s at the median), because the slowest test (the unknown-flag one, ~115 s, halved the same day) no longer stacks onto a full share.
  #
  # 🔴 EVERY TEST RUNS EXACTLY ONCE, AND THE PROOF IS THE POINT. Each part runs global shards
  # `(part-1)*2+1 .. part*2` of `parts*2` (every shard computes the same deal from the same file, so any
  # total partitions the suite), checks its own shards locally and writes a record of what it ran. `checks`
  # downloads the records and REFUSES unless the parts are exactly 1..N of one total and their `ran`
  # counts add up to the `seen` count every shard reports (scripts/ci-unit-coverage.mjs). A leg that is
  # missing, a wrong divisor or a part handed the same index twice is then a named failure rather than a
  # smaller suite reporting success — the 2026-09-17 shape (#3950), arriving from a new direction.
  #
  # NOT a required check by name: `checks` is, and it needs this job, so a red or missing part is red there.
  # `test` is a RETIRED check name (tests/required-check-names.test.ts) and must never come back as a job.
  # The unit suite runs on EVERY event, in this job and nowhere else (tests/ci-suite-placement.test.ts).
  unit:
    runs-on: ubuntu-latest
    # 12, not 20 (31 Oct 2026): a part takes ~3.3 min, and a test that hangs is stopped and named by the
    # sharded runner's own hang watch within ~3 min (docs/testing.md, "The hang watch"). This is only the
    # backstop behind it, so a hang the watch cannot see costs 12 minutes of a pull request, not 20.
    timeout-minutes: 12
    # This job never writes a cache on any event (owner, 2026-10-26): the Actions service itself refuses a
    # save from it. Pinned by tests/ci-cache-main-only.test.ts.
    cache-mode: read
    strategy:
      # Every part reports whatever the others did: `checks` judges the whole set, and one red part must
      # not cancel a second red one out of view.
      fail-fast: false
      matrix:
        part: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # depth 2 for the same reason as the other jobs: one spelling across the file.
          fetch-depth: 2

      # corepack must be enabled BEFORE setup-node runs — see the note in `validate`.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # The pnpm store is restored below and saved only by `static` on a push to main (see `validate`).
          package-manager-cache: false

      # 🔴 THE PNPM STORE IS RESTORED EVERYWHERE AND SAVED BY A PUSH TO MAIN ONLY (owner, 2026-10-26). This job only restores.
      # setup-node's own `cache: pnpm` saved from every PR run too, into a scope only that PR can read
      # (refs/pull/N/merge): ~350 MB an entry that nothing else reuses, crowding main's entries out of the
      # 10 GB repository cache. The key names everything that makes a store valid — OS, architecture, Node
      # major, the exact pnpm version, a format version and the lockfile — and has NO restore prefix, so a
      # run restores an exact match or nothing, and a store never accumulates old packages. Anything this
      # step cannot read keys the cache to this run alone (a miss), never to a guess.
      # Pinned by tests/ci-cache-main-only.test.ts.
      - name: Locate the pnpm store
        id: pnpm-store
        run: |
          store="$(pnpm store path 2>/dev/null | tail -n 1 || true)"
          pnpm_version="$(pnpm --version 2>/dev/null || true)"
          node_major="$(node -p 'process.versions.node.split(".")[0]' 2>/dev/null || true)"
          if [[ "${store}" == /* && "${pnpm_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${node_major}" =~ ^[0-9]+$ ]]; then
            echo "path=${store}" >> "$GITHUB_OUTPUT"
            echo "prefix=pnpm-store-v1-${RUNNER_OS}-${RUNNER_ARCH}-node${node_major}-pnpm${pnpm_version}" >> "$GITHUB_OUTPUT"
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::could not read the pnpm store (store '${store}', pnpm '${pnpm_version}', node '${node_major}'); the pnpm cache is keyed to this run alone"
            echo "path=${RUNNER_TEMP}/pnpm-store-unverified" >> "$GITHUB_OUTPUT"
            echo "prefix=pnpm-store-v1-unverified-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store.outputs.prefix }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No typegen and no build in front of it: tests/run-tests.ts is run straight by node with
      # --experimental-strip-types. PHX_TEST_PART picks this job's slice of the global shard space;
      # PHX_TEST_SHARDS is explicit (2) rather than read from the CPU count, because every part must
      # agree on the global total or the coverage gate in `checks` refuses the run.
      - name: Test
        env:
          PHX_TEST_PART: ${{ matrix.part }}/${{ strategy.job-total }}
          PHX_TEST_SHARDS: "2"
          PHX_TEST_RESULT_FILE: ${{ runner.temp }}/unit-coverage-${{ matrix.part }}.json
        run: pnpm run test:sharded

      - name: Upload this part's coverage record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-coverage-${{ matrix.part }}
          path: ${{ runner.temp }}/unit-coverage-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 1

  # checks — the gate for `static` and `unit`. It does no checking of its own: it reports ONE required
  # status that is green only when both jobs it stands for finished with the word `success` (an
  # allow-list: `failure`, `cancelled`, `skipped` and anything unexpected all read red) and the unit
  # suite's coverage records (one per `unit` part) add up to every test. It needs `always()`-style semantics — a job whose
  # `needs` failed is SKIPPED by default, and a skipped job reports no status, which on a required check
  # blocks the PR for ever instead of failing it — but `!cancelled()`, not `always()`: a superseded
  # pull request run is cancelled on purpose, and must not spend a runner finishing a verdict nobody reads.
  #
  # IT USED TO BE THE LINT + TYPE GATE + (ON `main`) UNIT SUITE JOB, ALL IN SERIES. That work is `static`
  # and `unit` now, running beside `validate`; the check NAME is unchanged, so branch protection needed no
  # change and no open PR sat waiting for a status that never arrives.
  #
  # 🔴 THE REQUIRED CHECK NAMES CHANGED, AND THE SWAP IS DONE. Branch protection was repointed
  # on 2026-09-27 at the owner's instruction, in the same window #4527 merged: `lint`, `typecheck`
  # and `test` no longer exist as check names — they are the steps below.
  #
  # 🔴 AND AGAIN ON 2026-09-29: the required contexts are now just `validate` and `checks`.
  # `mobile` and `secret-scan` were dropped from protection — both still run and still report,
  # neither blocks a merge. Verified live against branches/main/protection/required_status_checks;
  # `node scripts/check-required-checks.mjs` re-checks it and is the only thing that will catch the
  # sixth rotation. Do not restate the list anywhere without running that script first.
  #
  # WHAT IT COST, so the next rename is done differently: nineteen places in the repo went on
  # saying "6 required checks" and naming the three dead ones, including .claude/skills/ship and
  # .claude/skills/verify-context — the two files a session follows in order to merge. A session
  # followed `ship`, counted to six, and sat waiting on three checks that can never report again.
  # A required check that never reports blocks every PR forever, and a session told to count to a
  # number that no longer exists blocks itself just as completely. So if a name here ever changes
  # again: repoint protection in the same window, and fix every doc that states the list in the
  # same PR. tests/required-check-names.test.ts now fails if this job's name and the docs drift
  # apart, which is the only part of that a machine can hold.
  checks:
    needs: [static, unit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Every job this check stands for finished with success
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          set -u
          failed=0
          for pair in "static=${STATIC_RESULT}" "unit=${UNIT_RESULT}"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            if [ "${result}" = "success" ]; then
              echo "${job}: success"
            else
              echo "::error::${job} finished '${result}', not 'success' — this check stays red until it does."
              failed=1
            fi
          done
          exit "${failed}"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download the unit suite's coverage records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unit-coverage-*
          path: unit-coverage
          merge-multiple: true

      - name: Prove the unit suite ran every test exactly once
        run: node scripts/ci-unit-coverage.mjs unit-coverage

  # release-gate — the row that lets a container Railway has ALREADY BUILT take traffic (added 2026-10-19).
  #
  # WHY. Railway's "Wait for CI" held every merge's build until the checks finished, so the build (4 to 10
  # minutes, and its speed is Railway's shared builder's) started only after CI: a merge on 2026-10-19 took 16
  # minutes to go live. With Wait for CI off, Railway builds the moment a commit lands, side by side with the
  # jobs above, and /api/readyz — the healthcheck Railway asks of a NEW container before it moves traffic —
  # answers 503 until THIS job has written a row for that container's commit. The old version keeps serving
  # until it does, and a red check means the row is never written. Nothing is skipped; the build merely no
  # longer waits for the checks to start. Account: docs/deployment.md, "The release gate".
  #
  # `needs: [checks]` — LINT, TYPECHECK AND THE WHOLE SUITE, AND NOT THE BUILD (owner, 2026-11-04, asked
  # "what should the production gate wait for?" and chose "Tests only"). `checks` holds `static` and `unit`
  # and refuses unless every test ran exactly once. `validate` (the CI build, the standalone assembly and
  # the login smoke test) still runs on every push to main and Telegrams the owner when it goes red — the
  # `Tell the owner main's build or login test is red` step — but it no longer holds the deploy. Why: Railway
  # builds the same commit itself in ~5 min (measured 281-602 s over 8 merges, 3-4 Nov 2026), while this
  # job's build took 6-11 min (validate 369-673 s), so the gate waited 0-6.5 min, usually 3-4, for a second
  # copy of a build Railway had already finished. A commit that does not build still never ships: Railway's
  # own build fails and the old version keeps serving. What is given up is the login smoke test holding the
  # deploy — a commit that builds but breaks sign-in now goes live and is reported, not withheld.
  # Never put `validate` back in `needs` without his word. `mobile` is left out on purpose: it reports and
  # never gated a merge, so it must not gate a deploy. tests/release-gate.test.ts pins this, the event and
  # the branch.
  #
  # MAIN PUSH ONLY. A pull request has no production container to release, and a workflow_dispatch run on
  # main must not mint a row for a commit whose own push run did not.
  #
  # FAILS LOUD, NEVER SKIPS: a missing secret, an unreachable database or a row that does not read back
  # after the write is a red job. Red here means "do not ship this commit", which is exactly what the
  # container's probe also says when the row is absent — the old version keeps serving and the next green
  # merge carries the change. No `continue-on-error`, unlike the dashboard saves elsewhere in this repo,
  # because those are reporting gaps and this is a gate.
  #
  # LEAST PRIVILEGE (technical audit P6-02, owner's choice 2026-10-23). It connects as the database login
  # `release_gate_writer` (secret RELEASE_GATE_DATABASE_URL, the session pooler), which may read and add rows
  # in public.release_gates and nothing else — it cannot update or delete one, and every other table refuses it
  # (supabase/migrations/20261023093100_release_gate_writer_login.sql). It used to hold the full production
  # service-role key to write this one row. psql ships on GitHub's ubuntu image; the install line only runs if
  # an image ever drops it. The sha and run id are validated before use and passed as psql variables.
  release-gate:
    needs: [checks]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Record that every required check passed on this commit
        env:
          RELEASE_GATE_DATABASE_URL: ${{ secrets.RELEASE_GATE_DATABASE_URL }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -u
          if [ -z "${RELEASE_GATE_DATABASE_URL}" ]; then
            echo "::error::RELEASE_GATE_DATABASE_URL is not set, so the release gate cannot be written and this commit will not go live."
            exit 1
          fi
          if ! printf '%s' "${RELEASE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::the commit is not a full 40-character sha: ${RELEASE_SHA}"
            exit 1
          fi
          if ! printf '%s' "${RELEASE_RUN_ID}" | grep -Eq '^[0-9]+$'; then
            echo "::error::the run id is not a number: ${RELEASE_RUN_ID}"
            exit 1
          fi
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }

          written=0
          for attempt in 1 2 3; do
            if psql "${RELEASE_GATE_DATABASE_URL}" -X -q -v ON_ERROR_STOP=1 -v sha="${RELEASE_SHA}" -v run_id="${RELEASE_RUN_ID}" <<'SQL'
          set statement_timeout = '20s';
          insert into public.release_gates (sha, workflow_run_id)
          values (:'sha', :'run_id')
          on conflict (sha) do nothing;
          SQL
            then written=1; break
            fi
            echo "write attempt ${attempt} failed"
            sleep $((attempt * 3))
          done
          if [ "${written}" != "1" ]; then
            echo "::error::the release gate could not be written after 3 attempts, so this commit will not go live."
            exit 1
          fi

          # The write is not the proof; the row reading back is.
          seen="$(psql "${RELEASE_GATE_DATABASE_URL}" -X -q -At -v ON_ERROR_STOP=1 -v sha="${RELEASE_SHA}" <<'SQL' || true
          select sha from public.release_gates where sha = :'sha';
          SQL
          )"
          case "${seen}" in
            *"${RELEASE_SHA}"*) echo "release gate recorded for ${RELEASE_SHA}" ;;
            *)
              echo "::error::the row did not read back after the write, so this commit will not go live."
              exit 1
              ;;
          esac

  # THE ONE JOB THAT LOOKS AT mobile/ (added 2026-09-18). Nothing else in this file does, and that
  # is structural rather than an oversight: the root project is pnpm, `mobile/` is npm with its own
  # package-lock.json, and it is excluded from the root tsconfig.json and eslint.config.mjs because
  # React Native's JSX and DOM-free type set are incompatible with the Next.js project's. So every
  # gate above walks straight past it.
  #
  # Two defects reached `main` through that gap inside two days. #3962 committed a lockfile that
  # strict peer resolution cannot produce — react-dom@19.3.0 wants react@^19.3.0, the app pins
  # react@19.2.3, so `npm install` could only have been run with --legacy-peer-deps or --force.
  # #3965 then regenerated the lockfile with that flag, which strips every peer-installed package
  # out of it: `npm ci` failed outright (EUSAGE, 29 packages "missing from lock file") while a
  # plain `npm install` silently rewrote 196 lines of lockfile on every machine that ran it.
  # Neither was visible to anything here. #3970 fixed both; this job is what keeps them fixed.
  #
  # THE JOB ALWAYS RUNS AND ALWAYS REPORTS, for the reason spelled out in `validate` — a skipped
  # job reports no status, and a required check with no status blocks a PR forever. Only the
  # expensive steps are conditional. That is what made this name safe to add to branch
  # protection's required checks, which happened on 2026-09-18 — and it still costs seconds on
  # a PR that never touches mobile/.
  #
  # The detect step FAILS TOWARDS DOING THE WORK: every path it cannot resolve answers `true`.
  # It fails TOWARDS doing the work: every path it cannot resolve answers `true`. (The docs-only
  # classifier that used to sit in `validate` and `checks` failed the same way, towards running
  # more — it was removed on 2026-10-06; see the header for why.)
  #
  # DELIBERATELY NOT in `full-e2e`'s `needs` list: that suite drives the web app through
  # Playwright and has no mobile surface, so a broken mobile lockfile should not be able to block
  # a manual E2E run.
  # 🔴 NOT ON A PULL REQUEST SINCE 2026-09-29. The job detected whether `mobile/` changed and
  # then exited — 11 seconds of work that billed a FULL minute on every one of ~280 runs a day,
  # because GitHub rounds each job up. It could not simply be skipped at job level while it was a
  # REQUIRED check: a required check that never reports leaves the PR on "Expected — waiting for
  # status" for ever. So it was dropped from the required checks in the same change, and now runs
  # on `main`, a dispatch and a schedule only.
  #
  # THE TRADE-OFF is the same one the build took that day: a mobile typecheck break surfaces on
  # `main` rather than on the PR. Production is untouched either way — the Expo app ships through
  # EAS, not through this repo's deploy — so the cost is a fix-forward, not an outage.
  mobile:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # depth 2, for the same reason as the jobs above: on a pull_request GitHub checks out
          # the merge commit, so HEAD^1..HEAD is exactly this PR's changed files.
          fetch-depth: 2

      - name: Detect whether this change touches mobile/
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          answer() { echo "mobile_changed=$1" >> "$GITHUB_OUTPUT"; echo "mobile_changed=$1 ($2)"; exit 0; }

          [ "$EVENT_NAME" = "pull_request" ] || answer true "not a pull_request - always check mobile/"
          git rev-parse --verify HEAD^2 >/dev/null 2>&1 || answer true "HEAD is not a merge commit; cannot identify the PR's files"

          files="$(git diff --name-only HEAD^1 HEAD)" || answer true "git diff failed"
          [ -n "$files" ] || answer true "no files resolved; refusing to assume mobile/ is untouched"

          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          if echo "$files" | grep -qE '^mobile/'; then
            answer true "mobile/ changed"
          fi
          answer false "nothing under mobile/ changed"

      # npm, NOT pnpm, and no corepack step: mobile/ keeps its own lockfile because React Native's
      # Metro bundler resolves modules by walking node_modules directly and pnpm's symlinked store
      # breaks that at runtime. mobile/README.md carries the account. Cache the npm store keyed on
      # that lockfile, not the root pnpm-lock.yaml.
      - name: Set up Node.js
        if: steps.detect.outputs.mobile_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # `npm ci`, not `npm install`, and with NO FLAGS — that is the whole assertion. It installs
      # the lockfile exactly and exits 1 when package.json and package-lock.json disagree, which is
      # both defects above in one command. If this step ever needs --legacy-peer-deps or --force to
      # pass, the lockfile is wrong: fix the lockfile, never this line.
      - name: Install mobile dependencies from the lockfile
        if: steps.detect.outputs.mobile_changed == 'true'
        working-directory: mobile
        run: npm ci

      - name: Typecheck the mobile app
        if: steps.detect.outputs.mobile_changed == 'true'
        working-directory: mobile
        run: npm run typecheck

  full-e2e:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_e2e == 'true'
    runs-on: ubuntu-latest
    # `test` joined this list when it was split out of `validate` (2026-09-17) — dropping it
    # here would have quietly stopped the full E2E suite waiting on the unit tests.
    # `lint`, `typecheck` and `test` merged into `checks` on 2026-09-27 — a `needs:` naming a
    # job that no longer exists is a workflow-level error, not a skipped dependency.
    needs: [validate, checks]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # corepack must be enabled BEFORE setup-node runs: with `cache: pnpm`,
      # setup-node invokes `pnpm store path` during its own execution, and the
      # pnpm shim only exists once corepack is enabled. corepack then reads the
      # exact pnpm version from package.json's `packageManager` field.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # Caches the pnpm store (keyed on pnpm-lock.yaml), NOT node_modules —
          # pnpm's node_modules is a symlink+hardlink layout that does not
          # round-trip safely through actions/cache tar archives. Restoring the
          # store and letting `pnpm install` re-link is the supported fast path.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run full Playwright E2E suite
        run: pnpm run test:e2e -- -j 4
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PHOENIX_AUTH_SECRET: ${{ secrets.PHOENIX_AUTH_SECRET || 'ci-only-phoenix-auth-secret-for-playwright-session-signing' }}
          PLAYWRIGHT_DATA_USER_HRID: ${{ secrets.PLAYWRIGHT_DATA_USER_HRID }}
          PLAYWRIGHT_DATA_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_DATA_USER_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-full-e2e
          path: output/playwright-report
          retention-days: 5
