name: CI

# CI SPEED-UP (2026-07-30). Originally landed alongside a temporary fast-deploy window in
# deploy-cloud-run.yml. That window has since expired and its dead config was removed
# (2026-07-31) — but these CI changes are KEPT PERMANENTLY and deliberately were not
# reverted with it: they remove wasted work rather than trade away verification, so there is
# nothing to revert to. No gate is relaxed and no step is skipped; the same checks run, with
# one fewer artifact round-trip and one more parallel runner.
#
# MEASURED baseline (run 30507413475, commit 87f26e05) = 308s wall-clock:
#   validate        237s  (setup 33s, test 13s, BUILD 143s, upload artifact 40s)
#   lint-typecheck  216s  (lint 114s + typecheck 67s, serial in one job)
#   preview-smoke    68s  (starts only after validate; re-does setup 26s, downloads 11s)
# Three inefficiencies, each fixed below:
#   1. The build artifact existed ONLY to hand .next to preview-smoke. Uploading (40s) +
#      downloading (11s) + a second job's setup (26s) = ~77s of pure overhead to move a
#      directory to a machine that then rebuilt nothing. Playwright's webServer runs
#      `pnpm run start` against .next in CI, so the smoke test now runs in-place in the
#      job that produced the build. No artifact, no round-trip.
#   2. lint (114s) and typecheck (67s) were serial in one job for no reason — they share
#      nothing but node_modules. Now two parallel jobs.
# A third fix was tried and REVERTED after measurement: switching the dead .next cache to
# the documented `.next/cache` + restore-keys pattern. It restored fine and changed nothing
# (37KB cache, build 148s warm vs 143s cold) — see the note on the cache step below, which
# records the evidence so nobody re-attempts it.
#
# MEASURED RESULT: 308s -> 235s (-24%). My pre-change estimate of ~166s was WRONG; it
# assumed the cache fix would cut the 143s build, and it did not. The build is now the
# dominant remaining term. Extra cost is one more parallel runner; no gate is relaxed.

# NO `paths-ignore` ON `pull_request`, DELIBERATELY (2026-08-12). It used to skip this whole
# workflow for docs-only PRs, and ci-docs-fallback.yml existed to satisfy the required checks that
# then never reported. That pairing had a hole:
#
#   * `paths-ignore` here means "run if ANY changed file is not docs".
#   * `paths` there meant "run if ANY changed file IS docs".
#
# A PR touching both — which is most PRs that bother to document themselves — satisfied both, so
# `validate`, `lint` and `typecheck` were each reported TWICE: once by the real job, once by a stub
# that passed unconditionally in three seconds. Observed on #2041: real 4m23s/3m12s/1m50s beside
# stub 3s/5s/4s, under identical names. Both passed there, so nothing shipped unverified — but a
# required check whose name can be satisfied by a job that never looks at the code is a gate with a
# spare key under the mat, and which of the two GitHub resolves for the merge button is a race.
#
# GitHub path filters cannot express "ONLY these paths changed", which is why the split existed at
# all. So the question is answered INSIDE the workflow instead, by the `changes` job below, and the
# expensive STEPS are what get skipped rather than the jobs. Every required name is now produced by
# exactly one job, always, and a docs-only PR still costs seconds rather than four minutes.
on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      full_e2e:
        description: Run the full Playwright E2E regression suite
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# PR branches: group by ref and cancel the superseded run — pushing a fixup should not pay for
# CI on the commit it just replaced.
#
# Pushes to main: group by COMMIT and never cancel. Grouping by ref here was a real hazard, not
# just wasted signal. `deploy-cloud-run.yml`'s gate ships a commit only if THAT exact SHA's CI
# concluded `success`, so a merge landing while the previous merge's CI is still running used to
# cancel it and leave that commit permanently un-deployable. Observed 2026-07-30: #1484, #1486
# and #1487 merged ~1 minute apart and all three ended `cancelled`; only the last commit of the
# train ever went green. It stayed shippable because main is cumulative — but if a train's LAST
# CI run is the one cancelled (a manual cancel, or a merge that races the queue), the 2-hourly
# cron will never ship it, and the gate says so only in a `::notice::` nobody reads. Production
# silently stops receiving deploys until a human re-runs CI.
#
# Grouping by SHA rather than simply setting cancel-in-progress:false keeps the runs PARALLEL.
# A shared main group with cancellation disabled would serialize the train instead (~4 min per
# commit, queued), which would push merge->live latency back up — the exact thing #1480/#1483
# were cutting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_NODE_VERSION: "24"
  # corepack downloads the pinned pnpm on first use; suppress its interactive
  # confirmation prompt so it can never hang a runner.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  # Does this PR touch anything but documentation?
  #
  # FAILS TOWARD MORE CHECKING, ALWAYS. Every branch that cannot answer confidently — a push rather
  # than a PR, a head that is not a merge commit, a git command that errors, an empty file list —
  # answers `false` and the full suite runs. The costly mistake here is skipping work on a PR that
  # changed code; running lint on a typo fix costs two minutes and nothing else.
  #
  # No third-party action: this repo pins first-party `actions/*` by SHA and adding a marketplace
  # dependency to the gate that guards every merge would be a poor trade for ten lines of shell.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      # depth 2 is enough: for a pull_request, GitHub checks out the MERGE commit, whose first
      # parent is the base branch. `HEAD^1..HEAD` is therefore exactly this PR's changed files,
      # with no need to fetch the base branch separately.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Detect whether this PR is documentation only
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          answer() { echo "docs_only=$1" >> "$GITHUB_OUTPUT"; echo "docs_only=$1 ($2)"; exit 0; }

          [ "$EVENT_NAME" = "pull_request" ] || answer false "not a pull_request — always run everything"
          git rev-parse --verify HEAD^2 >/dev/null 2>&1 || answer false "HEAD is not a merge commit; cannot identify the PR's files"

          files="$(git diff --name-only HEAD^1 HEAD)" || answer false "git diff failed"
          [ -n "$files" ] || answer false "no files resolved; refusing to assume docs-only"

          echo "Changed files:"; echo "$files" | sed 's/^/  /'
          # One non-doc path is enough to need the full suite. Mirrors the old paths-ignore list.
          if echo "$files" | grep -qvE '(\.md$|^docs/|^\.github/ISSUE_TEMPLATE/|^\.github/PULL_REQUEST_TEMPLATE/)'; then
            answer false "code or config changed"
          fi
          answer true "documentation only"

  # Structural checks + unit tests + build + login smoke test, in one job. The smoke test
  # lives here (rather than in a downstream job) purely to avoid shipping .next between
  # runners — see note 1 in the header. Everything it used to verify, it still verifies.
  #
  # THE JOB ALWAYS RUNS AND ALWAYS REPORTS. `needs: changes` sequences it; it is never `if`-ed out,
  # because a skipped job reports no status and a required check with no status blocks a PR
  # forever — the exact breakage ci-docs-fallback.yml was invented to paper over. Only the
  # expensive steps below are conditional.
  validate:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # corepack must be enabled BEFORE setup-node runs: with `cache: pnpm`,
      # setup-node invokes `pnpm store path` during its own execution, and the
      # pnpm shim only exists once corepack is enabled. corepack then reads the
      # exact pnpm version from package.json's `packageManager` field.
      - name: Enable Corepack (pnpm)
        if: needs.changes.outputs.docs_only != 'true'
        run: corepack enable

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # Caches the pnpm store (keyed on pnpm-lock.yaml), NOT node_modules —
          # pnpm's node_modules is a symlink+hardlink layout that does not
          # round-trip safely through actions/cache tar archives. Restoring the
          # store and letting `pnpm install` re-link is the supported fast path.
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check routes
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run check:routes

      - name: Check migrations
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run check:migrations

      - name: Check no snapshot tables land in the anon-readable public schema
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run check:sql-backups

      # Runs as its own process, NOT inside `pnpm run test`. The aggregated runner
      # shares one process across 500+ files and getSupabaseAdmin() memoizes its
      # client, so a suite that successfully constructs one poisons every later
      # test (PR #1596 took `validate` from ~3m30s to 20m17s, twice). Here the
      # client dies with the process and cannot leak.
      - name: Check the deductions write contract (what reaches the wire)
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run check:deductions-write-contract

      - name: Check no stale Vercel domains/deps in shipped source
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run check:no-stale-domains

      - name: Dependency audit (fail on high+ vulnerabilities)
        if: needs.changes.outputs.docs_only != 'true'
        # GHSA-mh99-v99m-4gvg is ignored via pnpm-workspace.yaml's auditConfig — see the
        # comment there for why (forcing a fix broke eslint; the app's real exposure isn't
        # exploitable).
        run: pnpm audit --audit-level=high --prod

      # MEASURED DEAD END, left as-is on purpose. The obvious "fix" here is the documented
      # Next.js CI pattern: cache `.next/cache` with restore-keys instead of all of `.next`
      # under an exact key. It was tried on this branch and does NOTHING for this project —
      # run 30508669485 attempt 2 restored the key successfully and reported
      # `Cache Size: ~0 MB (37626 B)`: `.next/cache` is essentially EMPTY after `next build`
      # here (Next 16 does not populate it the way the classic webpack pattern assumes), and
      # the build was 148s warm vs 143s cold — i.e. no effect. Do not re-attempt without
      # first checking the restored cache size.
      #
      # The block below is therefore the ORIGINAL. Note it is also effectively dead, just
      # harmlessly so: the exact-match key hashes app/**+src/**, so it can only hit on a
      # re-run of an identical commit and misses on every real PR. Making the build faster
      # needs a different lever (e.g. `next build --turbopack`), which is NOT done here
      # because it would make CI's build differ from the production Docker build, weakening
      # the guarantee that a green CI reflects what actually ships.
      - name: Restore .next build cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next
          # Must include every file that can change build output, not just app/src —
          # a change to next.config.ts or proxy.ts (CSP/security headers!) that isn't
          # hashed here would silently restore a stale cache instead of rebuilding.
          key: nextjs-build-${{ hashFiles('app/**', 'src/**', 'public/**', 'pnpm-lock.yaml', 'next.config.ts', 'proxy.ts', 'tailwind.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run test

      - name: Build
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run build

      - name: Cache Playwright browsers
        if: needs.changes.outputs.docs_only != 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        if: needs.changes.outputs.docs_only != 'true' && (steps.playwright-cache.outputs.cache-hit != 'true')
        run: pnpm exec playwright install-deps chromium

      # Runs against the .next produced by the Build step above. playwright.config.ts's
      # webServer uses `pnpm run start` when CI is set, i.e. it serves that same prebuilt
      # production bundle — exactly what the old preview-smoke job did after downloading
      # it, minus the transfer.
      - name: Run Playwright login smoke test
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run test:e2e:smoke
        env:
          NODE_ENV: test
          # This test logs in as the hardcoded CI_SMOKE_LOGIN_ID account ("a-12", see
          # app/api/auth/login/route.ts). PHOENIX_CI_SMOKE_LOGIN mode deliberately skips
          # creating an app_sessions row, but SessionSecurityGuard still mounts for real on
          # the landed page and heartbeats that orphaned session — which correctly logs a
          # "Session rejected: app session not found" audit row wherever these Supabase
          # credentials point. Pointed at the isolated STAGING project (not production) so
          # this expected CI noise never lands in the live production audit trail (it used to
          # — see memory/ci-smoke-login-prod-audit-noise.md). URL and anon key are
          # public/non-secret (RLS-protected), mirroring the value already committed in
          # deploy-cloud-run-staging.yml:141; only the service-role key is a real secret.
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpZndtbmR1bm1seGpoeWp1Z3hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NzQxMzEsImV4cCI6MjA5OTM1MDEzMX0.2bWjOI1gH67H8Fj1wr2XheQjlDhM5pOQ6xPD8YLd5lc" # gitleaks:allow (public anon key, RLS-protected -- see comment above)
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          PHOENIX_AUTH_SECRET: ${{ secrets.PHOENIX_AUTH_SECRET || 'ci-only-phoenix-auth-secret-for-playwright-session-signing' }}
          PHOENIX_SKIP_SUPABASE_AUTH_BRIDGE: "true"
          PHOENIX_CI_SMOKE_LOGIN: "true"

      # Best-effort: feed the /admin/synthetic-journeys dashboard from CI. This runs
      # `pnpm run synthetic:save-report` (scripts/synthetic-save-report.ts →
      # ingestSyntheticJourneyReport), which writes a run row directly to Supabase using
      # the service-role key already provided to this job. It is a deliberate NO-OP unless
      # a report exists at tests/synthetic/report/latest.json — the login smoke test above
      # does NOT produce one; only a full synthetic run (`pnpm run synthetic:test` against a
      # deployed target) does. TO ACTIVATE real ingestion: (1) add a repo secret
      # SYNTHETIC_BASE_URL pointing at the environment to probe, and (2) add a step/job that
      # runs `pnpm run synthetic:test` to generate the report BEFORE this step. Kept
      # continue-on-error + guarded so a missing report or missing creds can never fail CI.
      - name: Ingest synthetic-journey report (best-effort, never fails CI)
        if: needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional/not-yet-created secret; empty is fine (script defaults baseUrl to "unknown").
          SYNTHETIC_BASE_URL: ${{ secrets.SYNTHETIC_BASE_URL }}
        run: |
          if [ ! -f tests/synthetic/report/latest.json ]; then
            echo "No synthetic report at tests/synthetic/report/latest.json — nothing to ingest, skipping."
            exit 0
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]; then
            echo "Supabase service credentials not configured — skipping synthetic ingest."
            exit 0
          fi
          echo "Ingesting synthetic-journey report into Supabase..."
          pnpm run synthetic:save-report

      - name: Upload Playwright report on failure
        if: needs.changes.outputs.docs_only != 'true' && (failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: output/playwright-report
          retention-days: 5

  # Split out of the old lint-typecheck job so it runs beside `typecheck` instead of
  # in front of it. eslint keeps its own incremental --cache; the restore-keys fallback
  # matters more than the exact key here, since a partial cache still skips most files.
  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # corepack must be enabled BEFORE setup-node runs — see the note in `validate`.
      - name: Enable Corepack (pnpm)
        if: needs.changes.outputs.docs_only != 'true'
        run: corepack enable

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Restore ESLint cache
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eslintcache
          key: eslintcache-${{ hashFiles('app/**', 'src/**', 'tests/**', 'scripts/**', 'eslint.config.mjs', 'pnpm-lock.yaml') }}
          restore-keys: eslintcache-

      - name: Lint
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm run lint

  # Split out of the old lint-typecheck job — see the note on `lint`.
  typecheck:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # corepack must be enabled BEFORE setup-node runs — see the note in `validate`.
      - name: Enable Corepack (pnpm)
        if: needs.changes.outputs.docs_only != 'true'
        run: corepack enable

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Next.js route types
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm exec next typegen

      - name: Typecheck
        if: needs.changes.outputs.docs_only != 'true'
        # tsc --noEmit over this many files can exceed Node's default old-space
        # heap ceiling on the standard GitHub-hosted runner and crash with an
        # OOM before reporting any diagnostics (not a type error). Raise the
        # heap limit rather than let the runner's default silently cap it.
        run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  full-e2e:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_e2e == 'true'
    runs-on: ubuntu-latest
    needs: [validate, lint, typecheck]
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # corepack must be enabled BEFORE setup-node runs: with `cache: pnpm`,
      # setup-node invokes `pnpm store path` during its own execution, and the
      # pnpm shim only exists once corepack is enabled. corepack then reads the
      # exact pnpm version from package.json's `packageManager` field.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          # Caches the pnpm store (keyed on pnpm-lock.yaml), NOT node_modules —
          # pnpm's node_modules is a symlink+hardlink layout that does not
          # round-trip safely through actions/cache tar archives. Restoring the
          # store and letting `pnpm install` re-link is the supported fast path.
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run full Playwright E2E suite
        run: pnpm run test:e2e -- -j 4
        env:
          NODE_ENV: test
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PHOENIX_AUTH_SECRET: ${{ secrets.PHOENIX_AUTH_SECRET || 'ci-only-phoenix-auth-secret-for-playwright-session-signing' }}
          PLAYWRIGHT_DATA_USER_HRID: ${{ secrets.PLAYWRIGHT_DATA_USER_HRID }}
          PLAYWRIGHT_DATA_USER_PASSWORD: ${{ secrets.PLAYWRIGHT_DATA_USER_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-full-e2e
          path: output/playwright-report
          retention-days: 5
