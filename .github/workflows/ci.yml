name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Guard dev-preview imports
        run: npm run guard:dev-preview-imports

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Create stub .env.local for tests
        run: touch .env.local

      - name: Test
        run: npm run test
        env:
          DESIGNATED_HR_SPECIALIST_HR_ID: ${{ secrets.DESIGNATED_HR_SPECIALIST_HR_ID }}
          DESIGNATED_HR_MANAGER_HR_ID: ${{ secrets.DESIGNATED_HR_MANAGER_HR_ID }}

      - name: Build
        run: npm run build
