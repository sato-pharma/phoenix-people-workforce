name: Move secrets into the main-only environments
# WHY THIS EXISTS (credentials audit, 18 Nov 2026, finding 1; the owner's "Fix 1, 3, 4 in one PR"). Every Actions
# secret was repository-wide, so ANY branch whose workflow was edited could read the production service key, the
# database password, the session-signing secret and the Railway key — and three things can push a branch: the owner,
# the Claude GitHub app and the Railway GitHub app. They now belong in two environments that only named branches may use:
#
#   main-secrets    allows only `main`. Every job that reads a production secret names it (`environment: main-secrets`).
#   urgent-deploy   allows only `urgent-deploy/production` and `urgent-deploy/dry-run`, and holds only the two Railway
#                   tokens, for urgent-deploy.yml.
#
# GitHub never shows a secret's value to anyone, so the values can only be copied from inside a run. That is all this
# workflow does: it COPIES each repository secret into the environment under the same name. It deletes nothing. The
# repository-wide copies are removed afterwards, by name, only on the owner's word.
#
# HOW IT IS RUN — ONCE, after the pull request that adds it has merged (docs/security/secret-rotation.md, "Where the
# secrets live"):
#   1. gh auth token | gh secret set SECRETS_MOVER_TOKEN --env main-secrets     (on stdin, never as an argument)
#   2. gh workflow run move-secrets-to-environments.yml --ref main -f confirm=MOVE
#   3. gh secret delete SECRETS_MOVER_TOKEN --env main-secrets                  (the moment the run ends)
#   4. gh secret list --env main-secrets, and compare the names with the run's summary.
# Without the temporary token it stops at its first line; GITHUB_TOKEN cannot write secrets.
#
# STAYS REPOSITORY-WIDE (the `keep` pattern below): browser-visible values (NEXT_PUBLIC_*, the Supabase URL, anon and
# publishable keys, APP_URL, SYNTHETIC_BASE_URL), the Telegram alarm pair (every Notify job reads it), EXPO_TOKEN, and
# STAGING_SUPABASE_SERVICE_ROLE_KEY, which ci.yml's `validate` needs on every branch for the staging login smoke.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type MOVE to copy the repository secrets into the environments (nothing is deleted)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: move-secrets-to-environments
  cancel-in-progress: false

jobs:
  move:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'MOVE' }}
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: main-secrets # the run must stand in the environment to read the temporary token
    timeout-minutes: 10
    steps:
      - name: Copy each production secret into main-secrets, and the Railway tokens into urgent-deploy too
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          GH_TOKEN: ${{ secrets.SECRETS_MOVER_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SECRETS_MOVER_TOKEN is not set in the main-secrets environment, so nothing was copied (step 1 in this file's header)."
            exit 1
          fi
          keep='^(github_token|GITHUB_TOKEN|SECRETS_MOVER_TOKEN|STAGING_SUPABASE_SERVICE_ROLE_KEY|EXPO_TOKEN|SYNTHETIC_BASE_URL|APP_URL|SUPABASE_URL|SUPABASE_ANON_KEY|SUPABASE_PUBLISHABLE_KEY|NEXT_PUBLIC_.*|TELEGRAM_.*)$'
          copied=(); kept=()
          # Names only ever reach the log. Each value goes from jq straight into gh on stdin, and Actions masks it anyway.
          for name in $(jq -r 'keys[]' <<<"$ALL_SECRETS"); do
            if [[ "$name" =~ $keep ]]; then kept+=("$name"); continue; fi
            jq -j --arg n "$name" '.[$n]' <<<"$ALL_SECRETS" | gh secret set "$name" --env main-secrets --repo "$REPO"
            copied+=("$name")
            case "$name" in
              RAILWAY_API_TOKEN|RAILWAY_TOKEN)
                jq -j --arg n "$name" '.[$n]' <<<"$ALL_SECRETS" | gh secret set "$name" --env urgent-deploy --repo "$REPO"
                ;;
            esac
          done
          {
            echo "### Copied into main-secrets: ${#copied[@]}"
            printf -- '- %s\n' "${copied[@]}"
            echo "### Kept repository-wide: ${#kept[@]}"
            printf -- '- %s\n' "${kept[@]}"
            echo "The Railway tokens were also copied into urgent-deploy. Nothing was deleted."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "copied ${#copied[@]} into main-secrets, kept ${#kept[@]} repository-wide; nothing deleted"
