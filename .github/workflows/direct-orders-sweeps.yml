name: Direct Orders daily sweeps

# The two clocks that make the held lane a parking lot instead of a swamp:
#
#   direct-orders-expire-held  - a direct order still `held` 14 days after it was parked expires,
#                                logged, evented, requester notified (spec B6).
#   direct-orders-probation    - a pharmacy approved into PROVISIONAL is checked against its
#                                90-day footprint; it is promoted to trusted or flagged (spec A3).
#
# Both shipped in #1738/#1748 with no schedule behind them, so the clocks were never wound.
#
# THE SCHEDULE MOVED TO cron-job.org ON 2026-08-23. THIS FILE IS NOW A MANUAL FALLBACK ONLY.
# Live jobs in that account, beside the other production jobs there:
#
#   phoenix-direct-orders-expire-held  id 8313165  02:17 Africa/Cairo
#   phoenix-direct-orders-probation    id 8313177  02:27 Africa/Cairo
#
# There is deliberately NO `schedule:` below. If you re-add one, BOTH schedulers fire and every
# requester whose order expires gets the notification twice.
#
# WHY IT MOVED. Scheduling from here put CRON_SECRET in two independently-rotated stores: Railway
# (which the app reads, and which the other jobs already authenticate against) and this
# repository's Actions secrets. The 2026-08-14 Railway rotation was never mirrored here, so both
# steps 401'd every night from 2026-08-14 to 2026-08-22 - nine consecutive red runs - and it was
# found by an unrelated audit, not by an alert. A lone straggler in a second store fails alone and
# silently; a stale secret in cron-job.org breaks every job in that account at once, which is
# impossible to miss. GitHub's scheduler is also billable: when Actions billing stopped on
# 2026-08-23 every workflow in this repository failed within seconds, a dependency cron-job.org
# does not have.
#
# THIS WORKFLOW DOES NOT ALERT ANYONE. An earlier version of this comment claimed "a red workflow
# run emails the owner". It does not, or nobody reads it - see the nine nights above. Do not
# re-add that claim.
#
# The alerting is in the ROUTES, not here: both are wrapped in withDeadMansSwitch (Healthchecks.io,
# slugs phoenix-direct-orders-expire-held / phoenix-direct-orders-probation, see
# docs/observability.md). Healthchecks alerts on the ping that DIDN'T arrive, which is the only
# thing that can report a request never reaching the handler - exactly this failure. If you change
# the schedule in cron-job.org, change the matching Healthchecks check schedule too.
#
# Timing there: 02:17 and 02:27, staggered so the two sweeps never overlap, and set in the
# Africa/Cairo timezone rather than the UTC-only cron this file used to carry - so they no longer
# drift by an hour twice a year when Egypt changes its clocks.
#
# Running this manually (Actions > Direct Orders daily sweeps > Run workflow) authenticates with
# this repository's OWN copy of CRON_SECRET. That copy WAS the stale one when the paragraph above
# was written on 2026-08-23 - it was re-aligned on 2026-08-24 and is current. Do NOT re-align it
# as a ritual: AGENTS.md 2.3 says the 2026-08-23 401s are resolved and to rotate nothing.
#
# THE TWO STORES ARE NO LONGER INDEPENDENT, AND THE ARROW POINTS ONE WAY:
#
#     GitHub Actions secret CRON_SECRET  ==>  Railway production CRON_SECRET
#
# sync-railway-production-secrets.yml writes ~48 secrets into Railway production, CRON_SECRET among
# them, unconditionally and without diffing - on workflow_dispatch AND on any push to main touching
# that workflow or scripts/sync-railway-production-secrets.mjs. Measured 2026-08-31: run
# 33407660884 (fired by #2820) logged "synced CRON_SECRET" and "completed: updated=48".
#
# SO THE LIVE HAZARD IS THE MIRROR IMAGE OF THE 2026-08-14 ONE. Rotating CRON_SECRET in Railway
# alone - dashboard or CLI - does not stick. The next push touching either of those two files
# silently overwrites it with GitHub's copy and every cron-job.org job 401s at once, with no PR
# and nothing in this file's history to explain it. Rotate the GITHUB secret first and let the
# sync carry it down, or set both in one sitting.
#
# The sync passes --skip-deploys, so a clobbered value is inert until the next deploy: the
# breakage surfaces detached from the change that caused it, possibly days later.

on:
  workflow_dispatch:

permissions:
  contents: read

# Never let a slow run overlap the next day's. Both sweeps are idempotent, but two concurrent
# passes would double the notifications a requester receives.
concurrency:
  group: direct-orders-sweeps
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Run the held-order 14-day expiry sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROUTE: direct-orders-expire-held
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set on this repository; the sweep cannot authenticate."
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://phoenix-hr.satopharma.com/api/cron/${ROUTE}")
          echo "HTTP $code"
          cat "$body"
          echo ""
          {
            echo "### ${ROUTE}"
            echo ""
            echo "HTTP \`$code\`"
            echo ""
            echo '```json'
            cat "$body"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A non-200 must fail the run. A sweep that quietly 401s looks identical to one with
          # nothing to do - both print a small number and move on.
          if [ "$code" != "200" ]; then
            # 401 has exactly one cause worth naming: this repository's CRON_SECRET no longer
            # matches the one Railway serves. It happened on 2026-08-14 and cost nine nights of
            # dead clocks, so say the fix out loud instead of printing a bare status code.
            if [ "$code" = "401" ]; then
              echo "::error::${ROUTE} returned HTTP 401 - this repository's CRON_SECRET does not match the one Railway production serves. Re-align GitHub FROM Railway using the GUARDED form in docs/agents-production-hooks.md: strip the BOM and assert length 64 before writing, because GitHub is UPSTREAM of Railway and a bad value here is pushed into production by sync-railway-production-secrets.yml. Do not use a bare railway|jq|gh pipe. Then re-run this workflow."
            else
              echo "::error::${ROUTE} returned HTTP $code"
            fi
            exit 1
          fi

      - name: Run the 90-day pharmacy probation sweep
        # `always()` so a failure in the expiry sweep does not silently skip this one. They are
        # independent clocks; one being broken is not a reason to stop winding the other.
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROUTE: direct-orders-probation
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set on this repository; the sweep cannot authenticate."
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS --max-time 120 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://phoenix-hr.satopharma.com/api/cron/${ROUTE}")
          echo "HTTP $code"
          cat "$body"
          echo ""
          {
            echo "### ${ROUTE}"
            echo ""
            echo "HTTP \`$code\`"
            echo ""
            echo '```json'
            cat "$body"
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "200" ]; then
            # 401 has exactly one cause worth naming: this repository's CRON_SECRET no longer
            # matches the one Railway serves. It happened on 2026-08-14 and cost nine nights of
            # dead clocks, so say the fix out loud instead of printing a bare status code.
            if [ "$code" = "401" ]; then
              echo "::error::${ROUTE} returned HTTP 401 - this repository's CRON_SECRET does not match the one Railway production serves. Re-align GitHub FROM Railway using the GUARDED form in docs/agents-production-hooks.md: strip the BOM and assert length 64 before writing, because GitHub is UPSTREAM of Railway and a bad value here is pushed into production by sync-railway-production-secrets.yml. Do not use a bare railway|jq|gh pipe. Then re-run this workflow."
            else
              echo "::error::${ROUTE} returned HTTP $code"
            fi
            exit 1
          fi
