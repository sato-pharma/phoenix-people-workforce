name: Pre-Production

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  preprod:
    runs-on: ubuntu-latest
    concurrency:
      group: preprod-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create stub .env.local for tests
        run: touch .env.local

      - name: Pre-production checks
        run: npm run ci
        env:
          DESIGNATED_HR_SPECIALIST_HR_ID: ${{ secrets.DESIGNATED_HR_SPECIALIST_HR_ID }}
          DESIGNATED_HR_MANAGER_HR_ID: ${{ secrets.DESIGNATED_HR_MANAGER_HR_ID }}

      - name: Verify preflight secrets are configured
        run: |
          MISSING=""
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]     && MISSING="$MISSING NEXT_PUBLIC_SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]    && MISSING="$MISSING SUPABASE_SERVICE_ROLE_KEY"
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && MISSING="$MISSING NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$MISSING" ]; then
            echo "::error::Pre-production DB preflight cannot run — missing secrets:$MISSING"
            echo "Add these secrets to the repository before merging to main."
            exit 1
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Production DB preflight
        if: ${{ secrets.PHOENIX_PRODUCTION_PREFLIGHT_CONFIRM != '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PHOENIX_PRODUCTION_PREFLIGHT_CONFIRM: ${{ secrets.PHOENIX_PRODUCTION_PREFLIGHT_CONFIRM }}
        run: npm run db:preflight:role-alignment:production
