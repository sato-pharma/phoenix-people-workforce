name: SonarQube Cloud

# Static code-quality/security analysis via SonarQube Cloud. Read-only: it runs
# static analysis and imports test coverage, and does not change application
# behavior. Scan configuration (sources, exclusions, SQL dialect, Quality Gate)
# lives in sonar-project.properties at the repo root.
#
# Setup docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/ci-based-analysis/github-actions-for-sonarcloud
#
# Deliberately PR-only, no push-to-main trigger. A push-to-main run does a full
# whole-codebase baseline scan (not a diff), and on this org's free SonarQube
# Cloud plan that consistently fails server-side after upload - confirmed
# reproducible twice on 2026-08-05 ("CE Task finished abnormally with status:
# FAILED"), most likely the plan's lines-of-code cap. PR analysis stays scoped
# to the diff and is unaffected - that's the actual value (gating incoming
# changes), so there's no point re-running a scan on every main push that is
# guaranteed to fail until/unless the plan changes. Re-add
# `push: {branches: [main]}` under `on:` if the org ever upgrades off the free
# plan.
#
# Separately: this project was imported with SonarQube Cloud's "Automatic
# Analysis" on (its Analysis Method page URL contained "AutoScan" at setup
# time), which is mutually exclusive with CI-based analysis and raises "You are
# running CI analysis while Automatic Analysis is enabled" if both run. Confirm
# it's off under the project's Administration -> Analysis Method if issues
# other than the one above show up.

# RETIRED 2026-08-05 (owner decision) — trigger-disabled, not deleted, the same way
# deploy-cloud-run.yml was kept after the Railway cutover. `workflow_dispatch` only:
# it no longer runs on pull requests and no longer posts a check.
#
# WHY. The Quality Gate blocked PR #1784 for hours and could not be satisfied or even
# diagnosed. The failing condition is invisible from CI — the scanner logs only
# `QUALITY GATE STATUS: FAILED`, and every sonarcloud.io API endpoint returns 404 for
# this private project — so each attempt was a guess. Four failed in sequence:
#
#   1. wrote more tests            — the number was a measurement bug, not a test gap
#   2. fixed the measurement (#1749, `c8 --all`) — gate unmoved
#   3. lowered Coverage on New Code to 50%       — gate unmoved
#   4. removed the ReDoS-shaped regex it flagged — gate unmoved
#
# The real condition was `Security Hotspots Reviewed = 100%`, which counts HUMAN
# reviews in the SonarCloud UI, not code quality. A scanner can never satisfy it, and
# because branch protection requires up-to-date branches, nearly every PR here gets an
# update-branch that moves the head — re-raising the hotspot as new and needing review
# again. Neither a manual review nor removing the condition cleared it. At ~30
# commits/day that is a permanently red check, and a permanently red check is one
# everybody learns to ignore — worse than no check at all.
#
# NOTHING SECURITY-RELATED IS LOST. `sast-scan` and `secret-scan` remain REQUIRED
# status checks on main (with validate, lint, typecheck). Sonar was never required.
#
# To revive: restore the `pull_request` trigger below. Scan config, coverage wiring and
# the measured-coverage rationale are left intact in sonar-project.properties and
# docs/testing-coverage.md.
on:
  workflow_dispatch:

# Cancel a PR's superseded run when it's pushed again - a fixup shouldn't pay
# for analysis on the commit it just replaced. workflow_dispatch runs (keyed by
# commit) are left to finish since there's no "superseding" push to race.
concurrency:
  group: sonarqube-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI_NODE_VERSION: "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarQube Cloud needs full history for accurate blame / new-code
          # detection - the default shallow clone undercounts "new" issues on
          # every PR.
          fetch-depth: 0

      # corepack must be enabled BEFORE setup-node runs - see the same note in
      # ci.yml. corepack then reads the exact pnpm version from package.json's
      # packageManager field.
      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      # --ignore-scripts: this job never needs a dependency's install/postinstall
      # lifecycle script (no native builds, no browser downloads happen here) - so
      # there is no reason to let arbitrary third-party install-time code run at
      # all. Closes SonarQube Cloud rule githubactions:S6505.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Runs this repo's own test runner (tests/run-tests.ts, same flags as the
      # "test" package.json script) through c8 with an lcov reporter added, so
      # SonarQube Cloud has coverage to import (sonar.javascript.lcov.reportPaths
      # in sonar-project.properties). --env-file-if-exists=.env.local is a no-op
      # here: that file is gitignored and never checked out in CI, so this step
      # never touches the production Supabase credentials it points to locally.
      #
      # --all is what makes the number TRUE (added 2026-08-05 after PR #1748 was
      # reported at 4.3% "coverage on new code" while the repo appeared to be at
      # 55%). Without it c8 only reports files it LOADED, so the ~2,300 source
      # files no test ever imports were absent from lcov entirely — not scored as
      # 0%, simply invisible. Sonar reads a missing file as 0% while the local
      # summary quietly left it out of the denominator, which is how the two
      # numbers disagreed by an order of magnitude. Measured effect: repo-wide
      # line coverage 55.1% -> 22.5% (117,862/523,394). Nothing got worse; the
      # 55% was never real.
      #
      # --src bounds the sweep to the application's own code, so --all does not
      # drag in build output or fixtures.
      - name: Test with coverage
        run: pnpm exec c8 --all --src=src --src=app --exclude='tests/**' --exclude='**/*.test.ts' --exclude='.next/**' --reporter=lcov --reporter=text-summary -o coverage node --env-file-if-exists=.env.local --experimental-strip-types --experimental-specifier-resolution=node --experimental-loader ./tests/alias-loader.mjs tests/run-tests.ts

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
