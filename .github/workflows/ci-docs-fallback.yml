name: CI (docs-only fallback)

# ci.yml's jobs use paths-ignore for this same list, so they never queue for PRs that touch
# only these paths. A required check with no run has no status, which blocks such a PR
# forever. This workflow's jobs share ci.yml's job names and trigger on the inverse filter,
# so a docs-only PR gets fast, trivially-passing runs instead. For mixed PRs (code + docs)
# both workflows trigger and all must succeed, which is correct.
#
# The job names here MUST track ci.yml's actual job ids. On 2026-07-30 ci.yml split
# `lint-typecheck` into separate `lint` and `typecheck` jobs and this file was not updated,
# so it kept satisfying a check that no longer exists while providing nothing for the two
# that do. That was harmless only while branch protection required no checks; it now requires
# validate, lint, typecheck and secret-scan, so any name drift here hangs every docs-only PR.
# Current ci.yml jobs: validate, lint, typecheck, full-e2e — the three required ones are all
# mirrored below. `secret-scan` needs no mirror: security-scan.yml carries no path filter and
# so runs on every PR, docs-only included.
#
# See https://github.com/Gawish-1997/phoenix-people-workforce/issues/679

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Skip full validation for docs-only changes
        run: echo "Only documentation/template files changed in this PR -- full lint/typecheck/test/build runs in ci.yml when code changes are present. Satisfying the required 'validate' check here so docs-only PRs are mergeable."

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Skip lint for docs-only changes
        run: echo "Only documentation/template files changed in this PR -- there is no app code for lint to check. Satisfying the required 'lint' check here so docs-only PRs are mergeable."

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Skip typecheck for docs-only changes
        run: echo "Only documentation/template files changed in this PR -- there is no app code for typecheck to check. Satisfying the required 'typecheck' check here so docs-only PRs are mergeable."
