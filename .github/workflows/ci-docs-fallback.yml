name: CI (docs-only fallback)

# ci.yml's `validate` and `lint-typecheck` jobs use paths-ignore for this same
# list, so they never queue for PRs that touch only these paths. main's branch
# protection requires both checks, which then block those PRs forever (no run
# == no status). This workflow's jobs share those same names and trigger on
# the inverse filter, so a PR whose changes are entirely docs/templates gets
# fast, trivially-passing `validate`/`lint-typecheck` runs instead. For mixed
# PRs (code + docs), both this workflow and ci.yml trigger; all must succeed,
# which is correct.
#
# See https://github.com/Gawish-1997/phoenix-people-workforce/issues/679

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Skip full validation for docs-only changes
        run: echo "Only documentation/template files changed in this PR -- full lint/typecheck/test/build runs in ci.yml when code changes are present. Satisfying the required 'validate' check here so docs-only PRs are mergeable."

  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Skip lint/typecheck for docs-only changes
        run: echo "Only documentation/template files changed in this PR -- there is no app code for lint/typecheck to check. Satisfying the required 'lint-typecheck' check here so docs-only PRs are mergeable."
