name: Sync Railway production secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflows/sync-railway-production-secrets.yml'
      - 'scripts/sync-railway-production-secrets.mjs'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'

      - name: Sync production secrets to Railway
        env:
          # Accept either kind of Railway credential. RAILWAY_API_TOKEN is an ACCOUNT token
          # (Account Settings → Tokens); RAILWAY_TOKEN is a PROJECT token (project → Settings →
          # Tokens). An account token placed in RAILWAY_TOKEN is read as a project token and
          # rejected "Unauthorized ... has access to the resource" — which reads like expiry and
          # is not. Passing the existing RAILWAY_TOKEN secret through BOTH lets whichever kind the
          # owner minted work, and the script picks the right one (see its comment).
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_ENVIRONMENT: production
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL || vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL || vars.APP_URL || secrets.APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID || vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
          PHOENIX_AUTH_SECRET: ${{ secrets.PHOENIX_AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          NOTIFICATION_WEBHOOK_SECRET: ${{ secrets.NOTIFICATION_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ATTENDANCE_AGENT_TOKEN: ${{ secrets.ATTENDANCE_AGENT_TOKEN || vars.ATTENDANCE_AGENT_TOKEN }}
          NOTIFICATION_DASHBOARD_URL: ${{ vars.NOTIFICATION_DASHBOARD_URL || secrets.NOTIFICATION_DASHBOARD_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY || secrets.NEXT_PUBLIC_GOOGLE_MAPS_BROWSER_KEY }}
          GOOGLE_MAPS_SERVER_KEY: ${{ vars.GOOGLE_MAPS_SERVER_KEY || secrets.GOOGLE_MAPS_SERVER_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID || secrets.NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID }}
          GOOGLE_CALENDAR_API_KEY: ${{ vars.GOOGLE_CALENDAR_API_KEY || secrets.GOOGLE_CALENDAR_API_KEY }}
          GOOGLE_HOLIDAY_CALENDAR_ID_EG: ${{ vars.GOOGLE_HOLIDAY_CALENDAR_ID_EG || secrets.GOOGLE_HOLIDAY_CALENDAR_ID_EG }}
          LOCATIONIQ_API_KEY: ${{ vars.LOCATIONIQ_API_KEY || secrets.LOCATIONIQ_API_KEY }}
          NEXT_PUBLIC_ONESIGNAL_APP_ID: ${{ vars.NEXT_PUBLIC_ONESIGNAL_APP_ID || secrets.NEXT_PUBLIC_ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN || vars.SENTRY_DSN || secrets.SENTRY_DSN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN || secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Added 2026-08-08 — see the matching comment in sync-railway-production-secrets.mjs.
          APP_ENV: ${{ vars.APP_ENV || secrets.APP_ENV }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_EMAIL_FROM: ${{ vars.BREVO_EMAIL_FROM || secrets.BREVO_EMAIL_FROM }}
          EMAIL_NOTIFICATIONS_ENABLED: ${{ vars.EMAIL_NOTIFICATIONS_ENABLED || secrets.EMAIL_NOTIFICATIONS_ENABLED }}
          # Secret is named PHOENIX_ACTIONS_DISPATCH_TOKEN on GitHub -- "GITHUB_" is a reserved
          # secret-name prefix (HTTP 422 if used), confirmed live 2026-08-08. It is passed under
          # its GITHUB name because that is the name the script reads (`github:` in its entry);
          # the script writes it to Railway as GITHUB_ACTIONS_DISPATCH_TOKEN. From 2026-08-08 to
          # 2026-10-27 this line exported GITHUB_ACTIONS_DISPATCH_TOKEN, which nothing read, so
          # every run logged "skipping optional ... because PHOENIX_ACTIONS_DISPATCH_TOKEN is
          # empty" and the token only ever reached Railway by hand. Pinned by
          # tests/railway-secret-policy.test.ts section 10.
          PHOENIX_ACTIONS_DISPATCH_TOKEN: ${{ secrets.PHOENIX_ACTIONS_DISPATCH_TOKEN }}
          HEALTHCHECKS_PING_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          HR_NOTIFICATION_EMAILS: ${{ vars.HR_NOTIFICATION_EMAILS || secrets.HR_NOTIFICATION_EMAILS }}
          IREPORTS360_BASE_URL: ${{ vars.IREPORTS360_BASE_URL || secrets.IREPORTS360_BASE_URL }}
          IREPORTS360_PASSWORD: ${{ secrets.IREPORTS360_PASSWORD }}
          IREPORTS360_TIMEOUT_MS: ${{ vars.IREPORTS360_TIMEOUT_MS || secrets.IREPORTS360_TIMEOUT_MS }}
          IREPORTS360_USERNAME: ${{ secrets.IREPORTS360_USERNAME }}
          JOB_OFFER_EMAIL_FROM: ${{ vars.JOB_OFFER_EMAIL_FROM || secrets.JOB_OFFER_EMAIL_FROM }}
          MARKETING_SHEET_REFRESH_WEBHOOK_SECRET: ${{ secrets.MARKETING_SHEET_REFRESH_WEBHOOK_SECRET }}
          MARKETING_SHEET_REFRESH_WEBHOOK_URL: ${{ vars.MARKETING_SHEET_REFRESH_WEBHOOK_URL || secrets.MARKETING_SHEET_REFRESH_WEBHOOK_URL }}
          NOTIFICATION_EMAIL_FROM: ${{ vars.NOTIFICATION_EMAIL_FROM || secrets.NOTIFICATION_EMAIL_FROM }}
          PHOENIX_ALLOWED_ORIGINS: ${{ vars.PHOENIX_ALLOWED_ORIGINS || secrets.PHOENIX_ALLOWED_ORIGINS }}
          PHOENIX_APP_URL: ${{ vars.PHOENIX_APP_URL || secrets.PHOENIX_APP_URL }}
          PHOENIX_LIVE_CRM_POLL: ${{ vars.PHOENIX_LIVE_CRM_POLL || secrets.PHOENIX_LIVE_CRM_POLL }}
          PHOENIX_STRICT_SUPABASE_BRIDGE: ${{ vars.PHOENIX_STRICT_SUPABASE_BRIDGE || secrets.PHOENIX_STRICT_SUPABASE_BRIDGE }}
          RECRUITMENT_EMAIL_IMPORT_SENDERS: ${{ vars.RECRUITMENT_EMAIL_IMPORT_SENDERS || secrets.RECRUITMENT_EMAIL_IMPORT_SENDERS }}
          RECRUITMENT_WHATSAPP_IMPORT_SENDERS: ${{ vars.RECRUITMENT_WHATSAPP_IMPORT_SENDERS || secrets.RECRUITMENT_WHATSAPP_IMPORT_SENDERS }}
          RECRUITMENT_WHATSAPP_SILENCE_ALERT_HOURS: ${{ vars.RECRUITMENT_WHATSAPP_SILENCE_ALERT_HOURS || secrets.RECRUITMENT_WHATSAPP_SILENCE_ALERT_HOURS }}
          SHEET_REFRESH_WEBHOOK_SECRET: ${{ secrets.SHEET_REFRESH_WEBHOOK_SECRET }}
          SHEET_REFRESH_WEBHOOK_URL: ${{ vars.SHEET_REFRESH_WEBHOOK_URL || secrets.SHEET_REFRESH_WEBHOOK_URL }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.WHATSAPP_PHONE_NUMBER_ID || secrets.WHATSAPP_PHONE_NUMBER_ID }}
          # Added 2026-09-11: the comma-separated list the intake health check probes. Without it
          # only the single number above is watched, so a second line can go silent unnoticed.
          WHATSAPP_PHONE_NUMBER_IDS: ${{ vars.WHATSAPP_PHONE_NUMBER_IDS || secrets.WHATSAPP_PHONE_NUMBER_IDS }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          # Added 2026-08-08 once a clean replacement value existed (see the .mjs comment).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Added 2026-09-05 -- see the matching comment in sync-railway-production-secrets.mjs.
          CV_LIFECYCLE_SHEET_REFRESH_WEBHOOK_SECRET: ${{ secrets.CV_LIFECYCLE_SHEET_REFRESH_WEBHOOK_SECRET }}
          CV_LIFECYCLE_SHEET_REFRESH_WEBHOOK_URL: ${{ vars.CV_LIFECYCLE_SHEET_REFRESH_WEBHOOK_URL || secrets.CV_LIFECYCLE_SHEET_REFRESH_WEBHOOK_URL }}
        run: node scripts/sync-railway-production-secrets.mjs

      - name: Validate synced Railway production variables
        env:
          # Accept either kind of Railway credential. RAILWAY_API_TOKEN is an ACCOUNT token
          # (Account Settings → Tokens); RAILWAY_TOKEN is a PROJECT token (project → Settings →
          # Tokens). An account token placed in RAILWAY_TOKEN is read as a project token and
          # rejected "Unauthorized ... has access to the resource" — which reads like expiry and
          # is not. Passing the existing RAILWAY_TOKEN secret through BOTH lets whichever kind the
          # owner minted work, and the script picks the right one (see its comment).
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_ENVIRONMENT: production
        run: node scripts/validate-railway-production-secrets.mjs
