name: E2E Tests

on:
  # Run on PRs to main and on direct pushes to main.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - master
  # Allow manual runs against any branch.
  workflow_dispatch:
    inputs:
      base_url:
        description: "App URL to run E2E tests against (defaults to http://localhost:3000)"
        required: false
        default: ""

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || '' }}
          NODE_ENV: test
          # Auth secret needed for session token creation in tests.
          PHOENIX_AUTH_SECRET: ${{ secrets.PHOENIX_AUTH_SECRET || 'e2e-test-secret-not-for-production' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: output/playwright-report/
          retention-days: 14
