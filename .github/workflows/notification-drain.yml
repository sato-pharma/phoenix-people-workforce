name: Notification Drain

# Sub-daily drain of the notification outbox + deferred deliveries. Vercel Hobby allows
# only the single daily cron (/api/notifications/daily), so a failed/queued email — incl.
# a 2-minute password-reset link — would otherwise wait up to ~24h for retry. This hits
# the CRON_SECRET-protected /api/notifications/process every ~5 minutes so the real-world
# retry latency is minutes, not a day. GitHub-hosted cron is best-effort (it can be
# delayed or skipped under load); the daily Vercel cron remains the guaranteed backstop,
# so correctness never depends on this running.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: notification-drain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger notification processing
        env:
          # https://phoenix-workforce.vercel.app/api/notifications/process?limit=50
          DRAIN_URL: ${{ secrets.NOTIFICATION_DRAIN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${DRAIN_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "NOTIFICATION_DRAIN_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" --max-time 120 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${DRAIN_URL}")
          echo "HTTP ${code}"
          cat /tmp/resp.json || true
          test "${code}" = "200"
