name: Daily Database Checks

# This workflow runs the daily READ-ONLY database checks. Two today, sharing one job because the
# expensive part of either is `pnpm install`, which one job pays for once:
#
#   1. Staging HR drift  — is staging still a faithful clone of production? (the original purpose,
#      and the reason the file is named staging-hr-drift-check.yml; the path is kept so the cron
#      and the run history stay continuous)
#   2. Backup schema retention — which ad-hoc backup schemas on PRODUCTION have outlived their
#      purpose? See docs/security/backup-schema-retention.md.
#
# 🔴 NEITHER STEP MAY FAIL ON A FINDING, and the reason is the same for both — see the block on
# the drift check below. Only a BROKEN check fails.
#
# WHY THE DRIFT CHECK EXISTS (added 2026-09-29). Staging is a real clone of production and silently falls
# behind. When it was measured it was missing 19 employees, 13 resignations, 36 occupancy rows,
# 4 line-area rows, 2 areas, 5 teams and a position. Nothing anywhere said so: a dated territory
# migration failed its own precondition on staging while succeeding on production, and that
# refusal was the first and only signal. Every staging rehearsal of payroll, org or
# sales-geography behaviour before that point was running against a different company.
#
# This is the alarm, not the fix. It runs `sync-staging-hr.mjs` in its DRY-RUN mode, which reads
# both databases and writes nothing. The fix is the same script with --apply, run by a human who
# has decided staging should be refreshed (owner's choice, 2026-09-29: a daily drift check with
# no writes, because an automatic overwrite would silently destroy state somebody set up for
# testing).
#
# 🔴 WHY THIS JOB NEVER FAILS ON DRIFT, UNLIKE ITS SIBLINGS.
# deploy-drift-check and migration-drift-check exit 1 when they find drift, which is right for
# them: they detect RARE faults, so a red run is news. This one detects an EXPECTED, RECURRING
# condition — staging falls behind whenever anyone is hired, resigns or changes seat, which is
# most days. And a scheduled workflow's check suite attaches to whatever commit is main HEAD when
# it fires, while Railway withholds a production deploy when ANY suite on that commit fails
# (AGENTS.md section 2.3). A job that is legitimately red most days would therefore withhold
# production deploys most days.
#
# That is not hypothetical. On 2026-09-28 commit cd9e0be03 was fully green on ci.yml and its
# production deploy was still marked SKIPPED, because the only red suite on it was
# deploy-drift-check's own false alarm. This workflow would reproduce that every time staging
# drifted, which is the normal state it exists to report.
#
# So: drift is reported by TELEGRAM ALERT and in the job summary, and the run stays green. The
# alerting step mirrors migration-drift-check.yml's, including its continue-on-error, so a
# Telegram outage cannot turn this into the red suite described above.
#
# COST. One run a day. It needs `postgres` from the lockfile, so unlike the curl-only drift
# checks it does install dependencies — a couple of minutes a day. Actions spend in this repo is
# already the highest it has been, so if that matters more than the signal, reduce the cron
# rather than deleting the workflow: a weekly check still catches drift long before a migration
# trips over it.

on:
  schedule:
    - cron: "0 5 * * *" # 07:00 Cairo, before the working day and offset from the 07:00 UTC migration drift check
  workflow_dispatch:

# Never on push or pull_request. This measures drift that accumulates AFTER a merge, so a
# per-commit run would say nothing a scheduled one does not — and would multiply the deploy-gate
# exposure described above.

permissions:
  contents: read

concurrency:
  group: staging-hr-drift-check
  cancel-in-progress: false

jobs:
  drift:
    name: staging HR drift
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # This job had NO `timeout-minutes`, so its ceiling was GitHub's default of six hours — a
    # hung read would have held a runner all night and then cancelled, withholding that `main`
    # commit's production deploy. Measured duration is ~20s.
    # 🔴 EVERY `continue-on-error` STEP BELOW CARRIES ITS OWN `timeout-minutes`, AND THIS CEILING
    # SITS ABOVE THEIR SUM (2026-10-13). A JOB that hits its ceiling concludes `cancelled`, which
    # withholds that `main` commit's production deploy exactly as a failure does — and a timeout is
    # not a step failure, so `continue-on-error` cannot absorb it. A STEP that hits its own ceiling
    # fails only that step, which `continue-on-error` turns into a reported finding with the job
    # still green. Account and the two runs it cost: migration-drift-check.yml, above its job.
    # Pinned by tests/github-workflow-validity.test.ts.
    timeout-minutes: 15
    # 🔴 THE DATABASE-URL PATH IS THE FULL CHECK, AND IT HAS NEVER ONCE RUN.
    # PHOENIX_PRODUCTION_DATABASE_URL does not exist. Measured 2026-09-29 across all 65 repository
    # secrets, the repository variables, both Phoenix environments, the second repo, and the
    # organisation (there is none — the repo is user-owned), and confirmed three times by the
    # workflow itself: every dispatch evaluated the secret as empty and stopped at the warning,
    # measuring nothing.
    #
    # So the alarm now has a FALLBACK that uses the secrets that DO exist. Both projects'
    # service-role keys are already here, and row counts over PostgREST answer the one question this
    # workflow is for — has staging fallen behind? The real drift on 2026-09-29 was one employee, one
    # occupancy row and one line-area row, and the employees count alone would have caught it.
    #
    # The fallback is weaker and says so: PostgREST exposes `public`, so the `au` tables are reached
    # through their public views and au.occupancy_history has none. A working weak alarm beats a
    # perfect one that has never run. When the database URL is added, the full reconciler takes over
    # and the fallback is skipped — no further change needed.
    env:
      HAS_PRODUCTION_DB_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL != '' }}
      HAS_STAGING_DB_URL: ${{ secrets.PHOENIX_STAGING_DATABASE_URL != '' }}
      HAS_REST_KEYS: ${{ (secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY != '' || secrets.SUPABASE_SERVICE_ROLE_KEY != '') && secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY != '' }}
    outputs:
      drifted: ${{ steps.check.outputs.drifted || steps.rest.outputs.drifted }}
    steps:
      - name: Report that nothing can be compared
        if: ${{ (env.HAS_PRODUCTION_DB_URL != 'true' || env.HAS_STAGING_DB_URL != 'true') && env.HAS_REST_KEYS != 'true' }}
        run: |
          echo "::warning::staging HR drift was NOT checked — neither the database URLs nor the service-role keys are available. Add PHOENIX_PRODUCTION_DATABASE_URL (production ref ozucdzovmcqvepbozvqf) for the full check."
          {
            echo "### Staging HR drift — NOT CHECKED"
            echo ""
            echo "Neither the database URLs nor the service-role keys were available, so nothing was compared."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out
        if: ${{ (env.HAS_PRODUCTION_DB_URL == 'true' && env.HAS_STAGING_DB_URL == 'true') || env.HAS_REST_KEYS == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The fallback needs no dependencies — fetch and the Node runtime — so it runs before
      # setup-node and costs seconds rather than a pnpm install.
      - name: Compare row counts over PostgREST (read only, both sides)
        id: rest
        if: ${{ (env.HAS_PRODUCTION_DB_URL != 'true' || env.HAS_STAGING_DB_URL != 'true') && env.HAS_REST_KEYS == 'true' }}
        env:
          PRODUCTION_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          set +e
          node scripts/check-staging-drift-rest.mjs | tee rest-drift.txt
          code=$?
          set -e
          {
            echo "### Staging drift — row counts (PostgREST fallback)"
            echo ""
            echo "The full reconciler needs PHOENIX_PRODUCTION_DATABASE_URL, which is not set, so this"
            echo "compares row counts with the service-role keys instead. It cannot see au.occupancy_history."
            echo ""
            echo '```'
            cat rest-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "summary=$(grep '^STAGING HAS DRIFTED' rest-drift.txt || echo 'staging has drifted')" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::the PostgREST drift probe could not run (exit $code)"
            exit "$code"
          fi

      # corepack before setup-node, for the same reason ci.yml does it in that order: with
      # `cache: pnpm`, setup-node runs `pnpm store path` itself and the shim only exists once
      # corepack is enabled. corepack reads the pinned pnpm from package.json.
      - name: Enable Corepack (pnpm)
        if: ${{ env.HAS_PRODUCTION_DB_URL == 'true' && env.HAS_STAGING_DB_URL == 'true' }}
        run: corepack enable

      - name: Set up Node.js
        if: ${{ env.HAS_PRODUCTION_DB_URL == 'true' && env.HAS_STAGING_DB_URL == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.HAS_PRODUCTION_DB_URL == 'true' && env.HAS_STAGING_DB_URL == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Compare staging against production (read only)
        id: check
        if: ${{ env.HAS_PRODUCTION_DB_URL == 'true' && env.HAS_STAGING_DB_URL == 'true' }}
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
          PHOENIX_STAGING_DATABASE_URL: ${{ secrets.PHOENIX_STAGING_DATABASE_URL }}
        run: |
          set -o pipefail
          # The script writes nothing without --apply. Exit 2 means "drift found", which is NOT a
          # failure here — see the block comment at the top of this file.
          set +e
          node scripts/sync-staging-hr.mjs | tee drift.txt
          code=$?
          set -e
          {
            echo "### Staging HR drift"
            echo ""
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
            echo "summary=$(grep '^TOTAL:' drift.txt || echo 'staging has drifted')" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            # A real error (bad credentials, unreachable database) IS worth failing on: it means
            # the alarm itself is broken, which is the one state this workflow must not hide.
            echo "::error::the drift check could not run (exit $code)"
            exit "$code"
          fi

      # Shares this workflow rather than getting its own, for one reason: the expensive part of a
      # scheduled job here is `pnpm install --frozen-lockfile`, which this job already paid for.
      # A separate workflow would double that for a read-only query that takes seconds, and
      # Actions spend in this repo is the highest it has ever been (AGENTS.md §6).
      #
      # Like the drift check above it NEVER fails on a finding. Exit 2 means "schemas have
      # expired", which is the ordinary condition it exists to report — and a red suite on a
      # scheduled run withholds the production deploy of whatever commit is main HEAD when it
      # fires (AGENTS.md §2.3). Only a broken audit fails.
      - name: Backup schema retention (production, read only)
        id: retention
        if: ${{ env.HAS_PRODUCTION_DB_URL == 'true' && env.HAS_STAGING_DB_URL == 'true' }}
        env:
          PHOENIX_PRODUCTION_DATABASE_URL: ${{ secrets.PHOENIX_PRODUCTION_DATABASE_URL }}
        run: |
          set -o pipefail
          set +e
          node scripts/audit-backup-schemas.mjs | tee retention.txt
          code=$?
          set -e
          {
            echo "### Backup schema retention"
            echo ""
            echo '```'
            cat retention.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = "2" ]; then
            echo "::warning::Backup schemas have passed their retention window. The audit lists them and prints the drop statements; dropping is a human's job — production has no point-in-time recovery."
          elif [ "$code" != "0" ]; then
            echo "::error::the backup schema audit could not run (exit $code)"
            exit "$code"
          fi

      # EITHER path may have found the drift. Watching only `check` would have left the fallback
      # silent — a check that detects and never tells anybody is the same as no check.
      - name: Alert on drift
        if: ${{ always() && (steps.check.outputs.drifted == 'true' || steps.rest.outputs.drifted == 'true') }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          DRIFT_SUMMARY: ${{ steps.check.outputs.summary || steps.rest.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Staging HR drift found but no Telegram alert was sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. The drift is in the job summary."
            exit 0
          fi
          # 🔴 THE MESSAGE IS BUILT WITH printf, NOT WRITTEN AS A MULTI-LINE SHELL STRING.
          # The first version of this step embedded the newlines literally inside the quoted
          # `text=` argument, which put its continuation lines at COLUMN 0 while this `run: |`
          # block's content is indented ten spaces. A YAML block scalar ends at the first line
          # indented less than its parent, so the document became invalid at `${DRIFT_SUMMARY}`
          # — and an unparseable workflow is not a quiet no-op: GitHub registers it under its
          # PATH instead of its name and fails a run on EVERY push, whose red check suite makes
          # Railway withhold that commit's production deploy (AGENTS.md 2.3). Production sat on
          # one revision for over an hour on 2026-09-29 because of these seven lines.
          # Keep every line of this block indented; newlines belong in printf's format string.
          message=$(printf '%s\n%s\n\n%s\n\n%s\n\n%s\n' \
            "Staging HR data has drifted from production." \
            "${DRIFT_SUMMARY}" \
            "Staging is behind, so anything rehearsed there is running against a different company. Nothing has been changed automatically." \
            "Fix: node scripts/sync-staging-hr.mjs --apply" \
            "${RUN_URL}")
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${message}" > /dev/null
