name: Arm newly-declared cron jobs

# Closes the last manual step in shipping a cron. Merging a cron route arms NOTHING — cron-job.org is
# a third-party scheduler with no representation in this repo — so until now someone had to run
# `scripts/cronjob-sync.mjs --job <key> --apply` by hand, and it has been forgotten before. When a push
# to main ADDS an entry to the JOBS map in scripts/cronjob-sync.mjs, this arms exactly that new job.
#
# IT STAYS WITHIN cronjob-sync's OWN RULE. That script's header forbids a bulk sweep (the cron-job.org
# API allows 100 requests/day and a bulk edit cannot be rolled back) and says "resist the urge to add
# --all". This workflow never sweeps and never patches an existing job: scripts/cron-autoarm.mjs diffs
# the one file, takes only the keys ADDED on this push, and runs the sanctioned one-at-a-time
# `--job <key> --apply` for each. A changed schedule, or a job disabled by hand, is left alone.
#
# SECRETS. CRON_SECRET is already a repo Actions secret and is UPSTREAM of Railway
# (sync-railway-production-secrets.yml pushes it down), so it matches production; cronjob-sync's bearer
# check will confirm the length before it writes. CRONJOB_API_KEY must be added as an Actions secret
# (same value as Railway). Until it is, a push that adds a new job fails this run loudly with that
# message — a push that adds none stays green.
#
# NOT a required check: it runs after the merge, so it blocks no PR and gates no merge. The route is
# already shipped; this only winds its clock.
#
# 🔴 BUT A RED RUN HERE IS NOT HARMLESS, AND THIS COMMENT SAID IT WAS UNTIL 2026-10-06. It triggers on
# `push: main`, so its check SUITE lands on a commit Railway's "Wait for CI" is holding — and AGENTS.md
# §2.3 is unambiguous that ANY failed suite on that commit makes Railway mark the production deploy
# SKIPPED within minutes, permanently, with `ci.yml` itself green and nothing else to show for it.
# This job has no `continue-on-error` and is DESIGNED to fail loudly (see SECRETS above), so the shapes
# that fail it — CRONJOB_API_KEY unset, cron-job.org erroring, the 100-requests/day cap — each cost a
# production deploy on the one merge that adds a cron job. `tests/scheduled-alarms-never-withhold.test.ts`
# pins exactly this invariant, but its list covers `schedule:` workflows only, so nothing covers this
# one. The trade-off (a loud red here against a withheld deploy) is the owner's to settle; it is
# written down rather than quietly changed.

on:
  push:
    branches: [main]
    paths:
      - scripts/cronjob-sync.mjs

permissions:
  contents: read

# One arming at a time; never cancel a run that may already be creating a job.
concurrency:
  group: cron-autoarm
  cancel-in-progress: false

jobs:
  autoarm:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      # 🔴 SHA-PINNED, AND OFF NODE 20. This was the last workflow in the repository still on the tag
      # pins `actions/checkout@v4` and `actions/setup-node@v4`: both of those majors run on the
      # DEPRECATED Node 20 Actions runtime, which GitHub annotates on every run and will stop
      # executing. The pins below are copied verbatim from ci.yml — same SHAs, same `# v7` / `# v6`
      # comments — so there is one answer in this repo to "which checkout do we use", not two. A tag
      # is also a moving target: `@v4` is whatever that tag points at today, which is the supply-chain
      # reason every other workflow here is pinned to a commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # HEAD^ must be reachable to diff what this push introduced.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          # Node 20 is END OF LIFE. 24 is what CI_NODE_VERSION carries everywhere else here; this
          # workflow has no `env:` block of its own, so it is written out rather than referenced.
          node-version: "24"
          # 🔴 OFF, for secret-drift-check.yml's measured reason. `setup-node` defaults
          # `package-manager-cache` to true, goes looking for the repo's package manager and dies with
          # "Unable to locate executable file: pnpm" unless Corepack was enabled first. This job never
          # installs dependencies — scripts/cron-autoarm.mjs imports only `node:child_process` and
          # `node:url`, and shells out to scripts/cronjob-sync.mjs — so the cache is what goes, not a
          # Corepack step the job has no use for. Leaving the default on would fail the SETUP, which
          # on a push to `main` means a red suite on a commit Railway is waiting to deploy.
          package-manager-cache: false

      - name: Arm newly-declared cron jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          AUTOARM_BASE_SHA: ${{ github.event.before }}
        run: node scripts/cron-autoarm.mjs
