name: Configuration Drift Check
run-name: Configuration drift check

# Two questions, both about configuration that CHANGES WITHOUT ANY FILE CHANGING — which is exactly
# why neither had anything firing it:
#
#   1. Does production still hold the secrets it needs, in the shape it needs them, and NOT the ones
#      that would silently misdirect it?
#   2. Does AGENTS.md §2's required-check declaration still match what branch protection ACTUALLY
#      requires?
#
# 🔴 THE SECOND ONE WAS WIRED TO NOTHING AT ALL UNTIL 2026-10-01, WHICH IS WORSE THAN IT SOUNDS.
# AGENTS.md calls `scripts/check-required-checks.mjs` "the ONE thing that catches the next rotation"
# and admits in the same breath that "it runs when someone runs it". Across the whole repository its
# only mentions were its own `package.json` entry and a COMMENT in ci.yml. Meanwhile the list it
# guards has rotted FIVE times — 4 → 5 → 6 → 4 → 2 — and on 2026-09-17 a rotation left the unit
# suite outside protection for a day, so a red suite showed four green required checks and merged
# (#3950). A required check cannot do this job: reading protection needs network and auth, so it
# would have to fail open, and a gate that fails open is not a gate. Hence here, outside the gate.
#
# The two checks share this file because they share their defining property: **rotating a secret
# changes no file, and editing branch protection changes no file.** A path filter or a required check
# can never see either.
#
# WHY THIS EXISTS. `scripts/validate-railway-production-secrets.mjs` is a good check that could
# essentially never run. Its only caller was the last step of sync-railway-production-secrets.yml,
# whose `push` trigger is path-filtered to exactly two files — the workflow itself and the sync
# script. 🔴 **ROTATING A SECRET CHANGES NO FILE**, so the one moment the check matters is the one
# moment nothing fired it, and `git grep validate-railway -- .github package.json` returned a single
# line: that step. No schedule, no `ci.yml` step, no npm script.
#
# That is not theoretical. The shape rules it enforces exist because a MASKED PASTE of
# `OPENAI_API_KEY` — a value copied out of a dashboard with the middle replaced by dots — sat in
# Railway looking present and 401'd every AI feature in silence on 2026-09-02. The check that would
# have named it in one line was already written and simply never ran.
#
# This repo has a scheduled drift check for DEPLOYS, for MIGRATIONS, for STAGING and for the origin
# CERTIFICATES. It had none for secrets.
#
# 🔴 AND IT IS BUILT TO FINISH GREEN FROM THE FIRST COMMIT, WHICH IS THE POINT. A scheduled workflow
# attaches its check suite to whatever commit is `main` HEAD when it fires, and Railway's production
# trigger has Wait-for-CI on (`checkSuites: true`) — so ANY failed or cancelled suite on that commit
# marks its production deploy `inactive`, never `success`, permanently. Three deploys were lost that
# way on 2026-09-30. Adding a NINTH scheduled workflow that could go red would have paid for this
# check with the very thing it protects, so the finding is reported — annotation, job summary,
# Telegram — while the job concludes success. Same pattern as synthetic-journeys.yml and
# staging-hr-drift-check.yml, and pinned by tests/scheduled-alarms-never-withhold.yml's sibling test.

on:
  schedule:
    # Daily, deliberately off the shared :00/:15/:30/:45 firing minute and clear of the other crons
    # (03:23 and 10:23 digest, 05:00 staging, 05:17 certs, 07:00 migrations, 20:17 security scan).
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram alert and stop (proves the alarm still works)"
        type: boolean
        default: false

permissions:
  contents: read
  # 🔴 THERE IS NO `administration: read` HERE AND ONE CANNOT BE ADDED. Reading
  # `branches/main/protection/required_status_checks` requires repository-administration rights, and
  # `administration` is NOT one of the scopes a workflow `permissions:` block accepts — GitHub
  # answers `HTTP 422 … Unexpected value 'administration'` and refuses to parse the file at all.
  # Measured 2026-10-01 by dispatching this workflow on its own branch before merging it.
  #
  # So GITHUB_TOKEN can never read the gate here. The comparison below therefore runs on an account
  # PAT where one exists and otherwise SKIPS — loudly, as a ::warning:: that says the run proved
  # nothing. That degradation is deliberate and visible; what it must never do is look like a pass.

# Never cancel: a cancelled suite withholds a production deploy exactly as a red one does
# (AGENTS.md §2.3 — "red, cancelled, or still queued = no deploy").
concurrency:
  group: secret-drift-check
  cancel-in-progress: false

jobs:
  secret-drift-check:
    runs-on: ubuntu-latest
    # 🔴 EVERY `continue-on-error` STEP BELOW CARRIES ITS OWN `timeout-minutes`, AND THIS CEILING
    # SITS ABOVE THEIR SUM (2026-10-13). A JOB that hits its ceiling concludes `cancelled`, which
    # withholds that `main` commit's production deploy exactly as a failure does — and a timeout is
    # not a step failure, so `continue-on-error` cannot absorb it. A STEP that hits its own ceiling
    # fails only that step, which `continue-on-error` turns into a reported finding with the job
    # still green. Account and the two runs it cost: migration-drift-check.yml, above its job.
    # Pinned by tests/github-workflow-validity.test.ts.
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 FULL HISTORY, OR THE REQUIRED-CHECK COMPARISON IS PERMANENTLY TOOTHLESS.
          # `check-required-checks.mjs` refuses a bare OK when the checkout is behind `origin/main`,
          # and it measures that with git. The default shallow clone (`--depth=1`) has no usable
          # `origin/main` to measure against, so it reported "6117 commit(s) BEHIND" on a tree that
          # was current — which this workflow correctly downgrades to a warning, meaning EVERY run
          # would warn and no run could ever report a real rotation. Measured 2026-10-01 on run
          # 36784824805. The cost is one full fetch a day on a job that otherwise takes seconds.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # 🔴 OFF, AND THIS LINE IS WHY THIS WORKFLOW'S FIRST RUN FAILED. `setup-node` defaults
          # `package-manager-cache` to true, goes looking for the repo's package manager, and dies
          # with "Unable to locate executable file: pnpm" — because this job never installs
          # dependencies and so never enables Corepack. Every other workflow here has an
          # "Enable Corepack (pnpm)" step BEFORE setup-node; this one does not need pnpm at all
          # (the validator shells out through `npx`), so the cache is what had to go, not a
          # Corepack step it has no use for.
          #
          # It mattered more than a normal setup bug: this workflow is built to CONCLUDE SUCCESS on a
          # finding, precisely so its check suite can never withhold a production deploy. A failing
          # SETUP step is outside that guarantee by design — a broken check is not a finding — so the
          # job went red on its first dispatch (run 36772499136, 2026-09-30) and would have gone red
          # on every 06:41 UTC schedule, withholding whatever commit was `main` HEAD at the time. The
          # one alarm added to watch for silent breakage would have been silently breaking things.
          package-manager-cache: false

      # 🔴 continue-on-error PLUS AN id. A missing or malformed production secret is a FINDING to
      # report, not a reason to withhold somebody else's deploy. The setup steps above deliberately
      # have no such guard: a failed checkout means the CHECK is broken, which is not a finding.
      - name: Validate production secrets against Railway
        id: validate
        continue-on-error: true
        timeout-minutes: 4
        env:
          # Both names, so whichever kind of credential the owner minted works. RAILWAY_API_TOKEN is
          # an ACCOUNT token, RAILWAY_TOKEN a PROJECT token; an account token read as a project token
          # is rejected "Unauthorized", which reads like expiry and is not. The script picks the one
          # that arrived and blanks the other — true since 2026-09-30, when it learned to read both.
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_ENVIRONMENT: production
        run: |
          if [ -z "${RAILWAY_API_TOKEN}${RAILWAY_TOKEN}" ]; then
            echo "::warning::No Railway credential is configured, so production secrets went unchecked. Set RAILWAY_API_TOKEN (an account token) or RAILWAY_TOKEN (a project token) as a repository secret."
            exit 0
          fi
          node scripts/validate-railway-production-secrets.mjs

      # 🔴 THE HALF THAT NOTHING RAN. Same shape as the step above: a FINDING, reported, never a
      # reason to withhold somebody else's deploy.
      #
      # The script is safe to run anywhere by design — it SKIPS rather than failing when it cannot
      # reach the gate (no `gh`, unauthenticated, 403, 404) and exits 1 only on a reading it really
      # obtained. Two consequences this step has to handle, because the script cannot:
      #
      #   * A SKIP is exit 0, which in a workflow is indistinguishable from a pass. A run that never
      #     read protection proves nothing about protection, so it is surfaced as a ::warning::.
      #   * 🔴 A 404 is returned as a skip, and the script's own message says to "read that as an
      #     ALARM, not a skip" — a 404 means `main` may not be protected AT ALL, i.e. the worst case
      #     this alarm exists for, arriving silently. So it is escalated to a finding here.
      #
      # A scheduled run is also the one place this tool is never stale: it parses the WORKING TREE,
      # and its header records that a checkout from before a protection change prints a reassuring
      # `OK` against a gate that has already moved. `actions/checkout` on a schedule gives it the
      # current default branch every time, which is precisely the reading a laptop cannot be trusted
      # to produce.
      - name: Check the required-check declaration against the live gate
        id: required_checks
        continue-on-error: true
        timeout-minutes: 3
        env:
          # An account PAT first where one exists, since branch-protection reads are refused for some
          # token types; GITHUB_TOKEN with `administration: read` otherwise. If neither is accepted the
          # script skips and the warning below says so.
          GH_TOKEN: ${{ secrets.PHOENIX_ACTIONS_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # 🔴 `set +e` IS LOAD-BEARING. GitHub runs every `run:` block as `bash -e {0}`, so a
          # non-zero command substitution ABORTS THE STEP INSTANTLY — before `rc=$?` is assigned and
          # before anything is printed. Measured 2026-10-01 on run 36784499285: the step exited 1
          # with NO output, every branch below was skipped, and the alert fired describing a rotation
          # that had not happened. Under `-e` this whole script was decoration.
          set +e
          out=$(node scripts/check-required-checks.mjs 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"

          # 🔴 OK-BUT-STALE IS "I COULD NOT TELL", NOT "THE GATE MOVED". The script refuses a bare OK
          # when the checkout is behind `origin/main`, because a tree from before a protection change
          # matches the OLD gate and would print a reassuring pass. That is a correct refusal and it
          # exits non-zero — but treating it as drift raises a FALSE ALARM, and the owner's standing
          # rule is that a false positive is worse than a missed catch. A scheduled run checks out the
          # current default branch so it cannot happen there; a dispatch from a branch always can.
          if printf '%s' "$out" | grep -q 'OK-BUT-STALE'; then
            echo "::warning::the declared list MATCHES the live gate, but this checkout is behind origin/main, so the file compared is not the one on main. Not a rotation — a reading that cannot be trusted. A scheduled run reads the current default branch and does not hit this."
            exit 0
          fi

          # 🔴 ANCHORED TO THE SCRIPT'S OWN 404 LINE, NEVER A BARE SUBSTRING. This was
          # `grep -q '404'` over the WHOLE captured output — and that output always contains the
          # checkout's short SHA, from `[required-checks] checkout <sha> — …`. A short SHA is seven
          # hex characters, so roughly one tree in 500-1000 carries `404` somewhere in it (~0.1-0.2%
          # of runs), and on those runs this daily alarm declared `main` UNPROTECTED and told the
          # owner to MERGE NOTHING — on a healthy gate, from a commit id. A false alarm on a line this
          # loud is worse than a missed catch: the second time it cries wolf, the real one is ignored.
          #
          # The real 404 has exactly one spelling. `readProtectionContexts()` in
          # scripts/required-check-names.mjs returns
          # `{ skipped: 'protection returned 404 — main may not be protected at all …' }`, and
          # scripts/check-required-checks.mjs prints that as `[required-checks] SKIPPED — <why>.` at
          # the start of a line. Matching THAT, anchored, cannot be satisfied by a SHA, by a path, or
          # by a 404 quoted inside any other message — while a genuine missing protection still
          # escalates exactly as before. Pinned by tests/secret-drift-404-matcher.test.ts.
          if printf '%s\n' "$out" | grep -Eq '^\[required-checks\] SKIPPED — protection returned 404'; then
            echo "::error::branch protection returned 404 — \`main\` may not be protected AT ALL, which is the condition this check exists to find. The script reports a 404 as a SKIP so it stays runnable offline; this step escalates it deliberately. Read \`branches/main/protection\` by hand before merging anything."
            echo "gate_missing=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          if [ "$rc" -eq 0 ] && printf '%s' "$out" | grep -Eqi 'skipped|could not read|not authenticated|not on PATH'; then
            echo "::warning::the required-check comparison SKIPPED — it could not read branch protection, so this run says NOTHING about whether AGENTS.md §2 still matches the gate. The reason is in the output above; a green job here is not evidence."
            exit 0
          fi

          exit "$rc"

      # 🔴 THE THIRD LEG, SINCE 2026-10-23: THE DEPLOY SETTINGS RAILWAY STORES. Both railway.toml files were
      # retired that day, and the toml was re-applied at every deploy, so a dashboard edit used to snap back
      # on the next build. .railway/railway.ts is applied only by hand, so a dashboard edit now STAYS — the
      # cutover itself found the website's stored healthcheck window at 300 s against 900 s in every file.
      # scripts/check-railway-deploy-settings.mjs compares the healthcheck, the restart policy and every
      # volume mount per service. Exit 2 (it could not read) is a warning here, never a pass and never red.
      - name: Compare the deploy settings Railway stores with .railway/railway.ts
        id: deploy_settings
        continue-on-error: true
        timeout-minutes: 3
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: production
        run: |
          set +e
          node scripts/check-railway-deploy-settings.mjs
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::warning::the Railway deploy-settings comparison could NOT read Railway or the authoring file, so this run says NOTHING about whether the stored healthcheck, restart policy and disks still match .railway/railway.ts. The reason is in the output above."
            exit 0
          fi
          exit "$rc"

      # The durable record, written outside the check suite — the job's own conclusion is deliberately
      # no longer the signal, so this and the annotation are what a human scanning the run list sees.
      - name: Report a secret finding without withholding the deploy
        if: ${{ always() && steps.validate.outcome == 'failure' }}
        run: |
          {
            printf '## Production secret drift\n\n'
            printf 'The validator rejected production'"'"'s Railway variables. Read the failed step above for the exact names — they are never printed with their values.\n\n'
            printf 'Three classes it catches, and only the first is obvious:\n\n'
            printf '1. **Missing or malformed** — including a MASKED PASTE, a value copied from a dashboard with the middle replaced by dots. One of those sat in Railway looking present and 401''d every AI feature in silence for weeks.\n'
            printf '2. **Present but forbidden** — `PHOENIX_EMAIL_FORCE_TESTING`, `NOTIFICATION_TEST_MODE` and `PHOENIX_EMAIL_DELIVERY_MODE` redirect every employee email to test recipients, and `COMMIT_SHA` outranks the platform revision so a stale one makes every drift check report a version production is not running.\n'
            printf '3. **Present but wrong** — `APP_ENV` must read exactly `production`; anything else flips the app into test-delivery mode at the next deploy.\n\n'
            printf 'This job concludes **success on purpose**: a red suite here would withhold the production deploy of whatever commit happened to be `main` HEAD when the schedule fired.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Production secret validation FAILED. Read the step above for the variable names. This job still concludes success so the check suite cannot withhold a production deploy."

      - name: Report a required-check rotation without withholding the deploy
        if: ${{ always() && steps.required_checks.outcome == 'failure' }}
        run: |
          {
            printf '## Required-check drift\n\n'
            if [ "${{ steps.required_checks.outputs.gate_missing }}" = "true" ]; then
              printf '🔴 **Branch protection answered 404 — `main` may not be protected at all.** Read `branches/main/protection` by hand NOW, and merge nothing until it is understood. Every approval rule in AGENTS.md assumes `enforce_admins: true` and two required checks.\n\n'
            else
              printf '`AGENTS.md` §2 and the live gate DISAGREE. Read the failed step above for which names, and in which direction — they are not symmetrical:\n\n'
              printf '* **A name a doc states that protection does NOT require** → a session waits for a check that can never report. On 2026-09-27 nineteen places said "6 required checks" and a session following the ship skill sat waiting on three names that no longer existed.\n'
              printf '* **A name protection requires that no doc states** → a session counts passes to the wrong total and can read a PR as green while a required check is still pending. Quieter, and worse.\n\n'
            fi
            printf 'The list has rotted FIVE times (4 → 5 → 6 → 4 → 2), so the fix is never a number from a file. Read the protection API, then correct AGENTS.md §2 to match it.\n\n'
            printf 'This job concludes **success on purpose**: a red suite here would withhold the production deploy of whatever commit happened to be `main` HEAD when the schedule fired.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::The required-check declaration no longer matches branch protection. Read the step above. This job still concludes success so the check suite cannot withhold a production deploy."

      - name: Report deploy-settings drift without withholding the deploy
        if: ${{ always() && steps.deploy_settings.outcome == 'failure' }}
        run: |
          {
            printf '## Railway deploy-settings drift\n\n'
            printf 'A setting Railway stores for production no longer matches `.railway/railway.ts`. The failed step above names each one: the service, the field, the stored value and the file'"'"'s value.\n\n'
            printf 'Since the `railway.toml` files were retired (2026-10-23) nothing re-applies these at a deploy, so a dashboard edit stays until someone applies the authoring file. A shorter healthcheck window strands deploys behind the release gate; a detached disk turns every tablet app download into a 404.\n\n'
            printf 'Fix it in the file and apply it (docs/deployment.md, "The cutover, 2026-10-23"). Every apply needs the owner'"'"'s word.\n\n'
            printf 'This job concludes **success on purpose**: a red suite here would withhold the production deploy of whatever commit happened to be `main` HEAD when the schedule fired.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Railway's stored deploy settings no longer match .railway/railway.ts. Read the step above. This job still concludes success so the check suite cannot withhold a production deploy."

      # 🔴 GATED ON THE STEP OUTCOMES, NOT ON `failure()`. The job concludes success even on a finding,
      # so `failure()` is permanently false here — the naive version of this workflow would have been
      # silent, which is worse than the withheld deploy it avoids.
      - name: Notify Telegram on failure
        if: ${{ always() && (steps.validate.outcome == 'failure' || steps.required_checks.outcome == 'failure' || steps.deploy_settings.outcome == 'failure' || inputs.test_alert) }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_TEST: ${{ inputs.test_alert }}
          # Which of the two fired. The message must SAY — one that describes a secret problem when
          # the gate is what moved sends the reader to the wrong dashboard at 3am.
          SECRETS_FAILED: ${{ steps.validate.outcome == 'failure' }}
          CHECKS_FAILED: ${{ steps.required_checks.outcome == 'failure' }}
          SETTINGS_FAILED: ${{ steps.deploy_settings.outcome == 'failure' }}
          GATE_MISSING: ${{ steps.required_checks.outputs.gate_missing }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. A configuration finding went UNDETECTED-BY-A-HUMAN, which is the condition this step exists to prevent."
            exit 0
          fi
          # 🔴 EVERY MESSAGE IS BUILT WITH printf AND \n, NEVER A LITERAL MULTI-LINE SHELL STRING.
          # A continuation line starting at column 0 inside this `run: |` block TERMINATES the YAML
          # scalar, and GitHub then refuses the whole file — which stops the alarm silently, the exact
          # failure this workflow exists to prevent. The first draft of this step did it and was caught
          # by grepping for column-0 lines, not by the regex test that guards these alarms.
          SECRET_TEXT=$(printf 'PRODUCTION SECRET DRIFT\n\nThe validator rejected production'"'"'s Railway variables: one is missing, malformed (a masked paste reads as present), forbidden (the three email-redirect flags, or a stale COMMIT_SHA that fakes the served revision), or holds a wrong value (APP_ENV must be exactly "production").\n\nThe run page names the variables. Values are never printed.\n\nNothing is broken YET — this is the check that used to be unable to fire, because rotating a secret changes no file and nothing else ran it.')

          if [ "$GATE_MISSING" = "true" ]; then
            CHECKS_TEXT=$(printf 'BRANCH PROTECTION MAY BE GONE\n\nReading main'"'"'s required checks answered 404. That can mean main is not protected at all — no required checks, no enforce_admins — and every approval rule in AGENTS.md assumes it is.\n\nMERGE NOTHING until you have read branches/main/protection by hand.')
          else
            CHECKS_TEXT=$(printf 'REQUIRED-CHECK ROTATION\n\nAGENTS.md section 2 and the live branch protection no longer agree on which checks gate main.\n\nWhy it matters in both directions: a name the docs state but protection does not means a session waits for a check that can never report; a name protection requires but no doc states means a session counts passes to the wrong total and can read a PR as green while a required check is still pending.\n\nThat list has rotted five times. The run page names which, and in which direction.')
          fi

          if [ "$IS_TEST" = "true" ]; then
            TEXT=$(printf 'ALERT SELF-TEST (not an incident)\n\nSomeone ran the configuration drift check with the test flag to confirm this channel still works.\n\nIf you are reading this, a real production secret finding, a required-check rotation or Railway deploy-settings drift would also reach you.\n\n%s' "$RUN_URL")
          else
            # Each leg that fired adds its own section, so the message names every finding and nothing else.
            SETTINGS_TEXT=$(printf 'RAILWAY DEPLOY SETTINGS DRIFT\n\nA setting Railway stores for production (the healthcheck, the restart policy or a disk mount) no longer matches .railway/railway.ts. Since the railway.toml files were retired on 23 Oct nothing re-applies them at a deploy, so a dashboard edit stays.\n\nThe run page names the service, the field and both values.')
            BODY=""
            COUNT=0
            for leg in SECRETS CHECKS SETTINGS; do
              case "$leg" in
                SECRETS) fired="$SECRETS_FAILED"; section="$SECRET_TEXT" ;;
                CHECKS) fired="$CHECKS_FAILED"; section="$CHECKS_TEXT" ;;
                SETTINGS) fired="$SETTINGS_FAILED"; section="$SETTINGS_TEXT" ;;
              esac
              [ "$fired" = "true" ] || continue
              COUNT=$((COUNT + 1))
              if [ -z "$BODY" ]; then BODY="$section"; else BODY=$(printf '%s\n\n---\n\n%s' "$BODY" "$section"); fi
            done
            if [ "$COUNT" -gt 1 ]; then
              TEXT=$(printf '%s CONFIGURATION FINDINGS\n\n%s\n\n%s' "$COUNT" "$BODY" "$RUN_URL")
            else
              TEXT=$(printf '%s\n\n%s' "$BODY" "$RUN_URL")
            fi
          fi
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). The secret finding reached nobody. Response: $(cat /tmp/tg-response.json 2>/dev/null | head -c 500)"
            exit 1
          fi
          echo "Telegram alert delivered."
