name: Phoenix MCP security
on:
  pull_request:
    # The reader bundles these Phoenix policy files, so a change to one must re-run this check.
    #
    # 🔴 THIS LIST IS NOT THE COVERAGE OF THE BUNDLE'S SECURITY ASSERTION, AND READING IT THAT WAY
    # COST A SILENTLY RED `main` (23 Oct 2026). The five files named below are the ones the reader
    # imports BY NAME; the graph they pull in is most of `src/lib/`, so a change anywhere outside
    # these nine paths can retain an administrative loader in the bundle without this workflow ever
    # running — #6297 did exactly that, and `mcp-security` is not one of `main`'s required checks, so
    # nothing blocked. `ci.yml`'s `static` job therefore runs `node build.mjs` on EVERY pull request
    # and every push to `main`, which is what gates the assertion; this workflow is the deeper,
    # narrower pass (cold typecheck, isolated PostgreSQL fixture, dependency audit) and stays scoped
    # to the paths where that depth earns its minutes. Do not delete the step in `static` on the
    # grounds that this workflow already covers it.
    paths:
      - 'infra/phoenix-mcp/**'
      - 'src/lib/mcp-source/**'
      - 'app/api/mcp-source/**'
      - '.github/workflows/phoenix-mcp.yml'
      - 'src/lib/auth/permissions.ts'
      - 'src/lib/auth/session-lifecycle.ts'
      - 'src/lib/employees/employee-directory.ts'
      - 'src/lib/reports/organogram.ts'
      - 'src/lib/sales/monthly-closing-portal.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-security:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Locate isolated PostgreSQL fixture binaries
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Install only the isolated integration dependencies
        working-directory: infra/phoenix-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cold typecheck
        working-directory: infra/phoenix-mcp
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json
      - name: Synthetic security and protocol tests
        working-directory: infra/phoenix-mcp
        run: npm test
      - name: Audit isolated runtime dependencies
        working-directory: infra/phoenix-mcp
        run: npm audit --omit=dev --audit-level=high
