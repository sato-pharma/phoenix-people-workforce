name: Phoenix MCP security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Locate isolated PostgreSQL fixture binaries
        run: echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Install only the isolated integration dependencies
        working-directory: infra/phoenix-mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cold typecheck
        working-directory: infra/phoenix-mcp
        run: node node_modules/typescript/bin/tsc --noEmit --incremental false -p tsconfig.json
      - name: Synthetic security and protocol tests
        working-directory: infra/phoenix-mcp
        run: npm test
      - name: Audit isolated runtime dependencies
        working-directory: infra/phoenix-mcp
        run: npm audit --omit=dev --audit-level=high
