name: Security Scan (OSS)

# Secret scanning for this repository.
#
# GitHub Advanced Security (native secret scanning + push protection) is not purchasable here:
# This repository's owner is a personal User account, and GHAS is only sold to Team/Enterprise Cloud accounts
# (confirmed 2026-07-25, re-confirmed 2026-07-26 after the transfer, and again 2026-08-08 —
# repos/{owner}/{repo} still returns security_and_analysis: null). So this workflow is not a
# belt-and-braces extra: it is the ONLY automated secret detection on a private repo that holds
# production Supabase service-role keys, the Resend API key, ATTENDANCE_AGENT_TOKEN, and a
# workflow that syncs Railway production secrets. A merge to main deploys to production within
# minutes, so a committed key ships before anyone reads the diff — and this repo has committed a
# secret before (a shared passphrase sat in a committed file until 2026-07-31).
#
# Restored 2026-08-08 after #1889 removed the whole file. That PR also dropped the Semgrep
# sast-scan job, which was left out at the time because Semgrep took 4m14s per PR against
# gitleaks' 13s, and a hosted code-quality scanner was covering overlapping ground.
#
# BOTH HALVES OF THAT ARE NOW SETTLED, 2026-09-08. The hosted scanner was removed entirely at the
# owner's instruction, which briefly left this repo with NO static application security testing at
# all — gitleaks finds secrets, not vulnerabilities, and `lint`/`typecheck` are not security
# analysis. Semgrep is restored below to close that, but on the daily schedule and on demand rather
# than per-PR, which is what makes it affordable. The cost reasoning is on the sast-scan job.
#
# So this file now holds BOTH halves: secret-scan and sast-scan. NEITHER runs on a pull request any
# more — secret-scan's trigger was removed 2026-09-29 (the `on:` block records why: the scan moved
# onto the machine, into bash-guard.mjs clause C12) and sast-scan never had one. An older version of
# this line said secret-scan "blocks every PR"; it does not, and a session reading that would believe
# a PR gate exists where none does. Read each job's own header before changing when it fires.
#
# 🔴 BOTH JOBS REPORT A FINDING AND STILL CONCLUDE SUCCESS (2026-09-30). Each scanning step carries
# `continue-on-error`, because every run of this workflow is now scheduled or dispatched and its check
# suite therefore lands on whatever commit is `main` HEAD — and Railway withholds that commit's
# production deploy for ever when ANY suite on it fails or is cancelled (which is also why
# `cancel-in-progress` is now false). The full account sits above `Scan for secrets`; the rule is
# staging-hr-drift-check.yml's — "NEITHER STEP MAY FAIL ON A FINDING … Only a BROKEN check fails."
# Both Telegram alerts are gated on their step's outcome rather than on `failure()`, which is what
# keeps the alarms alive once the jobs go green, and secret-scan HAS an alert now: it had none at all
# between 2026-09-29 and 2026-09-30.
#
# 🔴 NO LONGER BLOCKING, AND THIS PARAGRAPH USED TO CLAIM THE OPPOSITE TEN LINES ABOVE THE BLOCK THAT
# CONTRADICTED IT. It said "NOW BLOCKING … the gate can be real from the start", which was true when
# `--exit-code 0` was removed (the original rolled out unable to fail no matter what it found — 40
# consecutive green runs that proved nothing, findings going to an artifact nobody opened). Two things
# have happened since, and together they mean this job gates nothing at all:
#
#   2026-09-29  demoted from branch protection AND taken off `pull_request` in the same change, so it
#               neither blocks nor even reports on a PR. gitleaks moved into `bash-guard.mjs` clause
#               C12, which refuses the push instead — earlier and closer to the author.
#   2026-09-30  the scanning steps gained `continue-on-error`, so a finding is REPORTED and the job
#               still concludes success — because a red suite here withholds the production deploy of
#               whatever commit is `main` HEAD when the schedule fires.
#
# 🔴 SO NOTHING STOPS A SECRET AT THE MERGE, AND THAT IS THE POINT TO CARRY AWAY: this is a detector,
# not a gate. If it fires, treat it as a live credential exposure — ROTATE the key first, then scrub
# it; a secret that reached the remote must be considered compromised even after the commit is
# removed — and do not assume the finding was caught before the code shipped, because it was not.
#
# 🔴 IT READS THE GIT HISTORY TOO, SINCE 2026-10-26. Until then secret-scan ran `--no-git` over the
# checked-out tree only, so a key committed and deleted in a later commit — still in the remote for
# ever, on its branch, its pull-request head or a backup ref — was invisible to the only automated
# secret detection this repository has. It now runs two legs: the tree, and every commit on every ref
# GitHub holds. The first full-history scan read 17,066 commits in about 90 seconds and found 34 hits,
# none of them a live credential: 13 were environment-variable NAMES (now allowlisted in
# `.gitleaks.toml`) and the other 21 are listed one by one in `.gitleaksignore`, the history baseline.
# The same change narrowed `.gitleaks.toml`'s code-identifier allowlist, which had hidden ANY
# alphanumeric value written after `key:` — a real `api_key: "<random>"` used to scan clean.

on:
  # 🔴 NOT ON pull_request SINCE 2026-09-29, AND NOT BECAUSE SECRET SCANNING WAS DROPPED.
  # It moved EARLIER, onto the machine: bash-guard.mjs clause C12 runs the same gitleaks 8.30.1 over
  # the commits a `git push` would send, and refuses the push. A key therefore never reaches GitHub
  # at all — where, once pushed, it is in the remote history whatever a PR check says afterwards,
  # and the remedy is rotation rather than a revert.
  #
  # WHY IT MOVED: the job took ~23s and billed a FULL minute on each of ~186 PR runs a day, because
  # GitHub rounds every job up. The scan was never the cost; the rounding was. `secret-scan` was
  # dropped from the required checks in the same change — a required check that no longer runs on
  # PRs leaves every one of them stuck on "Expected — waiting for status" and nothing can merge.
  #
  # The daily run below is unchanged and is the backstop for anything that arrives another way (a
  # push from a machine without the hook, a web edit, a merge of someone else's branch).
  #
  # 🔴 WHEN IT IS REQUESTED IS NOT WHEN IT RUNS, AND WHEN IT RUNS HOLDS A DEPLOY. GitHub starts this cron
  # 4½–9½ hours after the minute asked for (measured 5–16 Oct 2026 on requests made between 03:23 and 10:23
  # UTC), and the Semgrep step alone runs ~9½ minutes. A run attaches a check suite to whatever commit is
  # `main` HEAD when it starts, and Railway's Wait for CI holds that commit's deploy until the suite ends — on
  # 16 Oct a 05:17 UTC request started at 09:45 UTC (12:45 Cairo) and held a deploy 9 minutes. Merges to
  # `main` are quietest 04:00–07:00 Cairo (about 1 an hour, against 2–3.8 an hour from noon to 03:00), so the
  # request is moved to 20:17 UTC: if the lateness is relative to the request, as measured, the run starts
  # 00:47–05:47 UTC (03:47–08:47 Cairo). UNPROVEN for this request time — read `gh run list --workflow
  # security-scan.yml` after a few days, and if it still starts after 08:00 UTC the delay is not relative and
  # the fix is a cron-job.org dispatch at a chosen quiet minute. Account: docs/deployment.md, "A slow day is
  # measured from the build log".
  schedule:
    - cron: "17 20 * * *" # daily 20:17 UTC (23:17 Cairo), requested early on purpose — see above
  workflow_dispatch:

# 🔴 cancel-in-progress WENT FALSE ON 2026-09-30, AND IT IS THE SAME RULE AS THE `continue-on-error`
# ON THE TWO SCANNING STEPS BELOW. A CANCELLED check suite withholds a production deploy exactly as a
# red one does (AGENTS.md §2.3: "red, cancelled, or still queued = no deploy"), and since this
# workflow no longer runs on pull_request its runs are scheduled or dispatched — so its suite lands on
# whatever commit is `main` HEAD at the time, never on a PR head. Cancelling one therefore cost that
# commit its production deploy, silently, with nothing turning red. There was little to supersede
# anyway: the daily run is once a day, and a dispatch fired against a branch is a different `github.ref`
# and so a different concurrency group already.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # read this workflow own past runs, to count the failure streak

env:
  GITLEAKS_VERSION: "8.30.1"
  SEMGREP_VERSION: "1.171.0"

jobs:
  # Every `runs-on` in this repository is the literal `ubuntu-latest` (2026-10-19, owner: "make all ci
  # actions to be on github"). It used to be a computed expression that could send a pull request to the
  # self-hosted Hetzner box; the box is retired and tests/ci-runner-switch.test.ts now pins the literal in
  # every workflow file, so a computed or self-hosted label cannot quietly come back.
  #
  # NOTE: `secret-scan` is not a required check — it was demoted from branch protection on 2026-09-29 and
  # taken off `pull_request` in the same change; gitleaks runs in `bash-guard.mjs` C12 before a push.
  secret-scan:
    runs-on: ubuntu-latest
    # 🔴 EVERY `continue-on-error` STEP BELOW CARRIES ITS OWN `timeout-minutes`, AND THIS CEILING
    # SITS ABOVE THEIR SUM (2026-10-13). A JOB that hits its ceiling concludes `cancelled`, which
    # withholds that `main` commit's production deploy exactly as a failure does — and a timeout is
    # not a step failure, so `continue-on-error` cannot absorb it. A STEP that hits its own ceiling
    # fails only that step, which `continue-on-error` turns into a reported finding with the job
    # still green. Account and the two runs it cost: migration-drift-check.yml, above its job.
    # Pinned by tests/github-workflow-validity.test.ts.
    #
    # 30 since 2026-10-26: the legs budget 6 (tree) + 12 (history) + 3 (Telegram) = 21, and the test
    # wants five minutes of setup above that.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The CLI is installed directly, with a pinned version and checksum, rather than via the
      # marketplace Action: gitleaks-action went proprietary at v2.0.0 (still free for
      # personal-account repos, but the CLI binary carries no such caveat) and this avoids
      # depending on a third-party Action's own supply chain.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # --no-git: this leg reads the checked-out working tree as plain files — what `main` holds
      # today. A secret added and later removed is not in the tree; the next step, which reads every
      # commit on every ref, is the leg that catches it (2026-10-26 — until then nothing did).
      #
      # --redact: findings are reported by rule, file and line, never with the secret value, so
      # the run log and the summary below can never themselves become the leak.
      #
      # 🔴 continue-on-error PLUS AN id (added 2026-09-30), AND THIS IS THE ACCOUNT FOR BOTH SCANNING
      # STEPS IN THIS FILE. gitleaks and Semgrep both only READ the checked-out tree — the SARIF goes
      # to an artifact and nothing is written anywhere — so the only effect these steps had on the
      # world besides their annotations was their exit code, and that exit code was expensive. This
      # workflow has not run on pull_request since 2026-09-29, so every run is scheduled or dispatched
      # and its check suite attaches to whatever commit is `main` HEAD at the time. Railway's
      # production deployment trigger has Wait-for-CI on (`checkSuites: true`, read live off the
      # trigger 2026-09-30), so ANY failed or cancelled suite on that commit marks its production
      # deploy `inactive` — never `success`, permanently, within seconds of the suite concluding, with
      # `ci.yml` fully green. Three production deploys were lost that way on 2026-09-30.
      #
      # So a committed-secret finding cost a production deploy to announce itself. That is backwards
      # twice over: a leaked key needs ROTATION by a human, which no red check performs, and blocking
      # the deploy pipeline is exactly the wrong thing to do while somebody is trying to ship the
      # scrub. The rule is already written in staging-hr-drift-check.yml's header: "NEITHER STEP MAY
      # FAIL ON A FINDING … Only a BROKEN check fails."
      #
      # 🔴 WHERE THE FINDING/BROKEN LINE FALLS HERE, PRECISELY, BECAUSE IT IS NOT WHERE YOU WOULD
      # GUESS. `Check out repository` and `Install gitleaks` above deliberately keep NO
      # `continue-on-error`: a failed download means nothing was measured at all, and a job that
      # concluded success on that is the silent-green this file exists to prevent. Inside this step,
      # however, the SCAN_STATUS guard's "gitleaks ran and produced nothing" case is now reported
      # rather than thrown, exactly like a finding — it still `exit 1`s, so the STEP shows red and
      # both the report step and the Telegram alert below fire on it (they key on this step's
      # outcome, which does not distinguish the two). That is deliberate: a scan that did not run
      # must reach a human, and it does, but it must not be able to withhold a deploy either.
      # If the two ever need to be told apart, split them into two steps rather than removing
      # `continue-on-error` from this one.
      - name: Scan for secrets (gitleaks)
        id: gitleaks
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -euo pipefail
          set +e
          ./gitleaks detect \
            --source . \
            --no-git \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif
          SCAN_STATUS=$?
          set -e

          COUNT=$(jq '[.runs[]?.results[]?] | length' gitleaks-report.sarif)
          {
            echo "### Secret scan (gitleaks v${GITLEAKS_VERSION})"
            echo "Findings: **${COUNT}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::gitleaks found ${COUNT} potential secret(s). ROTATE the credential first — anything pushed to the remote must be treated as compromised — then remove it from the tree. See the gitleaks-report artifact for rule, file and line (values are redacted)."
            exit 1
          fi

          # A non-zero exit with zero findings means gitleaks itself failed (bad config, unreadable
          # tree). Fail rather than report a clean scan that never actually ran.
          if [ "$SCAN_STATUS" -ne 0 ]; then
            echo "::error::gitleaks exited ${SCAN_STATUS} without producing findings — the scan did not run correctly. Not reporting this as clean."
            exit 1
          fi

      # ── THE HISTORY LEG (2026-10-26) ──────────────────────────────────────────────────
      # The tree leg above cannot see a key that was committed and then deleted: it is gone from the
      # tree and still in the remote — on its branch, on the pull request's head ref (GitHub keeps
      # `refs/pull/<n>/head` after the branch is deleted) and on any `refs/backups/*`. This leg reads
      # every one of them.
      #
      # The checkout above stays at depth 1, so the fetch below is this leg's whole extra cost, and it
      # is paid INSIDE the leg's budget on purpose: a slow or failed fetch is then REPORTED like a
      # finding — the alert fires, saying the history half did not run — instead of failing the job,
      # which would withhold the production deploy (see above `Scan for secrets`).
      # `+refs/*:refs/mirror/*` takes every ref GitHub serves — branches, tags, pull-request heads,
      # backups and rescues — into a namespace of its own, so nothing collides with the checkout, and
      # `--log-opts="--all"` walks all of them.
      #
      # `.gitleaksignore` at the repo root is the history baseline: harmless findings in OLD commits,
      # each named by commit, file, rule and line, so the same text in any new commit is still
      # reported. gitleaks reads it and `.gitleaks.toml` from the scanned folder by itself.
      #
      # Measured 26 Oct 2026 on a full mirror of this repository: 17,066 commits, 378 MB of patches,
      # 67–93 seconds.
      - name: Scan git history for secrets (gitleaks)
        id: gitleaks_history
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          UNSHALLOW=""
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then UNSHALLOW="--unshallow"; fi
          if ! git fetch --quiet --no-tags $UNSHALLOW origin '+refs/*:refs/mirror/*'; then
            echo "### Secret scan of the git history" >> "$GITHUB_STEP_SUMMARY"
            echo "Not run: the history could not be fetched." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The git history could not be fetched, so the history half of the secret scan did not run. Not reporting this as clean."
            exit 1
          fi
          COMMITS=$(git rev-list --all --count)
          REFS=$(git for-each-ref refs/mirror | wc -l)

          set +e
          ./gitleaks git . \
            --log-opts="--all" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-history-report.sarif
          SCAN_STATUS=$?
          set -e

          # No report at all is a scan that never ran (the binary died before writing it). Say so in
          # the summary rather than leave `jq` to fail the step with no word of why.
          if [ ! -s gitleaks-history-report.sarif ]; then
            echo "### Secret scan of the git history" >> "$GITHUB_STEP_SUMMARY"
            echo "Not run: gitleaks exited ${SCAN_STATUS} and wrote no report." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::gitleaks exited ${SCAN_STATUS} on the git history and wrote no report, so the history half of the secret scan did not run. Not reporting this as clean."
            exit 1
          fi

          COUNT=$(jq '[.runs[]?.results[]?] | length' gitleaks-history-report.sarif)
          {
            echo "### Secret scan of the git history (gitleaks v${GITLEAKS_VERSION})"
            echo "Read ${COMMITS} commits on ${REFS} refs."
            echo "Findings: **${COUNT}**"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::gitleaks found ${COUNT} potential secret(s) in the git history. ROTATE the credential first — a key in any commit on the remote is compromised even if no branch shows it any more — then decide the history. A finding read and proven harmless goes into .gitleaksignore by its fingerprint, never before it is read. See the gitleaks-report artifact for commit, file and line (values are redacted)."
            exit 1
          fi

          # The same guard as the tree leg: a non-zero exit with no findings is a scan that did not run.
          if [ "$SCAN_STATUS" -ne 0 ]; then
            echo "::error::gitleaks exited ${SCAN_STATUS} on the git history without producing findings — the scan did not run correctly. Not reporting this as clean."
            exit 1
          fi

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.sarif
            gitleaks-history-report.sarif
          retention-days: 14

      # The durable record, written OUTSIDE the check suite's verdict — a job summary a human can read
      # on the run page, since the job's own conclusion is deliberately no longer the signal.
      #
      # It must ALWAYS exit 0. Its `::error::` puts an annotation on the run page, which is a UI
      # signal and not a conclusion. The finding count itself is already in the scanning step's own
      # summary block; what this adds is the ORDER OF OPERATIONS, which is the part that gets wrong at
      # 4am: rotate first, scrub second. A key that reached the remote is compromised whatever the
      # tree looks like afterwards.
      - name: Report the secret-scan finding without withholding the deploy
        if: ${{ always() && (steps.gitleaks.outcome == 'failure' || steps.gitleaks_history.outcome == 'failure') }}
        env:
          TREE_OUTCOME: ${{ steps.gitleaks.outcome }}
          HISTORY_OUTCOME: ${{ steps.gitleaks_history.outcome }}
        run: |
          set -uo pipefail

          {
            printf '## Secret scan finding\n\n'
            printf 'Working tree: **%s** · Git history: **%s**\n\n' "$TREE_OUTCOME" "$HISTORY_OUTCOME"
            printf 'gitleaks either found something or did not run — read the failed scanning step above, which prints the count and the reason.\n\n'
            printf '**ROTATE THE CREDENTIAL FIRST.** Anything pushed to the remote must be treated as compromised, and removing the commit does not undo that. Scrub the tree second. A finding in the history that is read and proven harmless goes into `.gitleaksignore` by its fingerprint. The `gitleaks-report` artifact on this run carries rule, commit, file and line, with values redacted.\n\n'
            printf 'This job concludes **success on purpose**. A failed or cancelled check suite on `main` HEAD makes Railway withhold that commit'"'"'s production deploy permanently — never `success`, seconds after the suite concludes, with `ci.yml` green — so an alarm that went red would block the very pipeline somebody needs in order to ship the scrub. The finding is in the failed step above, in the annotation, and in the Telegram alert.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Secret scan finding — ROTATE the credential first, then scrub the tree. Read the failed scanning step above. This job still concludes success so its check suite cannot withhold a production deploy."

      # ── THE ALARM THIS JOB NEVER HAD ──────────────────────────────────────────────────
      # 🔴 ADDED 2026-09-30, BECAUSE UNTIL TODAY A SCHEDULED SECRET-SCAN FINDING REACHED NOBODY AT
      # ALL. The sast-scan job below carries this step and this job did not, and the comment that
      # justified the asymmetry said secret-scan "runs on pull_request, where GitHub notifies on the
      # PR". That was true when it was written and went STALE on 2026-09-29, when the `pull_request`
      # trigger was removed from this workflow (see the `on:` block's own note — the scan moved onto
      # the machine, into bash-guard.mjs clause C12). From that day this job ran ONLY on schedule and
      # dispatch, and a schedule-triggered failure notifies nobody by construction: GitHub emails the
      # run author, and a cron run has none. So the only automated secret detection on a private repo
      # holding production service-role keys had no way of telling anyone what it found.
      #
      # That is not a hypothetical shape in this repository. migration-drift-check.yml detected six
      # anon-readable tables on 2026-08-06 and repeated it on 08-07 and 08-08 with every run red, and
      # it was found on 08-09 by an unrelated manual audit — three days and 412 exposed customer names
      # later — for exactly this reason. sast-scan's own header records the same thing costing eight
      # days in September.
      #
      # Copied from sast-scan's step below rather than invented, so the three hard-won constraints it
      # carries travel with it: NO parse_mode (a lone underscore once returned HTTP 400 and lost the
      # whole message), capture the BODY and not just the status (a silent non-2xx once reported
      # success while delivering nothing), and continue-on-error PLUS exit 1 (a Telegram outage must
      # never mask or manufacture a security verdict, but a broken alarm must never look healthy).
      #
      # 🔴 GATED ON THE STEP OUTCOME, NOT ON `failure()`. The scanning step carries
      # `continue-on-error`, so this job concludes success even when it finds a secret and `failure()`
      # is permanently false — a `failure()` gate here would have arrived stillborn.
      - name: Notify Telegram on failure
        if: ${{ always() && (steps.gitleaks.outcome == 'failure' || steps.gitleaks_history.outcome == 'failure') }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          WF_FILE: security-scan.yml
          TREE_OUTCOME: ${{ steps.gitleaks.outcome }}
          HISTORY_OUTCOME: ${{ steps.gitleaks_history.outcome }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. The secret scan FAILED and reached nobody, which is the condition this step exists to prevent."
            exit 0
          fi
          # The streak reads a STEP, not the run's conclusion, and it must: this job concludes success
          # on a finding now, so `.conclusion == "failure"` is permanently false and the number would
          # pin itself at 1 for ever. The report step it asks about is THIS job's, and it is named
          # differently from sast-scan's on purpose — both jobs live in this one workflow file, so a
          # shared step name would make each job count the other's findings as its own.
          #
          # Scoped to the same event so a manual dispatch cannot reset a nightly streak; counting
          # every event once hid a 21-night run at "6". Best-effort by construction: any failure here
          # leaves the line out rather than breaking the alert, and it BREAKS on the first clean run,
          # so the normal case is one extra API call.
          STREAK_LINE=""
          REPORT_STEP="Report the secret-scan finding without withholding the deploy"
          RUNS=$(gh api "repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50&status=completed&event=${EVENT}" --jq '.workflow_runs[] | [(.id|tostring), .created_at] | join(" ")' 2>/dev/null || true)
          if [ -n "$RUNS" ]; then
            STREAK=1
            FIRST_SEEN=""
            while read -r rid rdate; do
              [ -z "$rid" ] && continue
              [ "$rid" = "$RUN_ID" ] && continue
              # 🔴 `jq --arg` THROUGH A PIPE, NEVER `gh api --jq --arg` — `gh api` HAS NO `--arg` FLAG.
              # `gh api --jq` takes a single query string and nothing else, so `--jq --arg s "$X" '<query>'`
              # makes gh read `--arg` as the query and then choke on three extra positional arguments. The
              # command fails, `|| true` swallows it, `rconc` is empty, and the streak breaks at 1 on EVERY
              # run — silently, for ever. That is precisely the invisible-streak defect this block exists to
              # prevent, reintroduced by the fix for it. Confirmed against `gh api --help` 2026-09-30: the
              # flags are --cache, -F, -H, --hostname, -i, --input, -q/--jq, -X, --paginate, -p, -f, --silent,
              # --slurp, -t, --verbose. No --arg. Pipe to real jq instead, which does have it; jq is
              # preinstalled on ubuntu-latest and every other step in this file already relies on that.
              rconc=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs" 2>/dev/null | jq -r --arg s "$REPORT_STEP" '[.jobs[]?.steps[]? | select(.name == $s)] | .[0].conclusion // "absent"' 2>/dev/null || true)
              [ -z "$rconc" ] && rconc="absent"
              if [ "$rconc" != "skipped" ] && [ "$rconc" != "absent" ] && [ -n "$rconc" ]; then
                STREAK=$((STREAK + 1))
                FIRST_SEEN="$rdate"
              else
                break
              fi
            done <<< "$RUNS"
            if [ "$STREAK" -gt 1 ]; then
              STREAK_LINE=$(printf 'Consecutive failure #%s' "$STREAK")
              if [ -n "$FIRST_SEEN" ]; then
                STREAK_LINE=$(printf '%s, first seen %s' "$STREAK_LINE" "${FIRST_SEEN%%T*}")
              fi
              STREAK_LINE=$(printf '%s. A climbing number means nobody is acting on this.' "$STREAK_LINE")
            fi
          fi
          HEADER='SECRET SCAN FAILED (gitleaks)'
          # Which half went red, in plain words, so the alert's second line says where to look.
          if [ "$TREE_OUTCOME" = "failure" ] && [ "$HISTORY_OUTCOME" = "failure" ]; then
            WHERE='Both halves: the files on main AND the git history.'
          elif [ "$HISTORY_OUTCOME" = "failure" ]; then
            WHERE='The git history (old commits, pull-request heads, backups). The files on main are clean.'
          else
            WHERE='The files on main. The git history is clean.'
          fi
          HEADER=$(printf '%s\n%s' "$HEADER" "$WHERE")
          [ -n "$STREAK_LINE" ] && HEADER=$(printf '%s\n%s' "$HEADER" "$STREAK_LINE")
          TEXT=$(printf '%s\n\nThe daily secret scan over main is red. This is the ONLY automated secret detection on this repository - GitHub Advanced Security is not purchasable on a personal account - and this repository works with production Supabase service-role keys.\n\nROTATE FIRST, SCRUB SECOND. A key that reached the remote is compromised whatever the tree looks like afterwards; removing the commit does not undo it.\n\nIt is either a real finding or a scan that did not run. Open the run, read the Findings count, and take the gitleaks-report artifact for rule, commit, file and line (values are redacted).\n\n%s' "$HEADER" "$RUN_URL")
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). The secret scan result reached nobody. Response: $(cat /tmp/tg-response.json 2>/dev/null | head -c 500)"
            exit 1
          fi
          echo "Telegram alert delivered."

  # SAST. Restored 2026-09-08 at the owner's instruction, after the hosted code-quality scanner
  # that had been covering this ground was removed the same day, leaving the repo with no static
  # application security testing at all.
  #
  # DELIBERATELY NOT ON pull_request, which is the ONLY difference from the job dropped by #1889.
  # It measured 4m14s per run against gitleaks' 13s, and this repo merges ~14 PRs a day — so a
  # per-PR Semgrep costs roughly 60 Actions minutes daily, about doubling the standing spend, on a
  # repo that has already hit its cap once. What that buys is immediacy and nothing else, because
  # the job WARNS and never fails (see below): per-PR runs would gate nothing that a daily run over
  # main does not also catch, one day later. Owner chose daily + on demand, 2026-09-08.
  #
  # Run it against a branch by hand any time: Actions -> Security scan -> Run workflow, picking the
  # branch. That is what workflow_dispatch is for here, and it is the escape hatch that makes the
  # per-PR cost unnecessary rather than merely unaffordable.
  #
  # THIS JOB NOW FAILS ON ANY FINDING. Flipped 2026-09-08 at the owner's instruction, once the
  # backlog reached zero: restored with 5 findings that morning, all cleared the same day — 1 ×
  # gcm-no-tag-length fixed (#3494), 2 × dynamic-urllib deleted with a dead GCP-era script (#3497),
  # 2 × react-insecure-request suppressed at the line (#3501, loopback). Zero was then confirmed on
  # `main` itself, not merely on a branch: 361 rules over 4,711 files, 0 findings.
  #
  # Zero first, gate second, and that ORDER is the whole reason this can be a real check. secret-scan
  # above could block from day one only because its tree was proven clean first; a gate that is red
  # on arrival is one everybody learns to scroll past, which is worse than no gate at all.
  #
  # 🔴 IT IS DELIBERATELY *NOT* A REQUIRED CHECK, AND ADDING IT WOULD BE WORSE THAN LEAVING IT OFF.
  # This job does not run on pull_request (see the cost note above), so on a PR it reports SKIPPED —
  # and GitHub counts a skipped required check as PASSING. Listed in branch protection it would
  # therefore sit there looking armed while being incapable of blocking anything, on a PR or
  # anywhere else, since protection gates merges and never the post-merge push to `main`. The next
  # person to ask "is SAST gating our PRs?" would read the settings page and get the wrong answer.
  # A real PR gate means removing the `if:` below and paying ~60 Actions minutes a day; that was
  # weighed and declined. What this failure DOES buy is a red daily run over `main` — a regression
  # surfaces within a day, with a notification, instead of sitting in a summary nobody opens.
  sast-scan:
    # Never on a PR. github.event_name is `schedule` or `workflow_dispatch` here.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 🔴 EVERY `continue-on-error` STEP BELOW CARRIES ITS OWN `timeout-minutes`, AND THIS CEILING
    # SITS ABOVE THEIR SUM (2026-10-13). A JOB that hits its ceiling concludes `cancelled`, which
    # withholds that `main` commit's production deploy exactly as a failure does — and a timeout is
    # not a step failure, so `continue-on-error` cannot absorb it. A STEP that hits its own ceiling
    # fails only that step, which `continue-on-error` turns into a reported finding with the job
    # still green. Account and the two runs it cost: migration-drift-check.yml, above its job.
    # Pinned by tests/github-workflow-validity.test.ts.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      # 🔴 continue-on-error PLUS AN id, for the reason spelled out above `Scan for secrets` in the
      # secret-scan job: this job only ever runs on schedule or dispatch, so its check suite attaches
      # to whatever commit is `main` HEAD, and Railway withholds that commit's production deploy for
      # ever when ANY suite on it fails. Semgrep reads the tree and writes its SARIF to an artifact —
      # nothing else — so the exit code was this step's only other effect on the world, and a Semgrep
      # finding is not worth a lost production deploy.
      #
      # The same nuance applies as over there: the "report with no runs" guard below, which catches a
      # scan that did not execute, is now reported rather than thrown alongside a real finding. Both
      # reach a human through the report step and the alert; neither can withhold a deploy. `Set up
      # Python` and `Install Semgrep` above keep NO `continue-on-error` — if the install failed,
      # nothing was measured.
      - name: SAST scan (Semgrep)
        id: semgrep
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --exclude=node_modules --exclude=.next --exclude=dist \
            --metrics=off \
            --sarif --output=semgrep-report.sarif \
            .
          # A `nosemgrep` suppression does NOT remove the result from the SARIF — it is still
          # emitted, carrying `"suppressions":[{"kind":"inSource"}]`. So the obvious count over
          # `.results[]` includes every deliberately-suppressed finding, and it always did: while
          # this job merely warned, that only skewed the summary and nobody noticed. Flipping the
          # job to fail turned it into a permanent red on the two suppressed loopback fetches, with
          # Semgrep's own console line one row above reading `0 findings` — measured 2026-09-08,
          # run 34240252914. Filter on the suppressions array, and report both numbers so a rising
          # suppression count stays visible instead of being the quiet way to make this job pass.
          COUNT=$(jq '[.runs[]?.results[]? | select((.suppressions // []) | length == 0)] | length' semgrep-report.sarif)
          SUPPRESSED=$(jq '[.runs[]?.results[]? | select((.suppressions // []) | length > 0)] | length' semgrep-report.sarif)
          {
            echo "### SAST scan (Semgrep v${SEMGREP_VERSION})"
            echo "Findings: **${COUNT}**"
            echo "Suppressed in source (\`nosemgrep\`): ${SUPPRESSED}"
          } >> "$GITHUB_STEP_SUMMARY"

          # A report carrying no `runs` at all is not a clean scan, it is a scan that did not
          # happen — a bad --config, a resolver failure, an empty checkout. COUNT would be 0 and
          # this job would go green on it. Same reasoning as the gitleaks SCAN_STATUS guard above:
          # never report "clean" for a check that never actually ran.
          RUNS=$(jq '[.runs[]?] | length' semgrep-report.sarif)
          if [ "$RUNS" -lt 1 ]; then
            echo "::error::Semgrep produced a report with no runs — the scan did not execute correctly. Not reporting this as clean."
            exit 1
          fi

          if [ "$COUNT" -gt 0 ]; then
            echo "::error::Semgrep found ${COUNT} potential issue(s) — see the semgrep-report artifact for rule, file and line. Fix it, or suppress it AT THE LINE with a nosemgrep comment carrying the reason (see device-user-mapping-manager.tsx for the shape). Do not silence the job."
            exit 1
          fi

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: semgrep-report
          path: semgrep-report.sarif
          retention-days: 14

      # The durable record, written OUTSIDE the check suite's verdict — a job summary a human can read
      # on the run page, since the job's own conclusion is deliberately no longer the signal. It must
      # ALWAYS exit 0; the `::error::` is a run-page annotation, not a conclusion.
      #
      # What it adds over the scanning step's own count is the SUPPRESSION RULE, which is the part
      # that goes wrong under pressure: the way to clear a finding is at the line, with a reason, never
      # by silencing the job. Semgrep still emits a suppressed result into the SARIF, so the count
      # above already filters them and reports the suppressed number separately — a rising suppression
      # count is meant to stay visible rather than becoming the quiet way to make this job pass.
      - name: Report the SAST finding without withholding the deploy
        if: ${{ always() && steps.semgrep.outcome == 'failure' }}
        run: |
          set -uo pipefail

          {
            printf '## SAST finding\n\n'
            printf 'Semgrep either found something or did not run — read the scanning step above, which prints the finding count, the suppressed count and the reason.\n\n'
            printf 'This is the only vulnerability scanner this repository has: GitHub Advanced Security is not purchasable on a personal account and CodeQL is disabled. Fix it at the line, or suppress it AT THE LINE with a `nosemgrep` comment carrying the reason (see `device-user-mapping-manager.tsx` for the shape). Do not silence the job. The `semgrep-report` artifact on this run carries rule, file and line.\n\n'
            printf 'This job concludes **success on purpose**. A failed or cancelled check suite on `main` HEAD makes Railway withhold that commit'"'"'s production deploy permanently — never `success`, seconds after the suite concludes, with `ci.yml` green — so an alarm that went red to announce a finding would cost a production deploy to do it. The finding is in the failed step above, in the annotation, and in the Telegram alert.\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::SAST finding — fix at the line or suppress at the line with a reason. Read the failed scanning step above. This job still concludes success so its check suite cannot withhold a production deploy."

      # ── THE ALARM THIS JOB WAS ALWAYS SUPPOSED TO HAVE ────────────────────────────────
      # The header above says the value of a red daily run is that "a regression surfaces within a
      # day, with a notification". The notification was never built, and it cost exactly what you
      # would expect: sast-scan failed 8 of the 10 scheduled runs between 2026-09-16 and 09-25 on
      # THREE REAL blocking Semgrep findings, and nobody was told. They were eventually fixed by
      # #4441 and #4445 (09-26 reads 0 findings over 448 rules on 6,853 files) — but for eight days
      # the only vulnerability scanner this repository has was red, and its verdict lived in a job
      # summary nobody opens. This job runs ONLY on schedule and dispatch, so silence is total.
      #
      # 🔴 THIS COMMENT USED TO SAY "secret-scan needs no alarm: it runs on pull_request, where GitHub
      # notifies on the PR", AND THAT WENT STALE ON 2026-09-29 WHEN THE `pull_request` TRIGGER WAS
      # REMOVED FROM THIS WORKFLOW. From that day secret-scan was in exactly the position described
      # above — schedule and dispatch only, total silence — and a scheduled secret finding reached
      # nobody at all. It has its own copy of this step now (2026-09-30); the line is corrected here
      # rather than deleted because a reader who remembers the old justification needs to know it
      # expired, and why.
      #
      # Copied deliberately from migration-drift-check.yml's step rather than invented: that one has
      # been delivering for weeks and carries three hard-won constraints. Do not undo them.
      #   1. NO parse_mode. A lone underscore in the text opened an italic span Telegram never
      #      closed, and the whole message came back HTTP 400. An alert must never fail on format.
      #   2. Capture the BODY, not just the status. A silent non-2xx is how that step once reported
      #      success while delivering nothing.
      #   3. continue-on-error PLUS exit 1. A Telegram outage must never mask — or manufacture — a
      #      security verdict, but a broken alarm must never look healthy either.
      #
      # The streak line is scoped to event=schedule on purpose. A manual dispatch fired to inspect
      # something must not reset a nightly streak; counting every event once hid a 21-night run at
      # "6". Age is the thing that goes unseen here, not delivery — this check's own history proves
      # delivery was never the problem.
      #
      # 🔴 GATED ON THE STEP OUTCOME, NOT ON `failure()` — THE MOST IMPORTANT LINE IN THE 2026-09-30
      # CHANGE. The Semgrep step now carries `continue-on-error`, so this job concludes success even
      # when it finds something, which makes `failure()` permanently false. Left as it was, this step
      # would simply never run again: the fix for a withheld production deploy would have silently
      # deleted the alarm instead, putting this job straight back into the eight-day blind spot the
      # block above records. A lost deploy is carried by the next merge; a scanner nobody hears from
      # is not.
      - name: Notify Telegram on failure
        if: ${{ always() && steps.semgrep.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          WF_FILE: security-scan.yml
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. The SAST scan FAILED and reached nobody, which is the condition this step exists to prevent."
            exit 0
          fi
          # 🔴 THE STREAK READS A STEP, NOT THE RUN'S CONCLUSION, AND IT HAD TO CHANGE WITH THE
          # `continue-on-error` ADDED 2026-09-30. This job now concludes success on a finding, so
          # `.conclusion == "failure"` — what this counted until then — is permanently false and the
          # number would pin itself at 1 for ever. Age is the ONLY thing this line exists to surface
          # (eight of ten September nights, per the block above), so losing it as a side-effect of
          # fixing the withheld deploy would have traded one blind spot for the other.
          #
          # The report step it asks about is THIS job's, and it is named differently from
          # secret-scan's on purpose — both jobs live in this one workflow file, so a shared step name
          # would make each job count the other's findings as its own. `absent` covers runs older
          # than this change and correctly ends the streak. It BREAKS on the first clean run, so the
          # normal case is one extra API call.
          STREAK_LINE=""
          REPORT_STEP="Report the SAST finding without withholding the deploy"
          RUNS=$(gh api "repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50&status=completed&event=${EVENT}" --jq '.workflow_runs[] | [(.id|tostring), .created_at] | join(" ")' 2>/dev/null || true)
          if [ -n "$RUNS" ]; then
            STREAK=1
            FIRST_SEEN=""
            while read -r rid rdate; do
              [ -z "$rid" ] && continue
              [ "$rid" = "$RUN_ID" ] && continue
              # 🔴 `jq --arg` THROUGH A PIPE, NEVER `gh api --jq --arg` — `gh api` HAS NO `--arg` FLAG.
              # `gh api --jq` takes a single query string and nothing else, so `--jq --arg s "$X" '<query>'`
              # makes gh read `--arg` as the query and then choke on three extra positional arguments. The
              # command fails, `|| true` swallows it, `rconc` is empty, and the streak breaks at 1 on EVERY
              # run — silently, for ever. That is precisely the invisible-streak defect this block exists to
              # prevent, reintroduced by the fix for it. Confirmed against `gh api --help` 2026-09-30: the
              # flags are --cache, -F, -H, --hostname, -i, --input, -q/--jq, -X, --paginate, -p, -f, --silent,
              # --slurp, -t, --verbose. No --arg. Pipe to real jq instead, which does have it; jq is
              # preinstalled on ubuntu-latest and every other step in this file already relies on that.
              rconc=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs" 2>/dev/null | jq -r --arg s "$REPORT_STEP" '[.jobs[]?.steps[]? | select(.name == $s)] | .[0].conclusion // "absent"' 2>/dev/null || true)
              [ -z "$rconc" ] && rconc="absent"
              if [ "$rconc" != "skipped" ] && [ "$rconc" != "absent" ] && [ -n "$rconc" ]; then
                STREAK=$((STREAK + 1))
                FIRST_SEEN="$rdate"
              else
                break
              fi
            done <<< "$RUNS"
            if [ "$STREAK" -gt 1 ]; then
              STREAK_LINE=$(printf 'Consecutive failure #%s' "$STREAK")
              if [ -n "$FIRST_SEEN" ]; then
                STREAK_LINE=$(printf '%s, first seen %s' "$STREAK_LINE" "${FIRST_SEEN%%T*}")
              fi
              STREAK_LINE=$(printf '%s. A climbing number means nobody is acting on this.' "$STREAK_LINE")
            fi
          fi
          HEADER='SECURITY SCAN FAILED (Semgrep)'
          [ -n "$STREAK_LINE" ] && HEADER=$(printf '%s\n%s' "$HEADER" "$STREAK_LINE")
          TEXT=$(printf '%s\n\nThe daily SAST scan over main is red. This is the only vulnerability scanner this repository has - GHAS is not purchasable on a personal account and CodeQL is disabled.\n\nIt is either a real finding or a scan that did not run. Both need a human: open the run, read the Findings count, and fix at the line or suppress at the line with a reason.\n\nThis alarm exists because the same job was red for 8 of 10 nights in September on three real findings and told nobody.\n\n%s' "$HEADER" "$RUN_URL")
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). The SAST result reached nobody. Response: $(cat /tmp/tg-response.json 2>/dev/null | head -c 500)"
            exit 1
          fi
          echo "Telegram alert delivered."
