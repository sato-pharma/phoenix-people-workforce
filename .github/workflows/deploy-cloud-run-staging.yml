name: Deploy to Google Cloud Run (Staging)

# Deploy only AFTER the prod deploy workflow finishes for the same commit on main
# (never in parallel with it), or on a manual dispatch. Mirrors deploy-cloud-run.yml's
# safety pattern (no-traffic tag deploy, smoke test, then promote) but targets the
# isolated staging Cloud Run service.
#
# Chained off "Deploy to Google Cloud Run" (prod) rather than "CI" directly: both
# workflows run `gcloud run deploy --source .` in the same GCP project, and
# gcloud's build-status polling hits Cloud Build's `Get requests per minute` quota
# (60/project) hard enough that two concurrent source deploys reliably 429 one of
# them (seen twice in production — see PR #1029/#1032 history). Triggering after
# prod's workflow completes serializes the two builds so they can never overlap,
# regardless of quota headroom. The `if` below only skips when prod's job itself
# never ran (conclusion "skipped", meaning the upstream CI run it depends on
# failed) — a prod deploy *attempt* failing (e.g. transient quota, smoke-test
# reject) does not block staging, since staging re-validates independently via
# its own no-traffic-deploy + smoke-test gate below.
#
# Deliberately omits --set-env-vars / --set-build-env-vars: the staging service
# already has its own env vars (staging Supabase project, staging
# PHOENIX_AUTH_SECRET, etc.) configured directly on Cloud Run, isolated from
# production. Omitting those flags means `gcloud run deploy` carries the existing
# revision's env/build config forward untouched — this workflow only ships new
# code, never new secrets. No STAGING_* GitHub secrets exist or are needed for
# this reason. See AGENTS.md § Stable Environment Facts for the staging project
# details.
on:
  workflow_run:
    workflows: ["Deploy to Google Cloud Run"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Shared with deploy-cloud-run.yml (identical group name) so prod + staging builds
# never poll Cloud Build's 60/min get-requests quota concurrently. See that file's
# concurrency block for the full rationale. cancel-in-progress:false never aborts an
# in-flight deploy.
concurrency:
  group: cloud-run-source-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: phoenix-workforce-498619
  REGION: us-central1
  SERVICE_NAME: phoenix-hr-staging

jobs:
  deploy:
    # Gate: skip only when prod's own job never ran (its upstream CI failed); a
    # prod deploy *attempt* that failed still lets staging try independently.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Deploy the exact commit CI validated (workflow_run), else the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Deploy new revision (no traffic) with a commit-SHA tag
        id: deploy
        run: |
          set -euo pipefail
          RAW_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHA_TAG="sha-$(echo "$RAW_SHA" | cut -c1-8)"
          echo "Deploying tag $SHA_TAG (no traffic) to ${{ env.SERVICE_NAME }}"
          # retry-transient.sh retries ONLY transient Cloud Build 429/5xx/network errors
          # (the 60/min get-requests quota); a real build failure is surfaced on attempt 1.
          bash scripts/retry-transient.sh gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --no-traffic \
            --tag "$SHA_TAG"
          TAG_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} --format=json \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next((t.get('url','') for t in d.get('status',{}).get('traffic',[]) if t.get('tag')=='$SHA_TAG'),''))")
          echo "Tag URL: $TAG_URL"
          test -n "$TAG_URL"
          echo "tag_url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test (isolated new revision, before routing traffic)
        # Deliberately narrower than prod's smoke test: it does NOT hit
        # /api/webhooks/resend or /api/notifications/daily. Those checks assert a
        # 401 that depends on RESEND_WEBHOOK_SECRET / CRON_SECRET being configured,
        # which staging intentionally does not have (no shared third-party
        # secrets). Without those secrets, the webhook route 500s instead of
        # 401ing, and the cron route's unauthenticated-bypass-in-non-production
        # fallback would actually execute the daily notifications job on every
        # deploy instead of rejecting the request.
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.tag_url }}"
          fail() { echo "SMOKE FAILED: $1"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/api/healthz"); echo "GET /api/healthz -> $code"; [ "$code" = "200" ] || fail "healthz not 200"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/login"); echo "GET /login -> $code"; [ "$code" = "200" ] || fail "login not 200"
          echo "Smoke passed."

      - name: Promote validated revision to 100% traffic
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --to-latest

      - name: Clean up stale SHA-tagged revisions (keep newest 3, never touch live)
        # Staging chains off every prod deploy (see header comment above), so it
        # accumulates a sha-* tag just as fast as phoenix-hr and was found with 16
        # piled up (vs. phoenix-hr's 4) during the 2026-07-14 incident triage. It has
        # no --min-instances set (defaults to 0), so it isn't at the same acute
        # CPU-quota-exhaustion risk as phoenix-hr today — but pruning here keeps both
        # services' cleanup logic identical and avoids unbounded revision growth if
        # min-instances is ever added to staging later. Best-effort: never fails an
        # already-live deploy.
        continue-on-error: true
        run: |
          python3 scripts/cleanup-stale-cloud-run-tags.py \
            --service ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --keep 3
