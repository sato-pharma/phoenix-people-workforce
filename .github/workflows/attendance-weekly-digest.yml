name: Attendance Weekly Digest

# Calls the weekly attendance digest's own cron route, which builds the digests for the
# settlement week that has just CLOSED and opens them for answers.
#
# WHY A GITHUB ACTIONS CRON AND NOT cron-job.org. cron-job.org is this repo's production
# scheduler and remains the right home for it, but `api.cron-job.org` (195.201.26.157) is
# TCP-filtered from the owner's network — DNS resolves, `console.cron-job.org` answers 200
# from CloudFront, and every route to the API host fails identically at connect. So the job
# could not be registered from a session, and this is the fifth Actions cron rather than
# the twenty-somethingth cron-job.org entry. If that block ever lifts, move it there and
# delete this file: one scheduler is better than two.
#
# COST. Deliberately the cheapest shape available — no checkout, no pnpm, no Node setup,
# one curl on the default runner, a few seconds a day. Actions minutes are a real
# constraint here (the spending cap has been hit once), and the standing cost is
# synthetic-journeys at roughly 57 min/day; this adds well under one.
#
# THE ROUTE IS IDEMPOTENT, which is why daily is safe for a weekly job: generation skips a
# week it has already built, so the extra six calls each week do nothing but make the new
# week punctual rather than waiting on one fixed day. It also means a missed or delayed run
# — GitHub does not guarantee schedule punctuality — costs nothing at all.
#
# IT SENDS NOTHING. The digest module notifies nobody by construction (owner, 2026-09-08);
# the channel columns are not switched off, they are absent from the schema. This workflow
# cannot cause a message to reach an employee.
on:
  schedule:
    # 03:23 UTC = 06:23 Cairo. Offset off the shared :00/:15/:30/:45 firing minute like
    # every sibling cron here, and clear of migration-drift (07:00) and security-scan (05:17).
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One at a time. A manual dispatch beside the scheduled run would be harmless — the route
  # is idempotent — but two in flight makes the logs ambiguous about which one generated.
  group: attendance-weekly-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the closed week's digests
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set on this repository — the route would 401."
            exit 1
          fi

          # Fingerprint only. The value is never echoed, and `set -x` is deliberately not used.
          echo "CRON_SECRET length: ${#CRON_SECRET}"

          # Body and status captured separately so a non-2xx prints WHAT the route said
          # rather than just a number — a 401 and a 500 need different answers.
          status=$(curl -sS --max-time 240 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o response.json -w '%{http_code}' \
            https://phoenix-hr.satopharma.com/api/cron/attendance-weekly-digest)

          echo "HTTP ${status}"
          cat response.json
          echo

          if [ "${status}" != "200" ]; then
            echo "::error::Weekly attendance digest run failed with HTTP ${status}"
            exit 1
          fi

          # A 200 is not success on its own: the route answers 200 with
          # `skipped: "disabled"` when the module is switched off, and 200 with
          # digestsCreated 0 when the week was already built. Both are correct outcomes,
          # so they are reported rather than failed — but they must be legible in the log,
          # because "ran fine, did nothing" is the shape that hid a 13-day outbox stall.
          summary=$(jq -r '
            if .skipped == "disabled" then
              "Module is disabled — nothing generated. This is a setting, not a failure."
            else
              "week \(.generated.week.index // "?") (\(.generated.week.startIso // "?") .. \(.generated.week.endIso // "?")): " +
              "\(.generated.digestsCreated // 0) digest(s), \(.generated.linesCreated // 0) line(s), " +
              "\(.generated.skippedExisting // 0) already present, dryRun=\(.dryRun)"
            end
          ' response.json)
          echo "::notice::${summary}"
