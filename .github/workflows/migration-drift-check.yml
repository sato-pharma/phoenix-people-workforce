name: Migration Drift Check

# Closes the "migration merged to main but never actually applied" gap found
# 2026-07-19 — 3 migrations sat unapplied for up to a week (two causing real
# production bugs) before a manual audit caught it. Deliberately NOT triggered by
# pull_request/push: a PR introducing a new migration is SUPPOSED to show it
# unapplied at review time, and this checks for silent drift that accumulates AFTER
# merge — only a recurring, time-based check catches that, a per-PR one can't.
on:
  schedule:
    - cron: "0 7 * * *" # daily, offset from the notification-outbox/probation crons
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_NODE_VERSION: "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  migration-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history needed for per-file commit-age lookups

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations are actually applied (staging)
        run: pnpm run check:migrations-applied
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Production is the leg that actually matters, and it was missing until 2026-07-30.
      # Staging-only was justified as a proxy ("if it never reached staging it never reached
      # production"), but the documented workflow is staging-FIRST — production apply needs
      # separate explicit approval per AGENTS.md — so the normal drift is applied-on-staging /
      # missing-on-production, which the staging leg reports as green. That is not theoretical:
      # on 2026-07-30 the staging leg had been passing daily for days while production was
      # missing 20260725180000_analytics_dim_products_exclude_head_office.sql, leaving
      # Head-Office-line products readable by non-CEO analytics consumers.
      #
      # `always()` so a staging failure never hides the production answer — the two legs report
      # independently. Read-only: the script's only call is the phx_ci_migration_versions RPC.
      - name: Check migrations are actually applied (production)
        if: ${{ always() && secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: pnpm run check:migrations-applied
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

      # Without this the production leg would just show as "skipped" — indistinguishable from
      # "ran and passed" at a glance, which is the same class of silent-green this whole
      # workflow exists to prevent.
      - name: Warn when the production leg could not run
        if: ${{ always() && secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: |
          echo "::warning::PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is not set — production migration drift was NOT checked. Only staging was verified. Add the secret (production project ref ozucdzovmcqvepbozvqf) to enable the production leg."
