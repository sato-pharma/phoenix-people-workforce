name: Migration Drift Check

# Two independent questions about the live databases, neither answerable by CI on a PR.
#
# 1. MIGRATION DRIFT (added 2026-07-19). Closes the "migration merged to main but never
#    actually applied" gap — 3 migrations sat unapplied for up to a week, two causing
#    real production bugs, before a manual audit caught it.
#
# 2. SCHEMA SHAPE (added 2026-07-31). Closes the far larger gap that #1 cannot see:
#    a database can have a PERFECT migration history and still have no constraints, no
#    indexes and no row-level security at all. Staging was found in exactly that state,
#    three weeks after a restore that applied only the pre-data section of a dump —
#    0 RLS policies, RLS off on all 284 tables, 0 foreign keys, 105 of 282 primary keys.
#    Its schema_migrations was fully populated throughout, so check #1 stayed green and
#    was right to. Every RLS and permission test run against staging in that window was
#    vacuous.
#
# Deliberately NOT triggered by pull_request/push: a PR introducing a new migration is
# SUPPOSED to show it unapplied at review time, and both checks look for silent drift
# that accumulates AFTER merge — only a recurring, time-based check catches that.
#
# 🔴 A FINDING TURNS THE RUN RED AGAIN (owner, 2026-10-23: "make the Migration Drift Check go red
# again when its checks fail"). From 2026-09-30 to 2026-10-23 every finding was reported while the
# job concluded SUCCESS, so the run list showed 23 green nights in a row while every one of them had
# failing legs. That was done because Railway's Wait-for-CI withheld a production deploy whenever
# ANY suite on `main` HEAD failed. Wait-for-CI is OFF since 2026-10-19/20 (`checkSuites: false` in
# .railway/railway.ts); the release gate now holds a deploy on ci.yml's `validate` + `checks` only,
# so this suite going red withholds nothing. Measured before this change: 12e535485 (a failed
# Dependabot run) and 68522a1bc (a failed Emergency host run) both reached `success` on production.
#
# The legs keep `continue-on-error` so each one runs and reports independently, the Telegram alert
# stays gated on the step outcomes, and the LAST step fails the job when any leg found something.
# 🔴 If Wait-for-CI is ever switched back on, this workflow must go back to concluding success on a
# finding — tests/scheduled-alarms-never-withhold.test.ts says so where it pins this shape.
# This workflow is read-only throughout (the checks' only call is the phx_ci_migration_versions RPC
# and the advisor API), so nothing here can leave a half-done write.
on:
  schedule:
    - cron: "0 7 * * *" # daily, offset from the notification-outbox/probation crons
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram alert and stop (proves the alarm still works)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # read this workflow own past runs, to count the failure streak

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_NODE_VERSION: "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  migration-drift-check:
    runs-on: ubuntu-latest
    # 🔴 EVERY `continue-on-error` STEP CARRIES ITS OWN `timeout-minutes`, AND THIS JOB CEILING SITS
    # WELL ABOVE THEIR SUM ON PURPOSE (2026-10-13). A JOB that hits its ceiling concludes
    # `cancelled`, and a cancelled
    # check suite on `main` HEAD withholds that commit's production deploy exactly as a failed one
    # does — so the job timeout was the one remaining way to lose a deploy that the
    # `continue-on-error` design below CANNOT absorb, because a timeout is not a step failure.
    # It happened twice: 2026-10-10 and 2026-10-12 both ran 10m07s against the old
    # `timeout-minutes: 10` and were cancelled at the wall with every check leg already complete,
    # the finding written and the Telegram alert delivered (HTTP 200). Nothing was wrong with the
    # checks; the run's CONCLUSION was the only casualty, and it cost two `main` commits their
    # deploy — both were superseded by later merges, so production lost nothing, by luck rather than
    # by design. The cause was growth nobody was watching: loadLocalMigrations ran one `git log`
    # process PER migration file, 855 of them, TWICE (once per database leg), measuring 4m34s a leg.
    # See the header on loadCommitTimesByFileName in scripts/lib/migration-inventory.ts — it is now
    # ONE process and 605 ms.
    #
    # Since 2026-10-23 the release gate, not this suite, holds a deploy (see the header), so a
    # cancelled run no longer costs one — but `cancelled` still hides WHICH leg found what, and it
    # can skip the Telegram alert. A STEP that hits its own ceiling fails only that step, and
    # `continue-on-error` turns that into a reported finding, alerted and then failing the job at
    # its last step. So the sum of the step budgets below (19
    # minutes) staying under this ceiling is what makes `cancelled` unreachable, and that margin —
    # 7 minutes against a measured setup of ~40s — is the thing to preserve when editing either
    # number. The four setup steps are deliberately left unbudgeted, for the same reason they are
    # deliberately left able to fail the job: a hung `pnpm install` is a BROKEN check, not a finding,
    # and it must never conclude success. Pinned by tests/github-workflow-validity.test.ts.
    timeout-minutes: 25

    # `secrets` is NOT a valid context in a step-level `if:` — GitHub rejects it with
    # "Unrecognized named-value: 'secrets'" and the ENTIRE workflow fails to parse, so every run
    # goes red before any job starts (that is what happened from 2026-07-30, when the production
    # leg below was added). Surface the key as a job-level env var instead — `env` CAN read
    # secrets, and a step `if:` CAN read job-level `env` — and gate the two production steps on
    # that. The secret's value is still injected only into the step that uses it (via `env:` on
    # that step); this job-level copy exists solely so the `if:` can test whether it is set.
    # PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is intentionally a SEPARATE secret from
    # SUPABASE_SERVICE_ROLE_KEY — this workflow is the only consumer of this name.
    # scripts/sync-railway-production-secrets.mjs's Railway sync prefers
    # SUPABASE_SERVICE_ROLE_KEY and only falls back to this one if the former is unset, so
    # this value never reaches Railway through that path. Don't rename or consolidate either.
    env:
      HAS_PRODUCTION_SUPABASE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history needed for per-file commit-age lookups

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Since 2026-09-04 staging is applied AUTOMATICALLY by staging-migrate.yml on every merge to
      # main that touches supabase/migrations/**. So this leg's meaning has changed: it used to
      # report a forgotten chore, and now reports a BROKEN AUTOMATION. Keep it — the automation is
      # the thing most likely to fail silently, and something has to watch the watcher. What it
      # should no longer do is prompt a hand-application: re-run the workflow instead, or the next
      # merge will simply re-open the same gap.
      # 🔴 EVERY CHECK LEG BELOW CARRIES `continue-on-error` PLUS AN id. Since 2026-10-23 that is
      # NOT what keeps the job green — the last step turns it red on any finding (see the header).
      # It is what lets every leg run and report independently: one red leg never hides the next
      # database's answer, the report step names which leg failed, and the Telegram alert, gated on
      # these step outcomes, fires before the job fails. Each leg keeps its `::error::` annotation
      # and its non-zero exit, so the failed STEP is red in the UI as well as the run.
      #
      # 🔴 THE FOUR SETUP STEPS ABOVE — checkout, corepack, setup-node, `pnpm install` — MUST NEVER BE
      # GIVEN `continue-on-error`. A broken check is not a finding: if the install failed, nothing
      # was measured, and a job that concluded success on that would be the silent-green this whole
      # workflow exists to prevent.
      - name: Check migrations are actually applied (staging)
        id: migrations_staging
        continue-on-error: true
        timeout-minutes: 3
        run: pnpm run check:migrations-applied
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # THE STAGING SWEEP (added 2026-10-15): the same check with the 48h grace window STOOD DOWN.
      # The leg above deliberately ignores anything merged in the last 48 hours, which is right for
      # a nightly report and wrong for the one project where a fresh gap means something specific:
      # staging is applied AUTOMATICALLY by staging-migrate.yml on every merge, so a migration that
      # is merged and still absent here is a BROKEN AUTOMATION, not a forgotten chore, and waiting
      # two days to say so is two days of staging not matching main. That is also why this leg is
      # staging only: production has no automation, a hand-apply through the standing route writes
      # no ledger row, and a no-grace production leg would raise a finding for every one of those
      # inside the hour it was applied.
      #
      # TWO LEGS, NOT ONE REPLACEMENT, because the pair carries a fact neither carries alone. The
      # grace-window leg failing means a gap OLDER than 48 hours; this one failing while that one
      # passes means a gap YOUNGER than 48 hours. The run page shows which.
      #
      # 🔴 THE ONE WAY THIS LEG LIES IS A RACE, and it is bounded rather than removed: a cron run
      # that fires in the minutes between a merge and staging-migrate.yml recording it reads that
      # migration as a gap. The schedule (07:00 UTC, ten in the morning Cairo-side) needs a merge in
      # the few minutes before it; if this leg ever fires on a database that is in fact clean,
      # re-run the workflow before acting. It is a finding, never a lost deploy: continue-on-error
      # as on every leg.
      #
      # It runs `check:migrations-swept` with STAGING's pair in the environment rather than
      # `check:migrations-swept-staging`: that variant reads the PHOENIX_STAGING_* names for a person
      # at a shell, and this runner passes NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY like
      # every other leg. The process environment always wins over an env file (resolveEnvValue).
      - name: Sweep migrations with the grace window down (staging)
        id: migrations_staging_sweep
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ always() }}
        run: pnpm run check:migrations-swept
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Production is the leg that actually matters, and it was missing until 2026-07-30.
      # Staging-only was justified as a proxy ("if it never reached staging it never reached
      # production"), but the documented workflow is staging-FIRST — production apply needs
      # separate explicit approval per AGENTS.md — so the normal drift is applied-on-staging /
      # missing-on-production, which the staging leg reports as green. That is not theoretical:
      # on 2026-07-30 the staging leg had been passing daily for days while production was
      # missing 20260725180000_analytics_dim_products_exclude_head_office.sql, leaving
      # Head-Office-line products readable by non-CEO analytics consumers.
      #
      # `always()` so a staging failure never hides the production answer — the two legs report
      # independently. Read-only: the script's only call is the phx_ci_migration_versions RPC.
      #
      # `continue-on-error` for the reason spelled out above the staging leg. Note it does NOT make
      # the `always()` redundant: `always()` is what let this leg run when an earlier leg had already
      # failed the job, and `continue-on-error` is what stops the JOB — and so the check suite —
      # concluding failure. Two different mechanisms; dropping either one loses something.
      - name: Check migrations are actually applied (production)
        id: migrations_production
        continue-on-error: true
        timeout-minutes: 3
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run check:migrations-applied
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

      # SCHEMA SHAPE (added 2026-07-31). The two checks answer different questions and
      # neither substitutes for the other: the ones above prove migrations were RECORDED,
      # these prove the database actually HAS the structure and protection those migrations
      # describe. Staging spent three weeks with a perfect migration history and zero RLS
      # policies, zero foreign keys and RLS switched off on all 284 tables — the drift check
      # was green throughout, correctly, because it was answering the other question.
      #
      # `always()` for the same reason as the production leg above: a failure in an earlier
      # step must never hide these answers. `continue-on-error` for the reason above the staging
      # migrations leg — a schema-shape finding is the single most valuable thing this workflow
      # produces (it is what found six anon-readable tables on 2026-08-06), and it must not be
      # payable in a lost production deploy.
      - name: Check schema shape (staging)
        id: schema_shape_staging
        continue-on-error: true
        timeout-minutes: 2
        if: ${{ always() }}
        run: pnpm run check:schema-shape
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check schema shape (production)
        id: schema_shape_production
        continue-on-error: true
        timeout-minutes: 2
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run check:schema-shape
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

      # ADVISOR BASELINE (added 2026-09-29). A different question again: the two above prove
      # the STRUCTURE is sound, this proves nobody quietly added to the list of things we had
      # already agreed to tolerate.
      #
      # docs/security/supabase-advisor-baseline.md is the document that decides which advisor
      # findings are accepted. It was last reviewed 2026-07-19 and by 2026-09-29 said INFO x23
      # where production read 176, and INFO x326 where it read 615. Worse, it said
      # `function_search_path_mutable` was REMEDIATED and that a reappearance "is a regression"
      # — it had reappeared for ten functions, and nobody knew, because nothing had ever
      # compared live advisor output to that document. 153 tables joined an "accepted" list
      # with nobody accepting them.
      #
      # 🔴 PRODUCTION ONLY, deliberately — unlike every other leg in this workflow.
      # The baseline is a triage record of what was decided about the PRODUCTION database.
      # Staging is a clone with its own usage, so its counts differ for reasons nobody acts
      # on: measured 2026-09-29, staging reads unused_index 624 against production's 615 and
      # rls_enabled_no_policy 161 against 176. Running production's baseline there would have
      # failed this workflow nightly on a difference that means nothing — and a check that
      # cries wolf is the one people learn to skip past. The script refuses to compare when
      # the target ref is not the one the baseline names, so pointing it at staging by
      # accident says so rather than inventing a verdict.
      #
      # `always()` for the same reason as every leg above, and `continue-on-error` for the reason
      # above the staging migrations leg.
      - name: Check advisor baseline (production)
        id: advisor_baseline_production
        continue-on-error: true
        timeout-minutes: 2
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run check:advisor-baseline
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

      # Without this the production legs would just show as "skipped" — indistinguishable from
      # "ran and passed" at a glance, which is the same class of silent-green this whole
      # workflow exists to prevent.
      - name: Warn when the production leg could not run
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY != 'true' }}
        run: |
          echo "::warning::PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is not set — production migration drift and schema shape were NOT checked. Only staging was verified. Add the secret (production project ref ozucdzovmcqvepbozvqf) to enable the production legs."

      # The durable record — a job summary a human can read on the run page, naming the leg.
      #
      # 🔴 IT NAMES WHICH LEG FAILED, AND THAT IS THE POINT RATHER THAN DECORATION. Five legs report
      # independently here against two different databases, so "the database posture check failed"
      # is not actionable on its own: a staging schema-shape failure is a broken restore, a
      # production migration failure is an unapplied migration that may be causing a live bug, and
      # an advisor-baseline failure is a triage document nobody updated. Before this step the only
      # place that distinction lived was the job's step list, and the Telegram text still cannot
      # carry it (it is built before the outcomes are known in the old shape).
      #
      # This step always exits 0: failing the job is the last step's work, after the alert is sent.
      - name: Report the database posture finding
        if: ${{ always() && (steps.migrations_staging.outcome == 'failure' || steps.migrations_staging_sweep.outcome == 'failure' || steps.migrations_production.outcome == 'failure' || steps.schema_shape_staging.outcome == 'failure' || steps.schema_shape_production.outcome == 'failure' || steps.advisor_baseline_production.outcome == 'failure') }}
        env:
          MIGRATIONS_STAGING: ${{ steps.migrations_staging.outcome }}
          MIGRATIONS_STAGING_SWEEP: ${{ steps.migrations_staging_sweep.outcome }}
          MIGRATIONS_PRODUCTION: ${{ steps.migrations_production.outcome }}
          SCHEMA_SHAPE_STAGING: ${{ steps.schema_shape_staging.outcome }}
          SCHEMA_SHAPE_PRODUCTION: ${{ steps.schema_shape_production.outcome }}
          ADVISOR_BASELINE_PRODUCTION: ${{ steps.advisor_baseline_production.outcome }}
        run: |
          set -uo pipefail

          {
            printf '## Database posture finding\n\n'
            printf '| leg | outcome |\n| --- | --- |\n'
            printf '| migrations applied (staging) | `%s` |\n' "$MIGRATIONS_STAGING"
            printf '| migrations swept, grace window down (staging) | `%s` |\n' "$MIGRATIONS_STAGING_SWEEP"
            printf '| migrations applied (production) | `%s` |\n' "$MIGRATIONS_PRODUCTION"
            printf '| schema shape (staging) | `%s` |\n' "$SCHEMA_SHAPE_STAGING"
            printf '| schema shape (production) | `%s` |\n' "$SCHEMA_SHAPE_PRODUCTION"
            printf '| advisor baseline (production) | `%s` |\n' "$ADVISOR_BASELINE_PRODUCTION"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error::Database posture finding — read the failed check leg above for the diagnosis."

      # ── Tell a human. This is the step whose absence caused the incident. ──────────────
      #
      # On 2026-08-06 this workflow detected the leak correctly and said so in plain words:
      #   [schema-shape] ERROR exposed_without_rls: 6 table(s) are reachable by anon/authenticated
      #   with RLS DISABLED ... zz_backup_sos_july_ro001_price_20260806, ...
      # It repeated that on 08-07 and 08-08. Every run went red. Nobody saw it, because a failing
      # scheduled workflow notifies no one — GitHub emails the run author, and a cron run has none.
      # The leak was found on 08-09 by an unrelated manual audit, three days and 412 exposed
      # customer names later.
      #
      # A detector nobody reads is not a detector. This posts to the owner's Telegram on failure.
      #
      # Failure-only, deliberately: a daily "all clear" is how an alert becomes furniture, which is
      # the exact failure mode being fixed here.
      #
      # Uses curl against the Bot API rather than the app's sendTelegramNotification() — a workflow
      # runner has no app runtime, no database and no service-role client. Both TELEGRAM_BOT_TOKEN
      # (shared with the app) and TELEGRAM_ALERT_CHAT_ID are Actions secrets; the chat id is the
      # PHX-1 system-administrator connection, chosen by the owner 2026-08-09.
      #
      # `continue-on-error` so a notification outage can never mask the security result itself. Since
      # 2026-09-30 the job's conclusion no longer carries the verdict at all (see the block above the
      # first check leg), so what this now protects is the STEP-level signal: a Telegram outage must
      # never manufacture a red step of its own next to the real finding, nor hide one.
      #
      # SELF-TEST. `workflow_dispatch` with test_alert=true fires this step on a PASSING run. An
      # alarm that has never been observed to ring is indistinguishable from a broken one, and this
      # workflow already spent three days proving that a detector nobody hears is not a detector.
      # A bot token can be rotated, a chat id can go stale, and the daily run would keep passing
      # silently while the alert path rotted. This makes "does the alarm still work?" a question
      # anyone can answer in two minutes without waiting for a real incident.
      #
      # 🔴 GATED ON THE STEP OUTCOMES, NOT ON `failure()`. Every check leg above carries
      # `continue-on-error`, so a leg's failure never reaches `failure()` — the job only turns red
      # at the LAST step, after this one. Gated on `failure()`, this step would never run at all,
      # turning this workflow back into the thing whose absence cost three days and 412 exposed
      # customer names on 2026-08-06, which is the incident the block above records.
      - name: Notify Telegram on failure
        if: ${{ always() && (steps.migrations_staging.outcome == 'failure' || steps.migrations_staging_sweep.outcome == 'failure' || steps.migrations_production.outcome == 'failure' || steps.schema_shape_staging.outcome == 'failure' || steps.schema_shape_production.outcome == 'failure' || steps.advisor_baseline_production.outcome == 'failure' || inputs.test_alert) }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IS_TEST: ${{ inputs.test_alert }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          WF_FILE: migration-drift-check.yml
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::warning::Telegram alert not sent — TELEGRAM_BOT_TOKEN or TELEGRAM_ALERT_CHAT_ID is unset. The database posture check FAILED and reached nobody, which is the condition this step exists to prevent."
            exit 0
          fi
          # NO parse_mode. The first version sent parse_mode=Markdown and Telegram answered
          # HTTP 400: the self-test text contains `test_alert`, and a lone underscore opens an
          # italic span that is never closed, so the whole message was rejected. An alert must
          # never fail because of how it is formatted — plain text cannot be mis-parsed, and the
          # only thing lost is a clickable link, which the bare URL provides anyway.
          # ── How old is this failure? ──────────────────────────────────────────────────────
          # An alert that has fired identically for three weeks looks exactly like one firing for
          # the first time. Not hypothetical: this check was red on 21 CONSECUTIVE nightly runs
          # (2026-08-11 to 2026-08-31) and every one of them delivered, because delivery was never
          # the problem — visibility of AGE was. The same shape cost 3 days on six anon-readable
          # tables, 13 days on the outbox drain and 9 nights on the direct-order sweeps. Adding
          # more channels does not fix that; saying how long it has been does.
          #
          # Scoped to runs of the SAME event: a manual dispatch fired to inspect something must
          # not reset a nightly streak. Counting every event hid this one at "6" instead of 21.
          #
          # Best-effort by construction — it needs only `actions: read`, and any failure leaves the
          # line out rather than breaking the alert. An alarm must never fail because the thing
          # describing it failed. jq joins on a SPACE deliberately: a tab delimiter needs IFS=$'\t',
          # and that sequence is a special replacement pattern in several editors and scripts.
          #
          # 🔴 THE STREAK READS A STEP, NOT THE RUN'S CONCLUSION. From 2026-09-30 to 2026-10-23 this
          # job concluded success even when it found drift, so a run's conclusion says nothing about
          # those 23 nights; counting conclusions would cut the streak at the first of them.
          #
          # "Did the report step RUN?" is the durable signal: a gated step is either executed or
          # `skipped`, and `skipped` is reported unambiguously whatever the runner does with a
          # continue-on-error step's own conclusion — which is why this keys on skipped-ness rather
          # than on that conclusion. `absent` covers runs older than this change, and correctly ends
          # the streak rather than guessing about them. Copied from deploy-drift-check.yml, where the
          # same problem was solved the same way.
          #
          # Cost: one extra API call per run walked, and it BREAKS on the first clean run — so the
          # normal case is a single call, and it only walks far during a real outage, which is
          # exactly when the number is worth paying for.
          STREAK_LINE=""
          # Both names: the step was "… without withholding the deploy" until 2026-10-23, and the
          # streak must walk back across the rename.
          REPORT_STEP="Report the database posture finding"
          REPORT_STEP_OLD="Report the database posture finding without withholding the deploy"
          RUNS=$(gh api "repos/${REPO}/actions/workflows/${WF_FILE}/runs?per_page=50&status=completed&event=${EVENT}" --jq '.workflow_runs[] | [(.id|tostring), .created_at] | join(" ")' 2>/dev/null || true)
          if [ -n "$RUNS" ]; then
            STREAK=1
            FIRST_SEEN=""
            while read -r rid rdate; do
              [ -z "$rid" ] && continue
              [ "$rid" = "$RUN_ID" ] && continue
              # 🔴 `jq --arg` THROUGH A PIPE, NEVER `gh api --jq --arg` — `gh api` HAS NO `--arg` FLAG.
              # `gh api --jq` takes a single query string and nothing else, so `--jq --arg s "$X" '<query>'`
              # makes gh read `--arg` as the query and then choke on three extra positional arguments. The
              # command fails, `|| true` swallows it, `rconc` is empty, and the streak breaks at 1 on EVERY
              # run — silently, for ever. That is precisely the invisible-streak defect this block exists to
              # prevent, reintroduced by the fix for it. Confirmed against `gh api --help` 2026-09-30: the
              # flags are --cache, -F, -H, --hostname, -i, --input, -q/--jq, -X, --paginate, -p, -f, --silent,
              # --slurp, -t, --verbose. No --arg. Pipe to real jq instead, which does have it; jq is
              # preinstalled on ubuntu-latest and every other step in this file already relies on that.
              rconc=$(gh api "repos/${REPO}/actions/runs/${rid}/jobs" 2>/dev/null | jq -r --arg s "$REPORT_STEP" --arg o "$REPORT_STEP_OLD" '[.jobs[]?.steps[]? | select(.name == $s or .name == $o)] | .[0].conclusion // "absent"' 2>/dev/null || true)
              [ -z "$rconc" ] && rconc="absent"
              if [ "$rconc" != "skipped" ] && [ "$rconc" != "absent" ] && [ -n "$rconc" ]; then
                STREAK=$((STREAK + 1))
                FIRST_SEEN="$rdate"
              else
                break
              fi
            done <<< "$RUNS"
            if [ "$STREAK" -gt 1 ]; then
              STREAK_LINE=$(printf 'Consecutive failure #%s' "$STREAK")
              if [ -n "$FIRST_SEEN" ]; then
                STREAK_LINE=$(printf '%s, first seen %s' "$STREAK_LINE" "${FIRST_SEEN%%T*}")
              fi
              STREAK_LINE=$(printf '%s. A climbing number means nobody is acting on this.' "$STREAK_LINE")
            fi
          fi
          if [ "$IS_TEST" = "true" ]; then
            TEXT=$(printf 'ALERT SELF-TEST (not an incident)\n\nSomeone ran the drift check with the test flag to confirm this channel still works.\n\nIf you are reading this, a real database posture failure would also reach you.\n\n%s' "$RUN_URL")
          else
            HEADER='DATABASE POSTURE CHECK FAILED'
            [ -n "$STREAK_LINE" ] && HEADER=$(printf '%s\n%s' "$HEADER" "$STREAK_LINE")
            TEXT=$(printf '%s\n\nMigration drift / schema shape is red on staging or production.\n\nThis is the check that found six anon-readable backup tables on 2026-08-06 and went unread for three days.\n\n%s' "$HEADER" "$RUN_URL")
          fi
          # Capture the body, not just the status. A silent non-2xx is how this step reported
          # success while delivering nothing on the very first run.
          HTTP=$(curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_ALERT_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            -o /tmp/tg-response.json -w '%{http_code}')
          echo "telegram sendMessage HTTP ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            # Telegram echoes the reason in `description`; print it so the fix is obvious.
            echo "::error::Telegram alert FAILED to deliver (HTTP ${HTTP}). The database posture result reached nobody. Response: $(cat /tmp/tg-response.json 2>/dev/null | head -c 500)"
            # Non-zero so the step shows RED in the UI. continue-on-error above keeps a Telegram
            # outage from skipping the verdict step below — it must never mask, or manufacture, a
            # security verdict. But a broken alarm must never look healthy either.
            exit 1
          fi
          echo "Telegram alert delivered."

      # 🔴 THE VERDICT — THE JOB GOES RED WHEN ANY CHECK LEG FOUND SOMETHING (owner, 2026-10-23).
      # It runs LAST so every leg has run, the summary is written and the alert is sent first.
      # Gated on the same step outcomes as the report and the alert (never `inputs.test_alert`: a
      # self-test of the channel is not a finding). The full account is in the header.
      - name: Fail the run when a check found something
        if: ${{ always() && (steps.migrations_staging.outcome == 'failure' || steps.migrations_staging_sweep.outcome == 'failure' || steps.migrations_production.outcome == 'failure' || steps.schema_shape_staging.outcome == 'failure' || steps.schema_shape_production.outcome == 'failure' || steps.advisor_baseline_production.outcome == 'failure') }}
        timeout-minutes: 1
        run: |
          echo "::error::The database posture check found something — the failed check leg above names it."
          exit 1
