name: Migration Drift Check

# Two independent questions about the live databases, neither answerable by CI on a PR.
#
# 1. MIGRATION DRIFT (added 2026-07-19). Closes the "migration merged to main but never
#    actually applied" gap — 3 migrations sat unapplied for up to a week, two causing
#    real production bugs, before a manual audit caught it.
#
# 2. SCHEMA SHAPE (added 2026-07-31). Closes the far larger gap that #1 cannot see:
#    a database can have a PERFECT migration history and still have no constraints, no
#    indexes and no row-level security at all. Staging was found in exactly that state,
#    three weeks after a restore that applied only the pre-data section of a dump —
#    0 RLS policies, RLS off on all 284 tables, 0 foreign keys, 105 of 282 primary keys.
#    Its schema_migrations was fully populated throughout, so check #1 stayed green and
#    was right to. Every RLS and permission test run against staging in that window was
#    vacuous.
#
# Deliberately NOT triggered by pull_request/push: a PR introducing a new migration is
# SUPPOSED to show it unapplied at review time, and both checks look for silent drift
# that accumulates AFTER merge — only a recurring, time-based check catches that.
on:
  schedule:
    - cron: "0 7 * * *" # daily, offset from the notification-outbox/probation crons
  workflow_dispatch: {}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_NODE_VERSION: "24"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  migration-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `secrets` is NOT a valid context in a step-level `if:` — GitHub rejects it with
    # "Unrecognized named-value: 'secrets'" and the ENTIRE workflow fails to parse, so every run
    # goes red before any job starts (that is what happened from 2026-07-30, when the production
    # leg below was added). Surface the key as a job-level env var instead — `env` CAN read
    # secrets, and a step `if:` CAN read job-level `env` — and gate the two production steps on
    # that. The secret's value is still injected only into the step that uses it (via `env:` on
    # that step); this job-level copy exists solely so the `if:` can test whether it is set.
    # PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is intentionally a SEPARATE secret from
    # SUPABASE_SERVICE_ROLE_KEY — this workflow is the only consumer of this name.
    # scripts/sync-railway-production-secrets.mjs's Railway sync prefers
    # SUPABASE_SERVICE_ROLE_KEY and only falls back to this one if the former is unset, so
    # this value never reaches Railway through that path. Don't rename or consolidate either.
    env:
      HAS_PRODUCTION_SUPABASE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history needed for per-file commit-age lookups

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.CI_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migrations are actually applied (staging)
        run: pnpm run check:migrations-applied
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      # Production is the leg that actually matters, and it was missing until 2026-07-30.
      # Staging-only was justified as a proxy ("if it never reached staging it never reached
      # production"), but the documented workflow is staging-FIRST — production apply needs
      # separate explicit approval per AGENTS.md — so the normal drift is applied-on-staging /
      # missing-on-production, which the staging leg reports as green. That is not theoretical:
      # on 2026-07-30 the staging leg had been passing daily for days while production was
      # missing 20260725180000_analytics_dim_products_exclude_head_office.sql, leaving
      # Head-Office-line products readable by non-CEO analytics consumers.
      #
      # `always()` so a staging failure never hides the production answer — the two legs report
      # independently. Read-only: the script's only call is the phx_ci_migration_versions RPC.
      - name: Check migrations are actually applied (production)
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run check:migrations-applied
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

      # SCHEMA SHAPE (added 2026-07-31). The two checks answer different questions and
      # neither substitutes for the other: the ones above prove migrations were RECORDED,
      # these prove the database actually HAS the structure and protection those migrations
      # describe. Staging spent three weeks with a perfect migration history and zero RLS
      # policies, zero foreign keys and RLS switched off on all 284 tables — the drift check
      # was green throughout, correctly, because it was answering the other question.
      #
      # `always()` for the same reason as the production leg above: a failure in an earlier
      # step must never hide these answers.
      - name: Check schema shape (staging)
        if: ${{ always() }}
        run: pnpm run check:schema-shape
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://cifwmndunmlxjhyjugxa.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check schema shape (production)
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY == 'true' }}
        run: pnpm run check:schema-shape
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ozucdzovmcqvepbozvqf.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}

      # Without this the production legs would just show as "skipped" — indistinguishable from
      # "ran and passed" at a glance, which is the same class of silent-green this whole
      # workflow exists to prevent.
      - name: Warn when the production leg could not run
        if: ${{ always() && env.HAS_PRODUCTION_SUPABASE_KEY != 'true' }}
        run: |
          echo "::warning::PRODUCTION_SUPABASE_SERVICE_ROLE_KEY is not set — production migration drift and schema shape were NOT checked. Only staging was verified. Add the secret (production project ref ozucdzovmcqvepbozvqf) to enable the production legs."
