version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a version is published before proposing it, so a
    # compromised/unstable release has time to be caught and pulled upstream.
    cooldown:
      default-days: 7
    # Lowered 5 -> 3 on 2026-07-26: every open Dependabot PR costs a CI run (~8.8
    # runner-min) plus a Security Scan run (~3.4) on each push it receives, and a
    # backlog of 5 simultaneous dependency PRs was a meaningful share of the Actions
    # bill. Three at a time still keeps updates flowing; the rest just queue.
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # Major version bumps for these packages need a deliberate manual upgrade
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/*"
        update-types: ["version-update:semver-major"]
      # pdfjs-dist 6 is held deliberately (#4221, 2026-09-23). Its legacy/ build no longer
      # polyfills Promise.withResolvers — it calls it 27 times in pdf.min.mjs and 14 in
      # pdf.worker.min.mjs with nothing defining it, where 5.4.296's legacy build ships the
      # core-js polyfill in both files. Taking the bump as it stood reintroduced the
      # 2026-09-14 outage, when managers across the field opened a CV on an older phone
      # browser and got "Promise.withResolvers is not a function" instead of the page.
      #
      # The RUNTIME half of that is now solved and the hold no longer rests on it: we ship
      # our own polyfill, prepended by scripts/sync-pdfjs-assets.mjs into BOTH served files
      # (the worker has its own global, so one copy would not cover it). 6.3.289 was put
      # through tests/pdfjs-legacy-browser-assets.test.ts as a candidate, via
      # PHX_PDFJS_DIST_ROOT, and passes.
      #
      # What the hold is still for: v6 changes the API surface, which red-lines typecheck
      # and the unit suite, and that migration is a deliberate piece of work rather than a
      # dependabot PR. Keep this entry until someone does it; when they do, take the bump,
      # re-run the sync script, and let the guard confirm nothing else went unpolyfilled.
      # Pinned by tests/pdfjs-legacy-browser-assets.test.ts and
      # tests/pdfjs-browser-polyfill.test.ts.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2 # lowered from 3 — same Actions-cost reason as the npm limit above
    labels:
      - dependencies
