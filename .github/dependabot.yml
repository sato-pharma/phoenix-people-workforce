version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a version is published before proposing it, so a
    # compromised/unstable release has time to be caught and pulled upstream.
    cooldown:
      default-days: 7
    # Lowered 5 -> 3 on 2026-07-26: every open Dependabot PR costs a CI run (~8.8
    # runner-min) plus a Security Scan run (~3.4) on each push it receives, and a
    # backlog of 5 simultaneous dependency PRs was a meaningful share of the Actions
    # bill. Three at a time still keeps updates flowing; the rest just queue.
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # Major version bumps for these packages need a deliberate manual upgrade
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/*"
        update-types: ["version-update:semver-major"]
      # pdfjs-dist 6 is held deliberately (#4221, 2026-09-23). Its legacy/ build no longer
      # polyfills Promise.withResolvers — it calls it 27 times in pdf.min.mjs and 14 in
      # pdf.worker.min.mjs with nothing defining it, where 5.4.296's legacy build ships the
      # core-js polyfill in both files. Taking the bump reintroduces the 2026-09-14 outage,
      # when managers across the field opened a CV on an older phone browser and got
      # "Promise.withResolvers is not a function" instead of the page. Moving to 6 means
      # first deciding the phone-browser baseline can rise (roughly Chrome 119 / Safari 17.4),
      # or shipping our own polyfill ahead of BOTH the library and the worker — the worker
      # runs in its own global, so one polyfill does not cover it.
      # Pinned by tests/pdfjs-legacy-browser-assets.test.ts.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2 # lowered from 3 — same Actions-cost reason as the npm limit above
    labels:
      - dependencies
