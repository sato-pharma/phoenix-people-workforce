version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait 7 days after a version is published before proposing it, so a
    # compromised/unstable release has time to be caught and pulled upstream.
    cooldown:
      default-days: 7
    # Lowered 5 -> 3 on 2026-07-26: every open Dependabot PR costs a CI run (~8.8
    # runner-min) plus a Security Scan run (~3.4) on each push it receives, and a
    # backlog of 5 simultaneous dependency PRs was a meaningful share of the Actions
    # bill. Three at a time still keeps updates flowing; the rest just queue.
    open-pull-requests-limit: 3
    labels:
      - dependencies
    ignore:
      # Major version bumps for these packages need a deliberate manual upgrade
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@supabase/*"
        update-types: ["version-update:semver-major"]
      # pdfjs-dist majors stay MANUAL, and the 6.x migration is why this entry earns its
      # place rather than being caution by habit. #4221 held the dependabot PR on
      # 2026-09-23 and the migration shipped as its own piece of work. A single major moved
      # two things, neither of which a green dependabot PR could have shown:
      #
      #   1. It WITHDREW a polyfill. 6.x's legacy build still bundles core-js but dropped
      #      Promise.withResolvers, which it calls 27 times in pdf.min.mjs and 14 in the
      #      worker. Merged as it stood, that reintroduced the 2026-09-14 outage, when
      #      managers across the field opened a CV on an older phone browser and got
      #      "Promise.withResolvers is not a function" instead of the page. We now carry
      #      that fallback ourselves, prepended into BOTH served files by
      #      scripts/sync-pdfjs-assets.mjs (the worker has its own global).
      #   2. It MOVED DECODERS OUT OF THE BUNDLE. JBIG2 and CCITTFax — how a scanned or
      #      faxed page is encoded, i.e. a large share of the CVs this app reads — became
      #      jbig2.wasm, fetched from a `wasmUrl` that defaults to null. Left unserved, an
      #      ordinary CV renders perfectly and a scanned one comes up blank.
      #
      # Both are invisible to typecheck, to lint, and to a reviewer reading the diff. A
      # major here means putting the candidate through
      # tests/pdfjs-legacy-browser-assets.test.ts first via PHX_PDFJS_DIST_ROOT, then
      # re-running the sync script and committing what it writes. Minors and patches flow
      # normally. Pinned by tests/pdfjs-legacy-browser-assets.test.ts and
      # tests/pdfjs-browser-polyfill.test.ts.
      - dependency-name: pdfjs-dist
        update-types: ["version-update:semver-major"]
      # puppeteer-core and sharp are installed into the production image a SECOND time, from
      # infra/runtime-extras, whose pins must equal pnpm-lock.yaml (tests/offer-pdf-runtime.test.ts,
      # tests/dockerfile-reproducible.test.ts). Dependabot rewrites package.json and the lockfile
      # but cannot run scripts/sync-runtime-extras.mjs, so every PR it opens for either is red by
      # construction: puppeteer-core 25.13.0 went red twice, 19 and 20 Oct 2026. Both move with the
      # weekly dependency refresh instead, whose lockfile.yml run syncs the image's pin (26 Oct).
      - dependency-name: puppeteer-core
      - dependency-name: sharp
      # NOT ignored, and worth actually reading when one arrives: pdf-parse is the ONLY reason a
      # second pdfjs-dist (5.4.296) is in the tree, because 2.4.5 pins that version exactly. If a
      # future pdf-parse moves to pdfjs-dist 6.x, that PR is what collapses the two copies into
      # one — say so in the review rather than merging it as routine. Do NOT try to force the same
      # result with a pnpm override: pdfjs 6 removed PDFDocumentProxy.destroy(), pdf-parse calls it
      # in a finally, and a throw there discards the extracted text. Measured 2026-09-23; the full
      # reading is in scripts/verify-standalone-canvas.mjs.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2 # lowered from 3 — same Actions-cost reason as the npm limit above
    labels:
      - dependencies
