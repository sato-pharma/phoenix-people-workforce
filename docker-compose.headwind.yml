# Headwind MDM + RustDesk — the company's own device-management server.
#
# 🔴 THIS IS NO LONGER HOW THE COMPANY RUNS IT — IT IS THE OPTIONAL SELF-HOSTED PATH, KEPT ON
# PURPOSE. Since 2026-09-25, at the owner's instruction: Headwind runs on RAILWAY (already paid for,
# already in europe-west4, already deploying from this repository — see
# infra/headwind-phoenix-actions/railway.toml) and the remote screen uses RUSTDESK'S OWN FREE EU
# RELAY. No box is rented, and the whole of §4 of the runbook changed with it.
#
# WHAT THIS FILE IS STILL FOR. One thing Railway genuinely cannot do: it allows ONE TCP proxy port
# per service and NO UDP at all, while RustDesk's ID server needs 21115–21119 TCP plus 21116 UDP.
# So the day the company wants to OWN the relay rather than share RustDesk's — an SLA and custody,
# not secrecy, since RustDesk is NaCl end-to-end encrypted either way — it needs a real box, and
# this file is that box, unchanged and ready:
#
#   docker compose --env-file .env.headwind -f docker-compose.headwind.yml up -d
#
# It is NOT Supabase either, and never should be: that is a database, and it is the PAYROLL
# database — a device-management server talking to reps' tablets all day does not belong beside it.
#
# 🔴 THIS FILE IS NOT RUN BY PHOENIX AND IS NOT PART OF THE APP. It is kept in the repository so the
# path the company may take is described in version control rather than in somebody's memory of what
# they typed once. Nothing in CI builds or starts it.
#
# 🔴 HEADWIND NEEDS AN EXTERNAL POSTGRES — its own documentation says a database installation on
# localhost DOES NOT WORK — which is why `db` below is a service of its own rather than something
# switched on inside the hmdm container.
#
# 🔴 RUSTDESK RUNS ON `network_mode: host` AND THAT IS NOT A SHORTCUT. Its relay needs fixed ports
# 21115–21119 on both TCP and UDP with the real client addresses visible; behind Docker's NAT the
# hole-punching that keeps sessions off the relay stops working and every session becomes slow.
#
# 🔴 BACK UP TWO THINGS OR THE FLEET IS UNRECOVERABLE: the `headwind-db` volume (every tablet, its
# rules and its history) and `rustdesk-data` (the relay's key pair — losing it means re-pairing every
# tablet by hand). A snapshot of the box covers both; take one before any upgrade.

name: phoenix-headwind

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SQL_BASE}
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASS}
    volumes:
      - headwind-db:/var/lib/postgresql/data
    healthcheck:
      # The hmdm container fails its own first-run configuration against a database that is merely
      # LISTENING but not ready, and then needs FORCE_RECONFIGURE to try again — so it waits for this.
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER} -d ${SQL_BASE}"]
      interval: 10s
      timeout: 5s
      retries: 12

  hmdm:
    # 🔴 PIN A REAL PUBLISHED TAG IN .env.headwind BEFORE THE FIRST RUN. `latest` on a server that
    # manages a hundred company tablets means an upgrade nobody chose can arrive with a restart. The
    # example file explains where to read the current tag; this reads it rather than hard-coding one
    # that may not exist.
    #
    # 🔴 THIS IS BUILT, NOT PULLED, AND THAT IS THE WHOLE POINT. The Dockerfile in
    # infra/headwind-phoenix-actions/ EXTENDS the pinned Headwind image with one small Apache-2.0
    # add-on of ours — a `SyncResponseHook` that sets the five device fields the free agent ALREADY
    # obeys (lock, lockMessage, factoryReset, passwordReset, reboot) and serves the three confirmation
    # paths the agent already POSTs to. Nothing on any tablet changes. Pull the stock image instead and
    # lock, lost mode, factory reset and reset-the-screen-lock answer a refusal that reads like a broken
    # tablet. `image:` is still named so the built result is tagged and `docker compose up` after a
    # build does not silently pull over it.
    build:
      context: ./infra/headwind-phoenix-actions
      args:
        HEADWIND_IMAGE_TAG: ${HEADWIND_IMAGE_TAG}
    image: phoenix-hmdm:${HEADWIND_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The admin account created on first run, and where the tablets will reach this server. The
      # domain must already point at this box — Headwind asks Let's Encrypt for a certificate on
      # startup and a name that does not resolve here fails that request.
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      PROTOCOL: https
      SQL_HOST: db
      SQL_BASE: ${SQL_BASE}
      SQL_USER: ${SQL_USER}
      SQL_PASS: ${SQL_PASS}
      # Left empty on purpose. Setting it re-runs the whole first-time configuration, which is what
      # you want ONCE after a failed first start and never afterwards.
      FORCE_RECONFIGURE: ${FORCE_RECONFIGURE:-}
    ports:
      - "443:443"
      # The tablets' own channel — the agent checks in here. Not the admin console.
      - "31000:31000"
    volumes:
      - headwind-letsencrypt:/etc/letsencrypt
      - headwind-work:/usr/local/tomcat/work

  # RustDesk ID / rendezvous server. This is what a tablet and a computer both sign in to so they can
  # find each other.
  hbbs:
    image: rustdesk/rustdesk-server:${RUSTDESK_IMAGE_TAG}
    command: hbbs
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./rustdesk-data:/root
    depends_on:
      - hbbr

  # RustDesk relay. Used only when two ends cannot reach each other directly; it carries the screen
  # when they cannot, which is why it lives on the same box and not on somebody else's free service.
  hbbr:
    image: rustdesk/rustdesk-server:${RUSTDESK_IMAGE_TAG}
    command: hbbr
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./rustdesk-data:/root

volumes:
  headwind-db:
  headwind-letsencrypt:
  headwind-work:
