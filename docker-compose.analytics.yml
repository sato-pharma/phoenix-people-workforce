# Metabase Open Source — local analytics setup.
# Run alongside the Phoenix dev server.
# Never use production database credentials here.
# Copy .env.analytics.example → .env.analytics and fill in values.

services:
  metabase:
    image: metabase/metabase:v0.52.5
    container_name: phoenix_metabase
    hostname: metabase
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "3030:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:-metabase}
      MB_DB_PORT: ${METABASE_DB_PORT:-5432}
      MB_DB_USER: ${METABASE_DB_USER}
      MB_DB_PASS: ${METABASE_DB_PASS}
      MB_DB_HOST: ${METABASE_DB_HOST}
      # Embedding secret (used for signed embed URLs from Phoenix)
      MB_EMBEDDING_SECRET_KEY: ${METABASE_EMBEDDING_SECRET_KEY}
      # Site URL — used for absolute embed links
      MB_SITE_URL: http://localhost:3030
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  metabase_data:
    driver: local
