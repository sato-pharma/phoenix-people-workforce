title = "phoenix-workforce gitleaks config"

[extend]
# Start from gitleaks' built-in ruleset (AWS keys, private keys, generic
# high-entropy tokens, etc.) and layer repo-specific path exclusions on top.
useDefault = true

[allowlist]
# Applies to `regexes` below only — `paths` always matches the file path regardless.
regexTarget = "line"
paths = [
  '''node_modules/''',
  '''\.next/''',
  '''dist/''',
  '''pnpm-lock\.yaml''',
  # The Office golden rule's password VERIFIER (scrypt salt + derived key, 128 hex chars each).
  # It is deliberately committed and is not a secret: it can check the owner's password and can
  # never supply it. Without this exclusion the generic high-entropy rule would fail the required
  # `secret-scan` check the moment he arms the lock with `pnpm run office-rule:password`.
  '''src/lib/sales/office-golden-rule\.lock\.json''',
  # The closing engine template: the owner's .xlsm, emptied of its data and committed as one
  # base64 blob wrapped at 120 characters (it opens `UEsDBA...`, a zip header). Every line of it
  # is high-entropy by construction, so the generic high-entropy rule hits it on the luck of the
  # draw — it passed on one build of the template and failed on the very next, with no credential
  # involved in either. Nothing here is written by hand: the file is regenerated wholesale by
  # `scripts/build-closing-engine-template.mjs` and reviewed as the binary it is. The tradeoff is
  # worth stating plainly — a secret sitting inside the SOURCE workbook would ride along unseen,
  # so what has to be trusted here is the workbook, not this scan. Owner-approved 2026-09-03.
  '''src/lib/sales/closing-engine-template-generated\.ts''',
]
regexes = [
  # This codebase names internal step/template/milestone identifiers "key"/"stepKey"/
  # "templateKey" (e.g. `key: "p1_resignations"`, `stepKey === "p1_other_deductions"`,
  # `templateKey: "probation_day30"`), which trips the generic-api-key rule on every
  # occurrence -- these are plain code identifiers, not secrets. Targets the LINE
  # (regexTarget=line above) so it only suppresses this specific "key"-named
  # property/comparison shape, not any alphanumeric string anywhere.
  '''(?i)key\s*(:|===)\s*"[a-zA-Z][a-zA-Z0-9_]*"''',
]
