# How Railway builds and runs the company's Headwind MDM server.
#
# WHY RAILWAY AND NOT A RENTED BOX. The original plan was one small VPS in Europe running Headwind
# and RustDesk together. Headwind moved here on 2026-09-25 at the owner's instruction, after an
# evening of failed sign-ups at three hosting providers bought nothing the company did not already
# have: Railway is already paid for, already in Europe (europe-west4), already deploys from this
# repository, and already terminates TLS. The RustDesk relay did NOT move here and cannot — see
# below.
#
# 🔴 RUSTDESK CAN NEVER RUN ON RAILWAY, AND THAT IS A HARD PLATFORM LIMIT, NOT A CONFIGURATION ONE.
# Railway allows ONE TCP proxy port per service and NO UDP AT ALL. RustDesk's ID server needs
# 21115–21119 on TCP plus 21116 on UDP, and the UDP port is the hole-punching that keeps sessions
# peer-to-peer instead of relayed. So the relay stays on RustDesk's own free EU servers, which is
# safe because RustDesk is NaCl end-to-end encrypted — a relay carries ciphertext it cannot read.
# Anyone who later wants to own the relay needs a real box; docker-compose.headwind.yml still
# describes that path in full and nothing here removes it.
#
# 🔴 THREE THINGS ARE SERVICE SETTINGS, NOT FILE SETTINGS — this file cannot express them and they
# are set once in the Railway UI:
#
#   Root Directory   infra/headwind-phoenix-actions   (or Railway builds the Next.js app instead)
#   Variables        the block in docs/devices/headwind-rustdesk.md §4.2
#   Public domain    generate one, or attach mdm.satopharma.com
#
# 🔴 AND THE PORT IS UNPROVEN UNTIL IT RUNS ONCE. With PROTOCOL=http Headwind serves plain HTTP for
# something else to terminate TLS in front of — which is exactly what Railway does — but this repo
# has never watched it start on Railway, so which port Tomcat binds is read from the first deploy's
# logs, not assumed here. If Railway's own detection picks the wrong one, set the service's target
# port by hand. Nothing below guesses at it.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# 🔴 ON_FAILURE, NOT ALWAYS. Headwind's entry point configures itself against the database on first
# run; a container that is restarted forever through a genuine configuration failure hides the one
# log line that says what went wrong, and the symptom reads as "the tablets cannot reach the server".
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# One instance. Headwind keeps working state on disk and its first run configures the schema — two
# replicas racing that is not a scale-up, it is a corrupted install.
numReplicas = 1
