# The Fly WORKER — the background jobs' home while Railway cannot deploy (owner, 2026-10-22: "Separate worker on Fly").
# It stands in for Railway's phoenix-workforce-worker: the same image as the standby website, run as the worker, and
# the host the worker's cron-job.org jobs call. Account: docs/deployment.md, "The worker on Fly".
#
# 🔴 MOVED BY THE GO-LIVE (re-audit, 2026-10-22). emergency-host.yml's go-live deploys this app with the SAME image
# right after the website, so the two never run different code. By hand only when that step reports a failure, from
# the repo root:
#   flyctl deploy -a phoenix-worker-standby -c infra/fly-standby/fly-worker.toml \
#     --image registry.fly.io/phoenix-hr-standby:<sha> --regions fra --ha=false --strategy rolling
#
# 🔴 ONE WORKER ONLY. Railway's worker is stopped and set to PHOENIX_PROCESS_ROLE=web while this one runs; two would
# run every job twice against one database and point two pollers at one iReports360 account.
#
# RAILWAY_ENVIRONMENT_NAME = "production" is deliberate: it is the CRM poller's host pin (src/lib/crm/live-poller.ts,
# resolveInProcessHostRefusal). It also makes the release gate REQUIRED here: the image carries RAILWAY_GIT_COMMIT_SHA
# (fallback-image.yml builds it in), so /api/readyz reads the commit's recorded gate (read live 22 Oct: required, passed,
# "recorded"). Only a gated commit reaches this app anyway: the go-live's own gate job refuses any other.
app = "phoenix-worker-standby"

# 🔴 FRANKFURT. Production must stay in Europe, beside the Frankfurt Supabase project.
primary_region = "fra"

[http_service]
  internal_port = 8080
  force_https = true
  # A worker that idles to zero machines stops every scheduler and the poller with it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/api/healthz"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048mb"

[env]
  PHOENIX_PROCESS_ROLE = "worker"
  PHOENIX_LIVE_CRM_POLL = "true"
  PHOENIX_HOST = "fly-worker"
  RAILWAY_ENVIRONMENT_NAME = "production"
