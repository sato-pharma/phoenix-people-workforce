# For a NEW, separately approved service only. Repository root is the build context.
[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/phoenix-mcp/Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/readyz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
