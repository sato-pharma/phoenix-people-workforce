<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Arabic in every server-printed PDF and picture (Dockerfile, runner stage).

  Noto Sans Math carries the basic Arabic letters, for formulas, but it cannot JOIN them. A page whose
  own font list names no Arabic face falls back through fontconfig, and fontconfig chose Noto Sans
  Math before Noto Sans Arabic for regular-weight text. Every word then printed letter by letter, in
  the wrong order: the expense trip PDF of 25 Nov 2026 ("الشاوريه - مركز نجع حمادي - قنا" and the
  employee's own note) and the Make it happen PDF both carried it. Bold text happened to land on
  Noto Sans Arabic, so half a page read correctly and hid the fault.

  Refusing the maths font makes that fallback land on Noto Sans Arabic, which shapes. Arrows and
  maths signs still print (other installed faces carry them). Proven on the image's own Alpine
  Chromium and fonts: without this file the regular-weight Arabic came apart; with it every line
  joined. Pinned by tests/server-arabic-fontconfig.test.ts.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/NotoSansMath-*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
