# SonarQube Cloud project configuration.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/analysis-parameters
#
# sonar.organization / sonar.projectKey identify this repo's project on sonarcloud.io.
# Neither is a secret - only SONAR_TOKEN (see .github/workflows/sonarqube.yml) is.
sonar.organization=gawish-1997
sonar.projectKey=Gawish-1997_phoenix-people-workforce
sonar.projectName=Phoenix Workforce

# --- Source layout ---------------------------------------------------------------
# sonar.sources=. plus the exclusions below covers the Next.js app router (app/),
# domain libraries (src/), ops/migration scripts (scripts/), Supabase SQL
# (supabase/), the local-attendance-agent .NET tool, and .github/workflows itself
# (SonarQube Cloud has a dedicated GitHub Actions analyzer). tests/ is carved out
# via sonar.tests below rather than analyzed as application source.
sonar.sources=.
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# --- Exclusions (kept out of analysis entirely) -----------------------------------
# tests/** is listed here too so it is not double-indexed as both a source and a
# test - sonar.tests=tests above is what actually keeps it in scope, as test code.
sonar.exclusions=**/node_modules/**,\
  .next/**,\
  coverage/**,\
  output/**,\
  outputs/**,\
  dist/**,\
  build/**,\
  public/**,\
  tests/**,\
  xlsx/**,\
  **/*.xlsx,\
  **/*.csv,\
  pnpm-lock.yaml,\
  **/*.tsbuildinfo,\
  .eslintcache,\
  next-env.d.ts,\
  .codex-worktrees/**,\
  _wt-*/**,\
  scripts/tmp/**,\
  supabase/.temp/**,\
  local-attendance-agent/bin/**,\
  local-attendance-agent/obj/**

# --- JS/TS analyzer memory --------------------------------------------------------
# First real run (2026-08-04, PR #1744) OOM'd: the analyzer's embedded Node "bridge"
# process defaulted to a 2240 MB heap cap and died mid-way through this repo's 3063
# source files ("Node.js process running out of memory ... Try setting
# sonar.javascript.node.maxspace to a higher value" - straight from the scanner's own
# error output). Same class of problem ci.yml's typecheck job already hit and fixed
# with a raised Node heap limit, just a different tool. 4096 (of the GitHub-hosted
# runner's 7168 MB total) leaves headroom for the scanner's own JVM process and OS.
sonar.javascript.node.maxspace=4096

# --- Coverage import (JS/TS) -------------------------------------------------------
# Produced by this repo's own test runner (tests/run-tests.ts) via c8's lcov
# reporter - see the "Test with coverage" step in .github/workflows/sonarqube.yml.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# --- Coverage exclusions ----------------------------------------------------------
# These files stay FULLY ANALYSED for bugs, vulnerabilities and code smells. They are
# dropped from the COVERAGE METRIC only, because unit-testing them needs a browser or
# a running server - so they can never be anything but 0%, and their sheer weight
# drowns the signal from the code that IS testable.
#
# Measured 2026-08-05 with `c8 --all` (the honest denominator), 605 test files:
#
#   AREA                        COVERAGE          LINES
#   src/ other .ts                72.7%           3,006 / 4,132
#   src/lib/ domain .ts           44.3%         114,355 / 257,902
#   *.tsx  (React UI)              0.0%               0 / 192,386
#   app/   (routes + pages)        0.0%               0 / 68,113
#   ------------------------------------------------------------
#   repo-wide                     22.5%         117,862 / 523,394
#   excluding the two 0% blocks   44.8%         117,431 / 262,207
#
# 260,499 lines - half the codebase - are React components and Next.js routes sitting
# at exactly 0.0%. Not "poorly tested": never LOADED by a test. Leaving them in the
# denominator makes the metric measure how much UI the repo has rather than how well
# its logic is tested, and makes the gate permanently red. A permanently red check is
# worse than no check: it teaches everyone to scroll past CI, which is how a real
# failure eventually ships.
#
# What stays measured is the domain logic in src/lib/**/*.ts - payroll, sales,
# approval chains, pricing - where a silent regression actually costs money.
#
# Branch coverage on the code the tests DO reach is 73.8%. That is the figure that
# reflects how well the decision logic is exercised; the low line number is a
# denominator artefact, not a testing failure.
sonar.coverage.exclusions=app/**,\
  **/*.tsx,\
  scripts/**,\
  supabase/**,\
  local-attendance-agent/**,\
  **/*.mjs,\
  **/*.d.ts

# --- SQL dialect ---------------------------------------------------------------
# supabase/**/*.sql is PostgreSQL (PL/pgSQL). SonarQube Cloud maps the .sql suffix
# to PL/SQL (Oracle) by default, and a suffix can only belong to one dialect - left
# alone, every Supabase migration would be parsed with the wrong SQL grammar.
sonar.postgresql.file.suffixes=.sql
sonar.plsql.file.suffixes=.pls,.plb,.pks,.pkb,.pck

# --- Quality Gate ----------------------------------------------------------------
# Fails the "SonarQube Cloud Scan" workflow step (non-zero exit) if the Quality
# Gate fails, so it shows as a red check on the commit/PR. This does not touch
# GitHub branch protection - see the setup report for how to make it a required
# check.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
