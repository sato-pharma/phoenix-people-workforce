<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phoenix Email</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
    }

    .outer {
      width: 100%;
      background: #f5f5f5;
      padding: 36px 16px;
    }

    .content {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .logo-wrap {
      text-align: center;
      padding: 52px 0 24px;
    }

    .brand-word {
      margin: 0;
      font-family: "Product Sans", Arial, Helvetica, sans-serif;
      font-size: 49px;
      line-height: 60px;
      letter-spacing: 0;
      color: #1a73e8;
    }

    .brand-word span:first-child,
    .brand-word span:nth-child(2),
    .brand-word span:nth-child(3),
    .brand-word span:nth-child(4) {
      font-size: 49px;
    }

    .headline {
      text-align: center;
      margin: 0;
      padding: 0 40px;
      font-size: 36px;
      line-height: 44px;
      font-weight: 400;
      color: #202124;
    }

    .copy {
      text-align: center;
      padding: 28px 44px 0;
      color: #5f6368;
      font-size: 16px;
      line-height: 26px;
    }

    .button-wrap {
      text-align: center;
      padding: 28px 44px 4px;
    }

    .button {
      display: inline-block;
      background-color: #1a73e8;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 14px;
      line-height: 20px;
      font-weight: 400;
      border-radius: 4px;
      padding: 13px 28px;
    }

    .small {
      text-align: center;
      padding: 22px 44px 26px;
      color: #5f6368;
      font-size: 14px;
      line-height: 20px;
    }

    .divider {
      border-top: 1px solid #f0f1f3;
      margin: 4px 32px 0;
    }

    .social-wrap {
      text-align: center;
      padding: 26px 10px 28px;
    }

    .social-table {
      margin: 0 auto;
      width: 260px;
    }

    .social-cell {
      text-align: center;
      padding: 0 8px;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: inline-block;
    }

    .social-icon img {
      width: 42px;
      height: 42px;
      border: 0;
      display: block;
      border-radius: 50%;
      background: #f8f8f8;
      border: 1px solid #f2f2f2;
      padding: 8px;
      box-sizing: border-box;
    }

    @media only screen and (max-width: 640px) {
      .content {
        width: 100%;
      }

      .brand-word,
      .brand-word span:first-child,
      .brand-word span:nth-child(2),
      .brand-word span:nth-child(3),
      .brand-word span:nth-child(4) {
        font-size: 38px;
        line-height: 48px;
      }

      .headline {
        padding: 0 22px;
        font-size: 30px;
        line-height: 38px;
      }

      .copy,
      .button-wrap,
      .small {
        padding-left: 24px;
        padding-right: 24px;
      }
    }
  </style>
</head>
<body>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="outer">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="content">
          <tr>
            <td class="logo-wrap">
              <div class="brand-word">Phoenix</div>
            </td>
          </tr>
          <tr>
            <td>
              <h1 class="headline">Welcome to Phoenix</h1>
            </td>
          </tr>
          <tr>
            <td class="copy">
              <p style="margin: 0;">
                Verify your email and start using your account.
              </p>
            </td>
          </tr>
          <tr>
            <td class="button-wrap">
              <a class="button" href="https://example.com/login">Confirm account</a>
            </td>
          </tr>
          <tr>
            <td class="small">
              This is an automated message.
              If you did not request this, you can ignore it and nothing will happen.
            </td>
          </tr>
          <tr>
            <td class="divider"></td>
          </tr>
          <tr>
            <td class="social-wrap">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="social-table">
                <tr>
                  <td class="social-cell">
                    <span class="social-icon">
                      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e2/Phoenix_logo.svg" alt="Phoenix logo">
                    </span>
                  </td>
                  <td class="social-cell">
                    <span class="social-icon">
                      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn logo">
                    </span>
                  </td>
                  <td class="social-cell">
                    <span class="social-icon">
                      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook logo">
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
